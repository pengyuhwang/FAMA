- name: LLM_Factor3333333
  expression: SCALE((REPLACE_NAN_INF(CORREL((VWAP - OPEN), RET, 12), 0) * -1))
  explanation: 该因子度量开盘至VWAP的日内溢价与收益的相关性并取反以捕捉过度交易回落
- name: LLM_Factor4444444
  expression: (RANK(((AMOUNT / (VOLUME + 1e-07)) - OPEN)) * (TS_RANK((HIGH - LOW),
    10) - 1))
  explanation: 衡量开盘相对交易均价的偏离在窄幅行情中的修复动能。
- name: LLM_Factor5555555
  expression: IF(LT(TS_STDDEV(RET, 20), TS_STDDEV(RET, 60)), RANK((OPEN - TS_MEAN((AMOUNT
    / (VOLUME + 1e-07)), 10))), RANK((TS_MEAN((AMOUNT / (VOLUME + 1e-07)), 10) - OPEN)))
  explanation: 在低波动状态下利用开盘价相对换手价格均值的偏离捕捉回归，高波动时反向处理。
- name: LLM_Factor6666666
  expression: (RANK(CORREL(RET, (CLOSE - VWAP), 10)) * -1)
  explanation: 衡量收益与盘中偏离VWAP的相关性强弱，捕捉因资金交易导致的均值回归压力。
- name: LLM_Factor7777777
  expression: RANK(CLOSE - DELAY(CLOSE, 5)) - RANK(CLOSE - DELAY(CLOSE, 20))
  explanation: 利用短期动量减去长期动量，构建期限结构的差分因子，识别短期加速上涨或超卖信号。
- name: LLM_Factor8888888
  expression: (TS_MIN(LOW, 10) - TS_MIN(LOW, 30)) / (TS_MEAN(CLOSE, 30) + 1e-07)
  explanation: 衡量短期支撑位相对于长期支撑位的抬升幅度，反映底部结构的稳固程度。
- name: LLM_Factor9999999
  expression: RANK(((CLOSE - TS_MEAN(VWAP, 10)) / (TS_STDDEV(CLOSE, 20) + 1e-07)))
  explanation: 用相对波动标准化后的价格对VWAP偏离度评估超涨超跌。