- name: alpha158_klen
  expression: ((HIGH - LOW) / OPEN)
  explanation: 该因子以开盘价为基准衡量当日高低价区间的相对幅度，反映日内波动性与市场不确定性。
- name: alpha158_kmid2
  expression: ((CLOSE - OPEN) / ((HIGH - LOW) + 1e-12))
  explanation: 衡量当日开收盘净变动相对于最高—最低价区间的占比，反映多空力量与趋势推进效率，绝对值越大表示在给定波动下方向性更强（正为多头、负为空头）。
- name: alpha158_kup
  expression: ((HIGH - MAX(OPEN, CLOSE)) / OPEN)
  explanation: 该因子度量当日高点超出开/收盘较高价的幅度相对于开盘价的比例，反映盘中短暂买盘推动的冲高未能延续（上影线）和随后的回吐压力。
- name: alpha158_kup2
  expression: ((HIGH - MAX(OPEN, CLOSE)) / ((HIGH - LOW) + 1e-12))
  explanation: 衡量上影线占当日振幅的比例，数值越大表示开/收盘离最高价更远、上攻受阻抛压更强，短期偏空。
- name: alpha158_klow
  expression: ((MIN(OPEN, CLOSE) - LOW) / OPEN)
  explanation: 该因子等于K线下影线长度相对开盘价的比例，用于刻画盘中探底回升与买盘承接力度，数值越大说明下方支撑更强。
- name: alpha158_klow2
  expression: ((MIN(OPEN, CLOSE) - LOW) / ((HIGH - LOW) + 1e-12))
  explanation: 该因子度量当日下影线占全日振幅的比例，用以刻画盘中对下跌的拒绝与买盘承接强度，值越大表示低位存在更强支撑与抄底力量。
- name: alpha158_ksft
  expression: ((((CLOSE * 2) - HIGH) - LOW) / OPEN)
  explanation: 该因子反映收盘价相对当日高低价中点的偏离方向与强度（以开盘价缩放），值越大表示收盘偏向区间上沿、买盘更强，值越小则卖压更重。
- name: alpha158_ksft2
  expression: ((((CLOSE * 2) - HIGH) - LOW) / ((HIGH - LOW) + 1e-12))
  explanation: 衡量收盘价相对当日高低区间的偏离度，数值越高表示收盘靠近高位、买盘占优与上行动能强，越低则靠近低位、卖压占优与下行动能强。
- name: alpha158_open0
  expression: (OPEN / CLOSE)
  explanation: 衡量当日开盘价相对收盘价的强弱，反映隔夜信息与流动性冲击在日内被买卖压力消化的方向与程度。
- name: alpha158_high0
  expression: (HIGH / CLOSE)
  explanation: 衡量当日最高价相对收盘价的溢价，刻画上影线与盘中冲高回落程度，反映收盘卖压及短期情绪波动。
- name: alpha158_low0
  expression: (LOW / CLOSE)
  explanation: 衡量当日最低价相对收盘价的折价程度，体现盘中下行冲击、流动性与尾盘买盘回补强弱（值越低表示日内下探更深、下行尾部风险更高且收盘回补更明显）。
- name: alpha158_vwap0
  expression: ((AMOUNT / (VOLUME + 1e-06)) / CLOSE)
  explanation: 该因子近似等于VWAP/收盘价，衡量收盘价相对当日成交重心的溢（折）价程度，从而反映尾盘资金供需与价格压力。
- name: alpha158_roc5
  expression: (DELAY(CLOSE, 5) / CLOSE)
  explanation: 衡量近5日相对当前的价格变动强度，值越大表示近期下跌（短期动量弱、可能均值回归），值越小表示近期上涨（短期动量强）。
- name: alpha158_roc10
  expression: (DELAY(CLOSE, 10) / CLOSE)
  explanation: 衡量10日前收盘价相对当前价格的比值，等价于近10日累计收益的单调变换，从而反映短期动量/均值回归压力与市场情绪变化。
- name: alpha158_roc20
  expression: (DELAY(CLOSE, 20) / CLOSE)
  explanation: 反映过去20日价格动量的强弱，值越大说明近20日价格下跌更多（动量弱、潜在反转），值越小说明上涨更多（动量强）。
- name: alpha158_roc30
  expression: (DELAY(CLOSE, 30) / CLOSE)
  explanation: 该因子以30日前收盘价与当前价之比刻画近一月价格动量（即过去30日收益的反向度量），数值越大表示近期回撤更深、越小表示上涨更强，反映短期动量/反转效应与投资者情绪变化。
- name: alpha158_roc60
  expression: (DELAY(CLOSE, 60) / CLOSE)
  explanation: 该因子以60日前收盘价与当前价之比衡量近60日价格动量，实质为60日累计收益的倒数：数值越小表示近期涨幅更大（强势），越大表示近期跌幅更大（弱势）。
- name: alpha158_ma5
  expression: (TS_MEAN(CLOSE, 5) / CLOSE)
  explanation: 该因子衡量当前收盘价相对近5日均价的偏离程度，值越大表示现价低于近期均值（短期超卖、倾向均值回归），值越小表示现价高于均值（短期动量更强或回调风险加大）。
- name: alpha158_ma10
  expression: (TS_MEAN(CLOSE, 10) / CLOSE)
  explanation: 该因子衡量当前收盘价相对近10日均价的偏离，反映短期超买/超卖与均值回归压力（值>1表明当前价低于均价、可能存在反弹空间；值<1则相反）。
- name: alpha158_ma20
  expression: (TS_MEAN(CLOSE, 20) / CLOSE)
  explanation: 该因子衡量当前收盘价相对近20日均价的偏离程度，反映短期相对估值与均值回归/动量压力（值高示相对低估，值低示相对高估）。
- name: alpha158_ma30
  expression: (TS_MEAN(CLOSE, 30) / CLOSE)
  explanation: 该因子以30日均价除以现价，衡量当前价格相对近月均值的偏离程度：值越大表示现价低于均值、具备均值回归/反弹潜力，值越小表示高于均值、存在回落风险或动量延续。
- name: alpha158_ma60
  expression: (TS_MEAN(CLOSE, 60) / CLOSE)
  explanation: 该因子衡量当前价格相对近60日均价的偏离，反映短中期相对高低估与均值回归压力，值>1表示价格低于均值（相对低估/超卖），值<1表示高于均值（相对高估/超买）。
- name: alpha158_std5
  expression: (TS_STDDEV(CLOSE, 5) / CLOSE)
  explanation: 衡量近5日收盘价相对当前价的波动强度（价格标准差/现价），反映短期相对波动率与风险水平，数值越大不确定性越高。
- name: alpha158_std10
  expression: (TS_STDDEV(CLOSE, 10) / CLOSE)
  explanation: 衡量近10日收盘价相对于其价格水平的波动幅度（相对波动率/变异系数），数值越大表示短期不确定性与风险更高、可能需要更高的风险补偿。
- name: alpha158_std20
  expression: (TS_STDDEV(CLOSE, 20) / CLOSE)
  explanation: 该因子度量近20日收盘价的相对波动率（价格标准差相对现价），数值越大表示短期价格不稳定性与不确定性更高、所需风险溢价可能上升。
- name: alpha158_std30
  expression: (TS_STDDEV(CLOSE, 30) / CLOSE)
  explanation: 该因子衡量近30日收盘价相对于当前价的相对波动率，反映短期不确定性与风险水平，值越大说明波动更剧烈且所需风险溢价更高。
- name: alpha158_std60
  expression: (TS_STDDEV(CLOSE, 60) / CLOSE)
  explanation: 该因子以过去60日收盘价的标准差相对于当前收盘价的比例来度量历史波动强度，数值越大表示标的近期不确定性与风险更高、可能需要更高的风险溢价。
- name: alpha158_beta5
  expression: (TS_LINEAR_REGRESSION_SLOPE(CLOSE, 5) / CLOSE)
  explanation: 该因子将近5期收盘价的回归斜率按现价归一，刻画短期价格趋势的相对强度，即单位时间的预期涨跌速度。
- name: alpha158_beta10
  expression: (TS_LINEAR_REGRESSION_SLOPE(CLOSE, 10) / CLOSE)
  explanation: 以近10期收盘价对时间的回归斜率按当前价标准化得到的无量纲动量指标，衡量单位价格的短期趋势强度，数值越大表示相对上行速度更快、越小（为负）则下行动能更强。
- name: alpha158_beta20
  expression: (TS_LINEAR_REGRESSION_SLOPE(CLOSE, 20) / CLOSE)
  explanation: 该因子将20日收盘价线性回归斜率按现价归一，度量单位价格的近期趋势增长率，从而反映由资金与预期变化驱动的短期动量强弱（值越大上升趋势越强）。
- name: alpha158_beta30
  expression: (TS_LINEAR_REGRESSION_SLOPE(CLOSE, 30) / CLOSE)
  explanation: 以30期收盘价线性回归斜率除以当前价格，衡量近月价格趋势的相对强度与方向，值越大代表上升动能更强、为负代表下行动能更强。
- name: alpha158_beta60
  expression: (TS_LINEAR_REGRESSION_SLOPE(CLOSE, 60) / CLOSE)
  explanation: 该因子以过去60期收盘价的线性回归斜率除以当前价，衡量经价格归一化的中期趋势动量强弱与方向（正值上升、负值下降，绝对值越大趋势越强）。
- name: alpha158_rsqr5
  expression: TS_LINEAR_REGRESSION_R2(CLOSE, 5)
  explanation: 衡量近5日收盘价被线性时间趋势解释的程度，R²越高表示价格走势更平滑、趋势性更强（噪声更小），越低则意味着以震荡与随机波动为主。
- name: alpha158_rsqr10
  expression: TS_LINEAR_REGRESSION_R2(CLOSE, 10)
  explanation: 衡量近10日收盘价被线性趋势解释的程度，高值表示趋势性强、走势更平滑且噪声较低，低值则意味着震荡加剧、可预测性弱。
- name: alpha158_rsqr20
  expression: TS_LINEAR_REGRESSION_R2(CLOSE, 20)
  explanation: 该因子衡量过去20个交易日收盘价对线性时间趋势的拟合度，高值意味着价格趋势明确且动量持续性强，低值则表示行情以震荡与噪声为主、缺乏方向性。
- name: alpha158_rsqr30
  expression: TS_LINEAR_REGRESSION_R2(CLOSE, 30)
  explanation: 衡量过去30期收盘价对线性趋势的拟合度，从而反映价格走势的趋势性与稳定性：R^2越高表示趋势更强更持续、噪声更小，越低则说明走势更随机或以震荡为主。
- name: alpha158_rsqr60
  expression: TS_LINEAR_REGRESSION_R2(CLOSE, 60)
  explanation: 衡量过去60日收盘价变动被线性趋势解释的程度，R²越高表示趋势性与动量更强、价格由信息逐步反映驱动，越低则说明波动更多源于噪声且缺乏持续性。
- name: alpha158_resi5
  expression: (TS_LINEAR_REGRESSION_RESI(CLOSE, 5) / CLOSE)
  explanation: 该因子通过将近5日线性回归残差按当前收盘价标准化，衡量价格相对短期趋势的偏离程度，反映短期错定价与潜在的均值回归压力。
- name: alpha158_resi10
  expression: (TS_LINEAR_REGRESSION_RESI(CLOSE, 10) / CLOSE)
  explanation: 衡量收盘价相对10日线性趋势的比例偏离，反映短期超涨/超跌与随后的均值回归压力。
- name: alpha158_resi20
  expression: (TS_LINEAR_REGRESSION_RESI(CLOSE, 20) / CLOSE)
  explanation: 该因子为收盘价相对其20日线性趋势的归一化残差，衡量短期相对趋势的偏离幅度与潜在均值回归信号。
- name: alpha158_resi30
  expression: (TS_LINEAR_REGRESSION_RESI(CLOSE, 30) / CLOSE)
  explanation: 度量收盘价相对其30日线性趋势的相对偏离（回归残差占价），反映短期情绪/噪声导致的超涨或超跌及可能的均值回归机会。
- name: alpha158_resi60
  expression: (TS_LINEAR_REGRESSION_RESI(CLOSE, 60) / CLOSE)
  explanation: 该因子刻画价格相对其60日线性趋势的相对偏离（以价格归一），反映短期高估/低估程度及潜在的均值回归压力。
- name: alpha158_max5
  expression: (TS_MAX(HIGH, 5) / CLOSE)
  explanation: 反映价格相对近5日高点的偏离度，数值越大表示收盘价离近期高位更远、短期动量较弱且存在回撤。
- name: alpha158_max10
  expression: (TS_MAX(HIGH, 10) / CLOSE)
  explanation: 该因子衡量当前收盘价相对近10日最高价的贴近度，值越大表示较近期高点回撤更深（短期偏弱、可能均值回归），越接近1则表明贴近高位、动量更强。
- name: alpha158_max20
  expression: (TS_MAX(HIGH, 20) / CLOSE)
  explanation: 该因子衡量当前收盘价相对近20日最高价的折价程度，数值越大表示价格远离阶段高点、回撤较深且动量偏弱，越接近1则说明逼近新高、动量更强。
- name: alpha158_max30
  expression: (TS_MAX(HIGH, 30) / CLOSE)
  explanation: 衡量当前收盘价相对近30日最高价的贴水程度，值越接近1表示价格贴近阶段高点、动量更强，值越大表示偏离高点更远、具备更大潜在反弹空间。
- name: alpha158_max60
  expression: (TS_MAX(HIGH, 60) / CLOSE)
  explanation: 该因子衡量当前收盘价相对近60日最高价的折价（回撤）程度，值越大表示价格离阶段高点越远、动能偏弱，接近1则说明贴近新高、趋势较强。
- name: alpha158_min5
  expression: (TS_MIN(LOW, 5) / CLOSE)
  explanation: 该因子刻画当前收盘价相对近5日最低价的贴近程度，数值越大说明价格靠近阶段低点（可能超跌或临近支撑），数值越小说明价格已脱离低位（短期更强或已反弹）。
- name: alpha158_min10
  expression: (TS_MIN(LOW, 10) / CLOSE)
  explanation: 衡量当前收盘价相对近10日最低价的贴近度，刻画短期下行压力与超卖程度（值越大越接近阶段低点，值越小说明已从低点明显回升）。
- name: alpha158_min20
  expression: (TS_MIN(LOW, 20) / CLOSE)
  explanation: 该因子衡量当前收盘价相对近20日最低价的贴近程度，值越大表示价格更接近近期底部（情绪偏弱、潜在均值回归空间大），值越小表示价格已明显脱离低位（动能更强）。
- name: alpha158_min30
  expression: (TS_MIN(LOW, 30) / CLOSE)
  explanation: 该因子衡量收盘价相对近30日最低价的相对位置，值越大表示价格贴近阶段低点（风险溢价与悲观预期更高），值越小表示价格远离低点（动能更强、风险缓解）。
- name: alpha158_min60
  expression: (TS_MIN(LOW, 60) / CLOSE)
  explanation: 该因子衡量当前收盘价相对近60日最低价的相对位置：值越大表示价格越贴近阶段低点（潜在低估/超卖），值越小则表明已明显脱离低位（上行动量较强）。
- name: alpha158_qtlu5
  expression: (TS_QUANTILE(CLOSE, 5, 0.8) / CLOSE)
  explanation: 该因子衡量当前收盘价相对过去5日80分位价位的相对位置，数值越大表示当前价低于近期上分位（短期偏弱、具均值回归空间），数值越小表示价位接近或高于上分位（动量较强/偏高）。
- name: alpha158_qtlu10
  expression: (TS_QUANTILE(CLOSE, 10, 0.8) / CLOSE)
  explanation: 衡量当前收盘价相对近10日80%分位的高低位，数值越大说明现价相对偏低（潜在均值回归空间大），越小说明价格偏强接近高位。
- name: alpha158_qtlu20
  expression: (TS_QUANTILE(CLOSE, 20, 0.8) / CLOSE)
  explanation: 该因子衡量当前价格相对过去20日80分位的相对位置，数值越大表示价格低于近期高位区间、可能具备均值回归/反弹潜力，数值越小则表明价格处于高位、动能较强或有过热风险。
- name: alpha158_qtlu30
  expression: (TS_QUANTILE(CLOSE, 30, 0.8) / CLOSE)
  explanation: 该因子衡量当前收盘价相对近30期80%分位价位的相对位置，数值越大表示价格处于近期相对低位（偏价值/均值回归），越小表示处于相对高位（偏动量/过热）。
- name: alpha158_qtlu60
  expression: (TS_QUANTILE(CLOSE, 60, 0.8) / CLOSE)
  explanation: 通过“近60日收盘价80分位数/当前收盘价”衡量价格相对近期高位的偏离，值大代表当前相对低位或有反弹潜力，值小代表强势接近高位或存在超买风险。
- name: alpha158_qtld5
  expression: (TS_QUANTILE(CLOSE, 5, 0.2) / CLOSE)
  explanation: 该因子度量当前收盘价相对近5日20%分位价位的高低，值越大越接近近期低位并提示超跌与均值回归潜力，值越小说明价格相对偏高。
- name: alpha158_qtld10
  expression: (TS_QUANTILE(CLOSE, 10, 0.2) / CLOSE)
  explanation: 衡量当前收盘价相对过去10日20%分位价的相对位置，数值越大表示价格更接近近期低位、短期超跌与均值回归（反弹）潜力更强，数值越小则说明价格离低位更远、趋势动能更强。
- name: alpha158_qtld20
  expression: (TS_QUANTILE(CLOSE, 20, 0.2) / CLOSE)
  explanation: 衡量当前收盘价相对过去20日第20分位数的位置，数值越大表明价格处于近期低位（超卖、相对“便宜”），体现潜在的均值回归动力。
- name: alpha158_qtld30
  expression: (TS_QUANTILE(CLOSE, 30, 0.2) / CLOSE)
  explanation: 该因子衡量当前收盘价相对过去30日价格分布低位（20%分位）的相对位置，数值越大表示价格更接近或低于近期低位、具备均值回归反弹潜力，数值越小则价格远离低位、相对偏贵并可能面临回调风险。
- name: alpha158_qtld60
  expression: (TS_QUANTILE(CLOSE, 60, 0.2) / CLOSE)
  explanation: 该因子衡量当前收盘价相对过去60日20%分位价的相对位置，数值越大表示价格处于历史偏低区间、具有均值回归或反弹潜力，数值越小则说明价格偏高、动量占优。
- name: alpha158_rank5
  expression: (TS_RANK(CLOSE, 5) / 5)
  explanation: 衡量当前收盘价在近5日内的相对排名并归一化，数值越高表示更接近近期高位、体现短期上行动能。
- name: alpha158_rank10
  expression: (TS_RANK(CLOSE, 10) / 10)
  explanation: 该因子衡量当前收盘价在过去10日中的相对位置（归一化），值高表示价格接近阶段高位、短期动量强，值低表示接近低位、可能偏弱或具反转预期。
- name: alpha158_rank20
  expression: (TS_RANK(CLOSE, 20) / 20)
  explanation: 衡量当前收盘价在近20日价格分布中的相对分位，高值表示接近阶段高点，体现短期相对强弱与动量/趋势延续效应。
- name: alpha158_rank30
  expression: (TS_RANK(CLOSE, 30) / 30)
  explanation: 该因子衡量当前收盘价在过去30日内的相对排名（归一化至0-1），数值越高越接近阶段高点，体现短期价格动量与乐观情绪。
- name: alpha158_rank60
  expression: (TS_RANK(CLOSE, 60) / 60)
  explanation: 该因子衡量当前收盘价在过去60日价格序列中的归一化分位，数值越高表示价格越接近近60日高位，从而反映短中期动量强度与市场情绪偏强。
- name: alpha158_rsv5
  expression: CLIP(((CLOSE - TS_MIN(LOW, 5)) / ((TS_MAX(HIGH, 5) - TS_MIN(LOW, 5))
    + 1e-12)), 10)
  explanation: 该因子衡量收盘价在过去5日高低区间内的相对位置，越靠近上沿表示短期买盘占优与上行动能较强，越靠近下沿则卖压更重与下行动能较强。
- name: alpha158_rsv10
  expression: CLIP(((CLOSE - TS_MIN(LOW, 10)) / ((TS_MAX(HIGH, 10) - TS_MIN(LOW, 10))
    + 1e-12)), 10)
  explanation: 衡量收盘价在近10日高低区间中的相对位置以反映短期供需与动量强弱（越高越接近高点、买盘更强，越低越接近低点、偏弱），并通过截尾抑制极端值影响。
- name: alpha158_rsv20
  expression: CLIP(((CLOSE - TS_MIN(LOW, 20)) / ((TS_MAX(HIGH, 20) - TS_MIN(LOW, 20))
    + 1e-12)), 10)
  explanation: 该因子衡量收盘价在过去20日高低区间中的归一化位置，反映短期供需与情绪的强弱/动量特征：值高表示价格靠近阶段高点、买盘占优，值低则靠近阶段低点、卖压较强。
- name: alpha158_rsv30
  expression: CLIP(((CLOSE - TS_MIN(LOW, 30)) / ((TS_MAX(HIGH, 30) - TS_MIN(LOW, 30))
    + 1e-12)), 10)
  explanation: 该因子衡量当前收盘价在近30日高低区间中的相对位置，体现短期动量与市场情绪强弱，值越高表示价格接近阶段高位（预期乐观、买盘占优），越低则接近低位（预期悲观、卖压占优）。
- name: alpha158_rsv60
  expression: CLIP(((CLOSE - TS_MIN(LOW, 60)) / ((TS_MAX(HIGH, 60) - TS_MIN(LOW, 60))
    + 1e-12)), 10)
  explanation: 度量收盘价在过去60日高低区间中的分位位置，数值越高代表价格接近阶段高位、趋势动能与风险偏好更强，越低则接近低位、情绪偏弱。
- name: alpha158_imax5
  expression: (TS_ARGMAX(HIGH, 5) / 5)
  explanation: 该因子刻画过去5个交易日内最高价出现的相对时点（经5日归一化），用于衡量是否近期创出新高及其“新鲜度”，从而反映短期动量与情绪强弱。
- name: alpha158_imax10
  expression: (TS_ARGMAX(HIGH, 10) / 10)
  explanation: 该因子度量过去10日内最高价出现的相对“距今天数”的新旧程度（归一化），数值越小表示刚创10日新高、短期动能更强，数值越大则说明高点已久、动能偏弱。
- name: alpha158_imax20
  expression: (TS_ARGMAX(HIGH, 20) / 20)
  explanation: 该因子衡量过去20日最高价出现的相对时间位置，数值越小表示近期刚创短期新高、动量更强，越大则说明距新高已久、动量走弱。
- name: alpha158_imax30
  expression: (TS_ARGMAX(HIGH, 30) / 30)
  explanation: 该因子表示过去30日最高价出现的相对时间位置（归一化到0-1），值越小代表近期创新高、动量更强，值越大代表高点较早、动能可能走弱。
- name: alpha158_imax60
  expression: (TS_ARGMAX(HIGH, 60) / 60)
  explanation: 该因子衡量过去60日内最高价出现的“新鲜度”（归一化位置），数值越小表示更近期创出60日新高、价格动能与趋势更强，越大则说明距上次高点已久、动能走弱。
- name: alpha158_imin5
  expression: (TS_ARGMIN(LOW, 5) / 5)
  explanation: 衡量过去5日内最低价出现的相对时点并归一化，数值越小表示近期刚创新低、短期卖压或超卖更强，数值越大则说明距低点已久、价格有所修复。
- name: alpha158_imin10
  expression: (TS_ARGMIN(LOW, 10) / 10)
  explanation: 该因子度量过去10日最低价出现的相对时点（归一化），值越小表示近期刚创10日新低、短期抛压与超卖更强且可能反弹，值越大则低点较久远、价格更偏向趋势延续。
- name: alpha158_imin20
  expression: (TS_ARGMIN(LOW, 20) / 20)
  explanation: 衡量过去20日内最低价出现的相对时点并归一化，反映价格是否近期探底及其新鲜度，从而刻画短期趋势与潜在反转信息。
- name: alpha158_imin30
  expression: (TS_ARGMIN(LOW, 30) / 30)
  explanation: 该因子度量过去30日最低价出现的相对时点（越小越近期），用于刻画是否刚创阶段性新低，从而反映短期下行压力与潜在超卖/反弹信号。
- name: alpha158_imin60
  expression: (TS_ARGMIN(LOW, 60) / 60)
  explanation: 度量过去60日内最低价出现的相对时间位置，数值越小表示近期刚创新低（短期更弱/潜在反弹），越大表示距离上次新低已久（动量更强/趋势更稳）。
- name: alpha158_imxd5
  expression: ((TS_ARGMAX(HIGH, 5) - TS_ARGMIN(LOW, 5)) / 5)
  explanation: 衡量近5日内最高价与最低价出现的相对时序（归一化时间差），值越大表示低点更早、高点更晚即短期上行动量更强，值越小说明近期偏下行。
- name: alpha158_imxd10
  expression: ((TS_ARGMAX(HIGH, 10) - TS_ARGMIN(LOW, 10)) / 10)
  explanation: 该因子通过比较过去10日内最高价与最低价出现的相对先后并归一化，刻画价格在局部周期中的位置（正值表示更接近最近低点、负值表示更接近最近高点），以反映趋势阶段与潜在反转压力。
- name: alpha158_imxd20
  expression: ((TS_ARGMAX(HIGH, 20) - TS_ARGMIN(LOW, 20)) / 20)
  explanation: 该因子度量过去20日最高价与最低价出现时间的相对先后与间隔，反映价格路径的趋势性与动能强弱：正值表示先低后高、上行动能较强，负值则相反。
- name: alpha158_imxd30
  expression: ((TS_ARGMAX(HIGH, 30) - TS_ARGMIN(LOW, 30)) / 30)
  explanation: 该因子刻画近30日内最高价与最低价出现的先后顺序及时间差，正值表示先见低后创新高（上行趋势），负值表示先见高后创新低（下行趋势）。
- name: alpha158_imxd60
  expression: ((TS_ARGMAX(HIGH, 60) - TS_ARGMIN(LOW, 60)) / 60)
  explanation: 该因子反映近60日内高低点出现的时间顺序与间隔，数值越大说明低点更早高点更晚、趋势偏上，反之偏下。
- name: alpha158_corr5
  expression: REPLACE_NAN_INF(CORREL(CLOSE, LOG((VOLUME + 1)), 5), 0)
  explanation: 衡量近5日收盘价与成交量对数的相关性，正值代表价量共振（价涨放量/价跌缩量）、负值代表背离（价跌放量/价涨缩量），异常或缺失值置零。
- name: alpha158_corr10
  expression: REPLACE_NAN_INF(CORREL(CLOSE, LOG((VOLUME + 1)), 10), 0)
  explanation: 该因子衡量近10日收盘价与成交量对数的相关性，反映资金交易活跃度与价格趋势的一致性：正值表明价量共振、趋势更具信度，负值表明价量背离、趋势存疑。
- name: alpha158_corr20
  expression: REPLACE_NAN_INF(CORREL(CLOSE, LOG((VOLUME + 1)), 20), 0)
  explanation: 该因子以20日收盘价与对数成交量的相关系数衡量价量共振，正值表示上涨放量、趋势更可靠，负值提示价量背离或抛压，异常值置零以增强稳健性。
- name: alpha158_corr30
  expression: REPLACE_NAN_INF(CORREL(CLOSE, LOG((VOLUME + 1)), 30), 0)
  explanation: 近30日收盘价与对数成交量的相关性，衡量量价是否同向以刻画资金供需与情绪对价格趋势的支撑程度（正值量价齐升、趋势更可信，负值背离、动能偏弱）。
- name: alpha158_corr60
  expression: REPLACE_NAN_INF(CORREL(CLOSE, LOG((VOLUME + 1)), 60), 0)
  explanation: 衡量过去60日收盘价与ln(成交量+1)的相关性，刻画价格与成交活跃度的同向性，从而反映资金关注度与流动性对价格的驱动强弱。
- name: alpha158_cord5
  expression: REPLACE_NAN_INF(CORREL((CLOSE / DELAY(CLOSE, 1)), LOG(((VOLUME / (DELAY(VOLUME,
