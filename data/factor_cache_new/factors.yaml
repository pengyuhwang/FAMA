    (ABS(TS_MEAN(RET, 20)) + 1e-12)
  explanation: 放量但价格窄幅震荡（波幅小于近期平均一半）时的VWAP均值排名，减去近期最大波幅排名，捕捉放量滞涨或抗跌的成本中枢信息。
- name: LLM_Factor5218
  expression: (RANK(TS_STDDEV(IF(LT(RET, 0), AMOUNT / VOLUME, 0), 15)) - RANK(TS_MEAN(IF(GT(RET,
