  explanation: 计算价格低于短期均线但成交均价强势时的累计波幅，并对比价格强势时的成交量波动，捕捉在弱势价格但高质成交下的波动扩张与强势缩量之间的反差。
- name: LLM_Factor5249
  expression: TS_QUANTILE(TS_MAX(VOLUME, 5) / (TS_MEAN(VOLUME, 20) + 1e-12), 15, 0.9)
    - TS_QUANTILE(TS_MIN(AMOUNT, 5) / (TS_MEAN(AMOUNT, 20) + 1e-12), 15, 0.1)
  explanation: 短期成交量峰值相对长期均值的极高分位与短期成交额谷值相对长期均值的极低分位之差，用于捕捉量能脉冲与资金退潮在极端分位上的背离，识别市场热度转换的临界状态。
- name: LLM_Factor5283
  expression: RANK(TS_MEAN(IF(AND(GE(CLOSE, DELAY(TS_MAX(HIGH, 5), 1)), LT(VOLUME,
    TS_QUANTILE(VOLUME, 20, 0.3))), TS_ARGMAX(OPEN, 10), TS_ARGMIN(CLOSE, 10)), 8))
    / (TS_STDDEV(HIGH - LOW, 15) + 1e-12)
  explanation: 该因子衡量价格突破近期高点但成交量低迷时，开盘价高点与收盘价低点的时间错位，反映虚假突破后的反转压力。
- name: LLM_Factor5286
  expression: RANK(TS_MIN(IF(LT(VOLUME, TS_MEAN(VOLUME, 15)), CORREL(TS_RANK(HIGH,
    5), TS_RANK(LOW, 5), 8), 0), 10)) - RANK(TS_MAX(VWAP, 10))
  explanation: 该因子在成交量低迷时计算高低价格秩相关性最小值，并对比VWAP滚动最大，识别低流动性下价格结构的内在不稳定。
- name: LLM_Factor5304
  expression: (RANK(TS_MEAN(IF(LT(VOLUME, DELAY(VOLUME, 2)), ABS(OPEN - VWAP), 0),
    12)) - RANK(DELAY(TS_MAX(AMOUNT / (VOLUME + 1e-12), 10), 3))) / (TS_STDDEV(RET,
