- name: alpha001
  expression: RANK(TS_ARGMAX((IF(LT(((CLOSE / DELAY(CLOSE, 1)) - 1), 0), TS_STDDEV(((CLOSE
    / DELAY(CLOSE, 1)) - 1), 20), CLOSE) * IF(LT(((CLOSE / DELAY(CLOSE, 1)) - 1),
    0), TS_STDDEV(((CLOSE / DELAY(CLOSE, 1)) - 1), 20), CLOSE)), 5))
  explanation: 在近5日内定位“下跌日用20日波动率、非下跌日用价格”的极值出现时点并做横截面排序，从而反映个股近期风险冲击或价格强势的时新性，体现对短期情绪与动量的暴露。
- name: alpha002
  expression: REPLACE_NAN_INF((CORREL(RANK((LOG(VOLUME) - DELAY(LOG(VOLUME), 2))),
    RANK(((CLOSE - OPEN) / OPEN)), 6) * -1), 0)
  explanation: 该因子为近6期“两日对数成交量变化”的秩与“开收盘收益”的秩相关系数取负，反映成交量加速度与日内收益的逆向关系强弱，值越大表明放量更常伴随日内走弱（卖压占优）。
- name: alpha003
  expression: REPLACE_NAN_INF((CORREL(RANK(OPEN), RANK(VOLUME), 10) * -1), 0)
  explanation: 该因子取过去10日开盘价与成交量的秩相关性之相反数（异常置零），反映价量关系：价量同向越强因子越低（需求与流动性共振、趋势更可延续），价量背离越强因子越高（量能不足或情绪分歧、存在反转风险）。
- name: alpha004
  expression: (TS_RANK(RANK(LOW), 9) * -1)
  explanation: 该因子对个股日内最低价在全市场的横截面排名做9日时序排名并取反，刻画近期低点相对越低得分越高，从而押注短期超跌后的均值回归反弹。
- name: alpha005
  expression: (RANK((OPEN - (TS_SUM((AMOUNT / (VOLUME + 1e-07)), 10) / 10))) * (ABS(RANK((CLOSE
    - (AMOUNT / (VOLUME + 1e-07))))) * -1))
  explanation: 以开盘价相对近10日均值成交价的偏离与收盘价相对当日VWAP的强弱相乘并取反，刻画由流动性与过度反应导致的短期价差，偏好开低收弱、反之做空的均值回归信号。
- name: alpha006
  expression: REPLACE_NAN_INF((CORREL(OPEN, VOLUME, 10) * -1), 0)
  explanation: 该因子度量近10日开盘价与成交量的负相关性（异常值记为0），数值越大意味着涨价缩量或跌价放量更明显，反映价格变动与交易参与度的背离程度。
- name: alpha007
  expression: IF(GE(TS_MEAN(VOLUME, 20), VOLUME), -1, ((TS_RANK(ABS((CLOSE - DELAY(CLOSE,
    7))), 60) * SIGN((CLOSE - DELAY(CLOSE, 7)))) * -1))
  explanation: 该因子在成交量高于20日均量时对近7日大幅涨跌进行反向押注（越极端越强），在成交量低于均量时保持做空，从而捕捉高流动性下的短期均值回归。
- name: alpha008
  expression: (RANK(((TS_SUM(OPEN, 5) * TS_SUM(((CLOSE / DELAY(CLOSE, 1)) - 1), 5))
    - DELAY((TS_SUM(OPEN, 5) * TS_SUM(((CLOSE / DELAY(CLOSE, 1)) - 1), 5)), 10)))
    * -1)
  explanation: 该因子取“近5日开盘价总和×近5日累计收益”相对10日前的变化并取反排序，反映短期动能变化的逆向信号。
- name: alpha009
  expression: IF(OR(GT(TS_MIN((CLOSE - DELAY(CLOSE, 1)), 5), 0), LT(TS_MAX((CLOSE
    - DELAY(CLOSE, 1)), 5), 0)), (CLOSE - DELAY(CLOSE, 1)), ((CLOSE - DELAY(CLOSE,
    1)) * -1))
  explanation: 该因子根据近5日是否单边上涨或下跌来决定对当日价差顺势或反向处理，意在趋势期捕捉动量溢价、震荡期博取均值回归收益。
- name: alpha010
  expression: IF(OR(GT(TS_MIN((CLOSE - DELAY(CLOSE, 1)), 4), 0), LT(TS_MAX((CLOSE
    - DELAY(CLOSE, 1)), 4), 0)), (CLOSE - DELAY(CLOSE, 1)), ((CLOSE - DELAY(CLOSE,
    1)) * -1))
  explanation: 该因子根据过去4日收益是否同向（全正或全负）来识别单边或震荡行情：单边时顺势采用当日收益，非单边时反向取值，从而在趋势期捕捉动量、在震荡期博取均值回归。
- name: alpha011
  expression: ((RANK(TS_MAX(((AMOUNT / (VOLUME + 1e-07)) - CLOSE), 3)) + RANK(TS_MIN(((AMOUNT
    / (VOLUME + 1e-07)) - CLOSE), 3))) * RANK((VOLUME - DELAY(VOLUME, 3))))
  explanation: 该因子通过度量近3日成交均价（AMOUNT/VOLUME）相对收盘价的极端偏离并叠加三日成交量变动，刻画资金冲击与短期价格压力的强弱，提示流动性驱动的价格偏离及潜在的短期均值回归或波动加剧。
- name: alpha012
  expression: (SIGN((VOLUME - DELAY(VOLUME, 1))) * ((CLOSE - DELAY(CLOSE, 1)) * -1))
  explanation: 该因子以成交量变动方向乘以价格变动的相反数来衡量量价背离：量增价跌或量减价涨为正、暗示走势缺乏量能确认且可能反转；量价同向为负、趋势更可信。
- name: alpha013
  expression: (RANK(COVAR(RANK(CLOSE), RANK(VOLUME), 5)) * -1)
  explanation: 该因子以近5日收盘价与成交量的秩协方差为基础并取反，数值越大表示价量短期负协动（价涨量缩或价跌量增）越强，反映对价量背离及潜在短期反转/流动性压力的敞口。
- name: alpha014
  expression: ((RANK((((CLOSE / DELAY(CLOSE, 1)) - 1) - DELAY(((CLOSE / DELAY(CLOSE,
    1)) - 1), 3))) * REPLACE_NAN_INF(CORREL(OPEN, VOLUME, 10), 0)) * -1)
  explanation: 该因子以“当日收益减去3日前收益”衡量短期收益加速度，并用近10日开盘价与成交量的相关性刻画开盘资金冲击强度后取负秩，旨在捕捉资金驱动的短期过度反应并博取随后的反转。
- name: alpha015
  expression: (TS_SUM(RANK(REPLACE_NAN_INF(CORREL(RANK(HIGH), RANK(VOLUME), 3), 0)),
    3) * -1)
  explanation: 该因子刻画“价强是否得量能配合”：以近3日最高价与成交量的相关性做横截面排序并在3日内累加后取反，值越低表示价高量增、动能被成交量确认，值越高提示价量背离、上涨缺乏资金支撑。
- name: alpha016
  expression: (RANK(COVAR(RANK(HIGH), RANK(VOLUME), 5)) * -1)
  explanation: 通过近5日最高价与成交量排名的协方差刻画价量共振，取负后偏好价量背离、回避交易热度过高的标的。
- name: alpha017
  expression: (((RANK(TS_RANK(CLOSE, 10)) * RANK(((CLOSE - DELAY(CLOSE, 1)) - DELAY((CLOSE
    - DELAY(CLOSE, 1)), 1)))) * RANK(TS_RANK(REPLACE_NAN_INF((VOLUME / TS_MEAN(VOLUME,
    20)), 0), 5))) * -1)
  explanation: 该因子将近10日价格位序、日度收益加速度与相对20日均量的近5日放量强度相乘后取负，旨在对高位放量加速行情进行逆向押注以捕捉由情绪过度与价格压力引发的短期均值回归。
- name: alpha018
  expression: (RANK(((TS_STDDEV(ABS((CLOSE - OPEN)), 5) + (CLOSE - OPEN)) + REPLACE_NAN_INF(CORREL(CLOSE,
    OPEN, 10), 0))) * -1)
  explanation: 该因子将近5日绝对开收差的波动度、当日开收价差与近10日开收价相关性相加后反向排序，偏好当日盘内走弱且盘内波动更稳定、开收联动性较低的个股，意在捕捉盘内弱势的均值回归。
- name: alpha019
  expression: ((SIGN(((CLOSE - DELAY(CLOSE, 7)) + (CLOSE - DELAY(CLOSE, 7)))) * -1)
    * (RANK((TS_SUM(((CLOSE / DELAY(CLOSE, 1)) - 1), 250) + 1)) + 1))
  explanation: 该因子对近7日价格变化取反，并按过去250日累计收益的截面排名加权，意在在长期强势个股上放大短期均值回归效应（买回调、卖反弹）。
- name: alpha020
  expression: (((RANK((OPEN - DELAY(HIGH, 1))) * RANK((OPEN - DELAY(CLOSE, 1)))) *
    RANK((OPEN - DELAY(LOW, 1)))) * -1)
  explanation: 该因子比较当日开盘价相对昨日高/收/低的相对强弱并取反，刻画隔夜情绪导致的开盘过度定价，旨在捕捉“开盘强则易回落、开盘弱则易反弹”的短期均值回归收益。
- name: alpha021
  expression: IF(AND(NOT(LT((TS_MEAN(CLOSE, 8) + TS_STDDEV(CLOSE, 8)), TS_MEAN(CLOSE,
    2))), OR(LT(TS_MEAN(CLOSE, 2), (TS_MEAN(CLOSE, 8) - TS_STDDEV(CLOSE, 8))), GE((VOLUME
    / TS_MEAN(VOLUME, 20)), 1))), 1, -1)
  explanation: 该因子在短期价格未显著高于8日均线+1倍标准差时，若成交量不低于20日均值或价格显著跌破8日均线−1倍标准差则做多，体现带流动性约束的短期均值回归偏好并规避追涨。
- name: alpha022
  expression: (((REPLACE_NAN_INF(CORREL(HIGH, VOLUME, 5), 0) - DELAY(REPLACE_NAN_INF(CORREL(HIGH,
    VOLUME, 5), 0), 5)) * -1) * RANK(TS_STDDEV(CLOSE, 20)))
  explanation: 该因子以近5日高价与成交量相关性相对5日前的下降幅度（取反）为信号，并用20日收盘波动率的横截面排名放大，旨在捕捉价量配合走弱且高波动个股的动能衰减与回调风险。
- name: alpha023
  expression: IF(LT(TS_MEAN(HIGH, 20), HIGH), (REPLACE_NAN_INF((HIGH - DELAY(HIGH,
    2)), 0) * -1), 0)
  explanation: 当日高点高于20日均高时取近两日高点涨幅的负值（否则为零），体现价格处于相对高位时对短期超涨的逆向押注与回落（均值回归）预期。
- name: alpha024
  expression: IF(LE(((TS_MEAN(CLOSE, 100) - DELAY(TS_MEAN(CLOSE, 100), 100)) / DELAY(CLOSE,
    100)), 0.05), ((CLOSE - TS_MIN(CLOSE, 100)) * -1), ((CLOSE - DELAY(CLOSE, 3))
    * -1))
  explanation: 该因子以100日均线近百日增幅作为趋势阈值，在长期趋势较弱（≤5%）时度量价格距百日低点的贴近度、在趋势较强时采用近3日收益的反向信号，体现弱势偏好低位与强势期短期反转的思想。
- name: alpha025
  expression: RANK(((((((CLOSE / DELAY(CLOSE, 1)) - 1) * -1) * TS_MEAN(VOLUME, 20))
    * (AMOUNT / (VOLUME + 1e-07))) * (HIGH - CLOSE)))
  explanation: 该因子将当日负收益与“收盘低于盘中高点”的幅度相结合，并以20日均量和成交均价加权，用来度量高流动性股票中的短期卖压与情绪走弱强度。
- name: alpha026
  expression: (TS_MAX(REPLACE_NAN_INF(CORREL(TS_RANK(VOLUME, 5), TS_RANK(HIGH, 5),
    5), 0), 3) * -1)
  explanation: 该因子取近3日内“成交量与最高价的5日序列秩相关”的最大值并取负，用以刻画近期量价共振（冲高放量）的强度并对其进行反向暴露，偏好高点未显著放量的标的。
- name: alpha027
  expression: IF(GT(RANK((TS_MEAN(CORREL(RANK(VOLUME), RANK((AMOUNT / (VOLUME + 1e-07))),
    6), 2) / 2)), 0.5), -1, 1)
  explanation: 该因子以近6日内成交量与成交均价（成交额/成交量）在横截面排名的相关性（经短期平滑）衡量价格-流动性共振：相关性高表明高位放量的情绪/拥挤交易因而反向做空，相关性低或为负则做多以博取短期回撤。
- name: alpha028
  expression: SCALE(((REPLACE_NAN_INF(CORREL(TS_MEAN(VOLUME, 20), LOW, 5), 0) + ((HIGH
    + LOW) / 2)) - CLOSE))
  explanation: 该因子通过近5日“20日均量与最低价”的相关性并结合收盘价相对当日高低中点的位置，综合刻画成交活跃与价格位置的联动，从而反映短期供需强弱与价格压力。
- name: alpha029
  expression: (TS_MIN(RANK(RANK(SCALE(LOG(TS_SUM(RANK(RANK((RANK(((CLOSE - 1) - DELAY((CLOSE
    - 1), 5))) * -1))), 2))))), 5) + TS_RANK(DELAY((((CLOSE / DELAY(CLOSE, 1)) - 1)
    * -1), 6), 5))
  explanation: 该因子通过叠加近5日价格下行的极端程度与约一周前单日跌幅的时序相对强弱，刻画短期超卖与情绪过度反应，从而捕捉可能的短期反转收益。
- name: alpha030
  expression: ((RANK(((SIGN((CLOSE - DELAY(CLOSE, 1))) + SIGN(DELAY((CLOSE - DELAY(CLOSE,
    1)), 1))) + SIGN(DELAY((CLOSE - DELAY(CLOSE, 1)), 2)))) - 1) * REPLACE_NAN_INF((TS_SUM(VOLUME,
    5) / TS_SUM(VOLUME, 20)), 1))
  explanation: 衡量近三日价格方向一致性（连涨/连跌）并以5日/20日成交量比强化信号，反映在相对放量背景下的短期趋势与情绪强弱，偏向对下跌放量情形更敏感、具有一定反转指向。
- name: alpha031
  expression: ((RANK(RANK(RANK(DECAY_LINEAR((RANK(RANK((CLOSE - DELAY(CLOSE, 10))))
    * -1), 10)))) + RANK(((CLOSE - DELAY(CLOSE, 3)) * -1))) + SIGN(SCALE(REPLACE_NAN_INF(CORREL(TS_MEAN(VOLUME,
    20), LOW, 12), 0))))
  explanation: 该因子偏好近期（3–10日）收益较差的股票，并结合20日均量与低价的相关性方向作为流动性/情绪过滤，以捕捉短期超跌后的均值回归机会。
- name: alpha032
  expression: (SCALE(((TS_MEAN(CLOSE, 7) / 7) - CLOSE)) + (SCALE(CORREL((AMOUNT /
    (VOLUME + 1e-07)), DELAY(CLOSE, 5), 230)) * 20))
  explanation: 该因子将“收盘价相对7日均值的短期偏离”（均值回归）与“过去230日内成交均价（AMOUNT/VOLUME）与5日前收盘价的相关性”（趋势/交易惯性与流动性结构）结合且加权偏重后者，从而刻画价格的短期背离与中长期持续性。
- name: alpha033
  expression: RANK(((OPEN / CLOSE) - 1))
  explanation: 衡量相对收盘价的开盘溢价并做横截面排序，以反映当日日内走势与资金情绪：排名越高代表开高走低、卖压更强，排名越低代表开低走高、买盘更强。
- name: alpha034
  expression: RANK(((RANK(REPLACE_NAN_INF((TS_STDDEV(((CLOSE / DELAY(CLOSE, 1)) -
    1), 2) / TS_STDDEV(((CLOSE / DELAY(CLOSE, 1)) - 1), 5)), 1)) - 2) - RANK((CLOSE
    - DELAY(CLOSE, 1)))))
  explanation: 衡量短期（2日）相对中期（5日）波动率的上升与当日收益强弱之间的背离，偏好波动突增但价格未同步走强的股票，体现潜在的均值回归信号。
- name: alpha035
  expression: ((TS_RANK(VOLUME, 32) * (TS_RANK(((CLOSE + HIGH) - LOW), 16) - 1)) *
    (TS_RANK(((CLOSE / DELAY(CLOSE, 1)) - 1), 32) - 1))
  explanation: 该因子倾向在成交量相对放大、短期收益与价格/振幅排名偏低时取高值，体现以放量确认的短期超卖—均值回归（反弹）预期。
- name: alpha036
  expression: (((((RANK(CORREL((CLOSE - OPEN), DELAY(VOLUME, 1), 15)) * 2.21) + (RANK((OPEN
    - CLOSE)) * 0.7)) + (RANK(TS_RANK(DELAY((((CLOSE / DELAY(CLOSE, 1)) - 1) * -1),
    6), 5)) * 0.73)) + RANK(ABS(CORREL((AMOUNT / (VOLUME + 1e-07)), TS_MEAN(VOLUME,
    20), 6)))) + (RANK((((TS_MEAN(CLOSE, 200) / 200) - OPEN) * (CLOSE - OPEN))) *
    0.6))
  explanation: 该因子通过综合前一日成交量与当日日内涨跌的相关性、近期（约6–10日）负收益的极端性与反转倾向、价格（均价）与均量状态的联动强度，以及开盘价相对长期均值偏离与当日内动量的交互效应，旨在捕捉由流动性压力与情绪驱动的短期价格反转机会。
- name: alpha037
  expression: (RANK(CORREL(DELAY((OPEN - CLOSE), 1), CLOSE, 200)) + RANK((OPEN - CLOSE)))
  explanation: 该因子以长期窗口中“前一日开收差”与后续收盘价的相关性度量盘中资金压力对价格的传导，并叠加当日开收差，反映由流动性与情绪驱动的短期动能或反转强度。
- name: alpha038
  expression: ((RANK(TS_RANK(OPEN, 10)) * -1) * RANK(REPLACE_NAN_INF((CLOSE / OPEN),
    1)))
  explanation: 该因子将开盘价相对近10日位置的逆排名与当日收/开涨幅的排名相乘，偏好开盘处于近期低位且当日走强的股票，体现“低开转强”的日内动量与均值回归效应。
- name: alpha039
  expression: ((RANK(((CLOSE - DELAY(CLOSE, 7)) * (RANK(DECAY_LINEAR((VOLUME / TS_MEAN(VOLUME,
    20)), 9)) - 1))) * -1) * (RANK(TS_MEAN(((CLOSE / DELAY(CLOSE, 1)) - 1), 250))
    + 1))
  explanation: 该因子在长期动量更强的股票上放大权重，倾向做多近一周在相对低成交量（对近期更敏感）下上涨的个股、做空低量下下跌者，押注低参与度与供给约束驱动的趋势延续。
- name: alpha040
  expression: ((RANK(TS_STDDEV(HIGH, 10)) * -1) * REPLACE_NAN_INF(CORREL(HIGH, VOLUME,
    10), 1))
  explanation: 该因子以10日最高价波动率的截面反向排序体现“低风险”偏好，并以10日最高价与成交量的相关性加权，从而偏好在成交量配合下稳健上行（价量共振）的股票、回避高波动与价量背离的标的。
- name: alpha041
  expression: (((HIGH * LOW) ** 0.5) - (AMOUNT / (VOLUME + 1e-07)))
  explanation: 该因子以高低价的几何均值减去成交均价（成交额/成交量），衡量成交相对价位与买卖压力：值越负表示成交更偏区间高位（买压更强），值越正表示更偏低位（卖压更强）。
- name: alpha042
  expression: (RANK(((AMOUNT / (VOLUME + 1e-07)) - CLOSE)) / RANK(((AMOUNT / (VOLUME
    + 1e-07)) + CLOSE)))
  explanation: 该因子以成交均价（AMOUNT/VOLUME）与收盘价的偏离并经横截面排序归一为核心，度量收盘相对均价的溢折价以反映尾盘资金压力与短期价格动能/反转信号。
- name: alpha043
  expression: (TS_RANK(REPLACE_NAN_INF((VOLUME / TS_MEAN(VOLUME, 20)), 0), 20) * TS_RANK(((CLOSE
    - DELAY(CLOSE, 7)) * -1), 8))
  explanation: 该因子衡量相对近20日均量的放量与近7日价格下跌（取反动量）的共振强度，偏好放量下跌个股以博取抛压与关注度提升后可能出现的短期反弹。
- name: alpha044
  expression: (REPLACE_NAN_INF(CORREL(HIGH, RANK(VOLUME), 5), 0) * -1)
  explanation: 该因子为近5日最高价与成交量排名的相关系数取负，用以刻画量价背离：值越大表示“冲高伴随低量”，上行动能不足；值越小表示量价共振，趋势更易延续。
- name: alpha045
  expression: (((RANK(TS_MEAN(DELAY(CLOSE, 5), 20)) * REPLACE_NAN_INF(CORREL(CLOSE,
    VOLUME, 2), 0)) * RANK(REPLACE_NAN_INF(CORREL(TS_SUM(CLOSE, 5), TS_SUM(CLOSE,
    20), 2), 1))) * -1)
