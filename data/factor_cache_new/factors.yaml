  explanation: 比较短期均价的上分位数与短期收盘价下分位数的截面差异，评估市场成本分布与价格分布的不匹配程度。
- name: LLM_Factor5520
  expression: (RANK(TS_MAX(IF(LT(TS_MEAN(RET, 5), TS_MEAN(RET, 20)), AMOUNT, 0), 15))
    - RANK(TS_MIN(IF(GT(TS_MEAN(RET, 5), TS_MEAN(RET, 20)), VOLUME, 0), 15))) / (ABS(TS_MEAN(RET,
    30)) + 1e-12)
  explanation: 短期弱于长期趋势时的最大成交金额与短期强于长期趋势时的最小成交量排名差异，捕捉趋势强弱切换时的资金与活跃度极端行为。
- name: LLM_Factor5547
  expression: TS_STDDEV(TS_MEAN(IF(EQ(SIGN(OPEN - DELAY(CLOSE, 1)), SIGN(RET)), ABS(CLOSE
    - OPEN), 0), 3), 8)
  explanation: 计算当开盘情绪与日收益率方向一致时，日内实体大小的均值序列波动性，反映方向一致信号推动力的稳定性。
- name: LLM_Factor5548
  expression: (RANK(TS_STDDEV(LOG(VOLUME / (DELAY(VOLUME, 5) + 1e-07) + 1), 15)) -
    RANK(TS_MAX(HIGH - LOW, 10))) / (ABS(TS_MEAN(RET, 10)) + 1e-12)
  explanation: 对比成交量对数增长率波动性与近期最大波幅的排名差异，并用收益均值标准化，衡量交易活跃度变化相对于价格波动的异常性。
- name: LLM_Factor5627
  expression: DECAY_LINEAR(IF(GT((AMOUNT/(VOLUME+1e-12)-OPEN)/(HIGH-LOW+1e-12), TS_MEAN((AMOUNT/(VOLUME+1e-12)-OPEN)/(HIGH-LOW+1e-12),
    10)), RET, -RET), 6)
  explanation: 对日内成交均价相对开盘价的位置高于历史均值的交易日，赋予正向收益的衰减权重；反之赋予负向权重，捕捉资金驱动价格偏离常态时的短期持续性。
- name: LLM_Factor5640
  expression: RANK(CORREL(TS_ARGMAX(CLOSE, 10), TS_ARGMIN(AMOUNT/(VOLUME+1e-12), 10),
    12)) / (TS_MEAN(HIGH-LOW, 20) + 1e-12)
  explanation: 计算价格高点与成交均价低点出现时间相关性的排名，以平均波幅标准化，衡量价格强势与成本洼地的时间耦合度，捕捉市场趋势中成本支撑的同步性质量。
- name: LLM_Factor5653
  expression: IF(GE(TS_MEAN(CORREL(TS_ARGMIN(CLOSE, 10), TS_ARGMIN(VOLUME, 10), 5),
    5), 0.05), RANK(TS_SUM(RET, 5)), RANK(TS_SUM(-RET, 5))) / (TS_STDDEV(CLOSE, 10)
    + 1e-12)
  explanation: 根据价格低点与成交量低点是否同步上涨来决定当前收益累计的方向，捕捉市场底部形成结构对后续短期动量的影响。
- name: LLM_Factor5738
  expression: (RANK(TS_MAX(IF(AND(GE(CLOSE, VWAP), LT(VOLUME, TS_QUANTILE(VOLUME,
    20, 0.4))), HIGH - CLOSE, 0), 10)) - RANK(TS_SUM(IF(AND(LE(CLOSE, VWAP), GT(VOLUME,
    TS_MEAN(VOLUME, 15))), OPEN - LOW, 0), 8))) / (TS_STDDEV(CLOSE, 12) + 1e-12)
  explanation: 对比缩量且收盘在均线上方的上影线强度与放量且收盘在均线下方的下影线突破强度，捕捉不同量价配合下的价格压力测试强度。
- name: LLM_Factor5743
  expression: DECAY_LINEAR(IF(GT(TS_RANK(VOLUME, 20), TS_RANK(AMOUNT, 20)), TS_MEAN(CLOSE,
