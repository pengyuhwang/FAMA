  explanation: 比较短期均价低于成交重心日的成交量波动性与均价高于重心日成交量波动性的差异，经基准成交量调整，反映价格偏离时多空双方交易行为的稳定性分化。
- name: LLM_Factor5127
  expression: (RANK(TS_MAX(IF(AND(LT(VOLUME, TS_QUANTILE(VOLUME, 20, 0.4)), GT(CLOSE,
    TS_MAX(OPEN, 5))), AMOUNT, 0), 10)) - RANK(TS_MEAN(IF(GE(OPEN, CLOSE), VWAP -
    LOW, 0), 8))) / (TS_STDDEV(CLOSE, 15) + 1e-12)
  explanation: 捕捉缩量状态下收盘价强势（高于多日开盘最大值）时的成交金额最大值排名，减去开盘弱势日成交重心距低点距离均值排名，识别无量拉升的潜在虚假强度。
- name: LLM_Factor5129
  expression: (RANK(TS_STDDEV(IF(LE(CLOSE, TS_MIN(LOW, 5)), CORREL(VOLUME, RET, 5),
    0), 10)) - RANK(TS_MEAN(IF(GT(HIGH, TS_MAX(HIGH, 5)), RET, 0), 8))) / (ABS(TS_MEAN(RET,
    20)) + 1e-12)
  explanation: 对比价格创新低时量价相关性波动性与价格创新高时收益均值的排名，捕捉市场在极端点位（新低 vs 新高）时量价关系稳定性与后续收益动能的非对称性。
- name: LLM_Factor5141
  expression: (TS_QUANTILE(AMOUNT, 10, 0.9) - TS_QUANTILE(AMOUNT, 10, 0.1)) / (TS_MEAN(AMOUNT,
    10) + 1e-12) - RANK(TS_STDDEV(VOLUME, 5))
  explanation: 度量成交额在短期内的极差相对强度，减去成交量波动性的排名，以识别金额极端分化但交易量相对稳定的资金集中行为。
- name: LLM_Factor5183
  expression: SIGN(TS_MEAN(RET, 20)) * CORREL(TS_MAX(AMOUNT, 5), TS_MIN(CLOSE, 5),
    10)
  explanation: 结合长期价格趋势符号与最大成交额对最低价的同期相关关系，衡量资金对价格保护的效率与趋势质量。
- name: LLM_Factor5216
  expression: (RANK(TS_MEAN(IF(AND(GT(VOLUME, TS_MEAN(VOLUME, 10)), LT(ABS(CLOSE-OPEN),
