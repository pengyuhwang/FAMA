  explanation: 成交量较两天前萎缩时开盘价对VWAP偏离绝对值的平均排名与滞后的10日最高均价排名的截面差异，揭示缩量开盘冲击与滞后高价位的背离。
- name: LLM_Factor5335
  expression: (RANK(TS_STDDEV(DECAY_LINEAR(IF(GT(CLOSE, TS_MAX(OPEN, 3)), AMOUNT /
    VOLUME, 0), 5), 15)) - RANK(TS_MEAN(IF(LT(CLOSE, TS_MIN(OPEN, 3)), HIGH - LOW,
