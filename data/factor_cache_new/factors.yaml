- name: LLM_Factor5845
  expression: (RANK(TS_STDDEV(IF(GE(VWAP, TS_MEAN(CLOSE,5)), TS_MAX(HIGH,3)-VWAP,
    TS_MIN(LOW,3)-VWAP), 12)) - RANK(TS_MEAN(IF(LT(VOLUME, TS_QUANTILE(VOLUME,20,0.4)),
    AMOUNT/(VOLUME+1e-07)-VWAP, 0), 15))) / (ABS(TS_MEAN(RET, 20)) + 1e-12)
  explanation: 比较VWAP相对强势时价格区间对VWAP偏离的波动率排名与低成交量下成交均价对VWAP偏离的均值排名，用平均收益率绝对值归一化，衡量市场均衡价格在不同流动性条件下的稳定性差异。
- name: LLM_Factor5852
  expression: (RANK(TS_MAX(IF(AND(LT(CLOSE, OPEN), GT(HIGH - LOW, TS_MEAN(HIGH - LOW,
    15))), VWAP - LOW, 0), 12)) - RANK(TS_MIN(IF(AND(GT(CLOSE, OPEN), LT(HIGH - LOW,
    TS_MEAN(HIGH - LOW, 15))), HIGH - VWAP, 0), 12))) / (ABS(TS_MEAN(RET, 20)) + 1e-12)
  explanation: 对比大波动阴线时均价相对低点的最大优势与小波动阳线时高价相对均价的最小优势，以平均收益标准化，捕捉不同市场状态下均价支撑与压力的相对强度。
- name: LLM_Factor5873
  expression: (RANK(TS_STDDEV(TS_ARGMIN(CLOSE,8),12))-RANK(TS_MEAN(IF(GT(RET,0),VOLUME,0),15)))/(TS_MAX(HIGH,20)-TS_MIN(LOW,20)+1e-12)
  explanation: 比较价格低点出现时机稳定性的截面排名与正收益日成交量的相对强度，再除以长时间价格区间，识别市场下跌抵抗与上涨跟随的节奏差异。
- name: LLM_Factor5899
  expression: (TS_MAX(IF(LT(CLOSE, VWAP), AMOUNT, 0), 15) - TS_MIN(IF(GT(CLOSE, VWAP),
    VOLUME, 0), 15)) / (TS_MEAN(VOLUME, 20) + 1e-12)
  explanation: 计算收盘价低于均价时成交金额峰值与收盘价高于均价时成交量谷值的差异，衡量资金在关键价格区间的非对称分布。
- name: LLM_Factor5911
  expression: (RANK(TS_MAX(IF(LT(TS_MEAN(AMOUNT, 5), VOLUME * OPEN), HIGH, LOW), 10))
    - RANK(TS_MIN(IF(GT(TS_MEAN(AMOUNT, 5), VOLUME * CLOSE), VOLUME, 0), 10))) / (TS_STDDEV(OPEN,
    5) + 1e-12)
  explanation: 对比单位成交额与价格关系异常时的价格新高点和对应异常量下的成交量低点，用于捕捉成交效率异常与价格极值的差异性，反映市场非理性定价行为。
- name: LLM_Factor5930
  expression: CORREL(RANK(TS_MEAN(IF(LT(RET, TS_MEAN(RET, 10)), VOLUME, 0), 15)),
    RANK(TS_STDDEV(IF(GT(CLOSE, OPEN), AMOUNT, 0), 12)), 10)
  explanation: 低于平均收益期间的成交量均值排名与阳线成交额波动率排名的截面相关性，揭示弱势中流动性与强势中资金分歧的联动关系，反映市场情绪转换的征兆。
- name: LLM_Factor5940
  expression: RANK(TS_SUM(IF(AND(LT(AMOUNT, TS_MEAN(AMOUNT, 5)), GT(CLOSE, TS_MEAN(CLOSE,
    5))), RET, 0), 10)) / (TS_STDDEV(CLOSE, 10) + 1e-12)
  explanation: 对近期在成交额低于其短期均值但收盘价高于其短期均值的期间内的收益率进行滚动求和并排名，衡量资金收缩但价格坚挺所形成的动量累积强度，并进行波动率调整。
- name: LLM_Factor5963
  expression: (RANK(TS_MEAN(IF(LT(TS_ARGMAX(HIGH,5)-TS_ARGMIN(LOW,5), 3), RET*VOLUME,
    0), 12)) - RANK(TS_STDDEV(IF(GT(CLOSE, VWAP), AMOUNT, 0), 15))) / (TS_MAX(VOLUME,20)-TS_MIN(VOLUME,20)+1e-12)
  explanation: 在价格极差较小的窄幅震荡日计算收益加权的成交量均值排序，减去收盘价高于 VWAP 时成交额的波动率排序，衡量窄幅中量价协同与强势时资金流不稳定性的差异，经成交量极差标准化。
- name: LLM_Factor5978
  expression: (RANK(TS_MEAN(IF(LT(VOLUME, TS_QUANTILE(VOLUME, 30, 0.3)), HIGH - LOW,
    0), 12)) - RANK(TS_STDDEV(AMOUNT / (VOLUME + 1e-12), 15))) / (TS_MEAN(ABS(RET),
    20) + 1e-12)
  explanation: 对比低成交量时期的波幅均值与均价波动性，识别在市场冷清期内的价格结构稳定性。
- name: LLM_Factor5991
  expression: (RANK(TS_STDDEV(LOG(VOLUME / (DELAY(VOLUME, 3) + 1e-12) + 1), 20)) -
    RANK(TS_MEAN(IF(GE(CLOSE, VWAP), HIGH - LOW, LOW - HIGH), 15))) / (TS_STDDEV(CLOSE,
    20) + 1e-12)
  explanation: 衡量成交量变化率的波动性与价格相对均价方向下日内波幅的差异，捕捉量能不稳定与价格非对称波动之间的背离信号。
- name: LLM_Factor6007
  expression: (RANK(TS_MEAN(IF(GT(CLOSE, TS_MAX(OPEN, 5)), (AMOUNT / VOLUME) / CLOSE,
    0), 10)) - RANK(TS_STDDEV(IF(LT(VOLUME, TS_QUANTILE(VOLUME, 30, 0.4)), HIGH -
    LOW, 0), 15))) / (TS_STDDEV(CLOSE, 20) + 1e-12)
  explanation: 衡量价格突破开盘高点时单位成交金额相对价格的均值排名，与低成交量日价格区间波动率排名的差异，捕捉突破时资金强度与低量波动风险的相对表现。
- name: LLM_Factor6015
  expression: (TS_MEAN(IF(LT(TS_RANK(HIGH - LOW, 20), 0.3), (CLOSE - OPEN) / (TS_STDDEV(CLOSE,
    10) + 1e-12), 0), 12) - TS_MEAN(IF(GT(TS_RANK(HIGH - LOW, 20), 0.7), (OPEN - LOW)
    / (TS_STDDEV(CLOSE, 10) + 1e-12), 0), 12)) * RANK(VOLUME)
  explanation: 在历史波幅排名低位时标准化开收差的均值，减去在历史波幅排名高位时标准化开盘距离低点的均值，再乘以成交量排名，捕捉低波动下的方向性突破与高波动下的开盘弱势。
- name: LLM_Factor6047
  expression: IF(LT(CORREL(TS_RANK(CLOSE, 5), TS_RANK(VOLUME, 5), 10), 0), TS_MIN(LOW,
    15) / TS_MAX(HIGH, 15), TS_MAX(HIGH, 15) / TS_MIN(LOW, 15))
  explanation: 基于短期价量排序相关性的符号，在负相关时采用支撑/阻力比（弱势反弹），正相关时采用阻力/支撑比（强势突破），动态适应不同市场状态下的反转与动量机制。
- name: LLM_Factor6065
  expression: (RANK(TS_MAX(VWAP, 10) - TS_MIN(VWAP, 10)) - RANK(TS_MEAN(HIGH - LOW,
    10))) / (ABS(TS_MEAN(RET, 10)) + 1e-12)
  explanation: VWAP近期波动范围与价格日内平均波幅的排名差，标准化后反映市值加权均价稳定性相对于价格活跃度的相对强弱。
- name: LLM_Factor6100
  expression: (TS_MEAN(IF(AND(LE(ABS(RET), TS_QUANTILE(ABS(RET), 20, 0.3)), GT(AMOUNT,
    TS_MEAN(AMOUNT, 10))), (VWAP - CLOSE)/(HIGH - LOW + 1e-12), 0), 12) - TS_MAX(HIGH
    - LOW, 15)/TS_MEAN(CLOSE, 15)) / (ABS(TS_MEAN(RET, 10)) + 1e-12)
  explanation: 在低波动高成交环境下，捕获VWAP相对收盘价的日内位置，并减去价格波动率基准，反映平静期资金驱动下的微观定价效率。
- name: LLM_Factor6127
  expression: RANK(TS_MAX(IF(AND(LT(VWAP, TS_MEAN(CLOSE, 10)), GT(VOLUME, TS_MEAN(VOLUME,
    20))), AMOUNT / (VOLUME + 1e-12), 0), 15)) - RANK(TS_STDDEV(IF(AND(GE(CLOSE, VWAP),
    LT(VOLUME, TS_MEAN(VOLUME, 15))), HIGH - LOW, 0), 10))
  explanation: 衡量在均价低于短期均线且放量时成交强度的相对高低，与在收盘高于均价但交易清淡时价格波幅的异动差异，捕捉非对称量价背离下的市场压力转换信号。
- name: LLM_Factor6130
  expression: SCALE(TS_MEAN(IF(LE(TS_STDDEV(CLOSE, 15), TS_MEAN(TS_STDDEV(CLOSE, 15),
    30)), TS_MAX(HIGH, 8) - TS_MIN(LOW, 8), TS_MEAN(AMOUNT, 5)), 10))
  explanation: 对价格波动持续收敛的股票计算期间价格扩展幅度，否则计算成交金额均值，通过截面标准化突出低波动下的价格突破潜力或高波动下的资金集中度。
- name: LLM_Factor6142
  expression: (RANK(TS_STDDEV(IF(AND(LT(VWAP, CLOSE), GT(AMOUNT, TS_MEAN(AMOUNT, 15))),
    HIGH - VWAP, 0), 12)) - RANK(TS_MEAN(IF(AND(GE(VWAP, CLOSE), LT(VOLUME, TS_QUANTILE(VOLUME,
    20, 0.6))), LOW - VWAP, 0), 10))) / (ABS(TS_MEAN(RET, 15)) + 1e-12)
  explanation: 捕捉强势股突破VWAP后放量冲击高位的波动性，与弱势股缩量背离VWAP下行的预期差异，捕捉资金主动攻击与弱势抵抗中的不对称波动率信息。
- name: LLM_Factor6144
  expression: DECAY_LINEAR(RANK(TS_MEAN(IF(LT(OPEN / DELAY(CLOSE, 1) - 1, -0.01 *
    TS_STDDEV(RET, 20)), ABS(HIGH - LOW), 0), 12)) - RANK(TS_SUM(IF(GT(VOLUME, TS_QUANTILE(VOLUME,
    15, 0.7)), AMOUNT / (VOLUME + 1e-12) - VWAP, 0), 8)), 8)
  explanation: 衡量跳空低开后的日内异常波幅与高成交量下成交溢价VWAP的累计表现之差，当市场遭遇突发利空时，波动加剧但成交溢价可能暗示抄底意愿，捕捉非理性恐慌中的潜在反转机会。
- name: LLM_Factor6152
  expression: (RANK(TS_MEAN(IF(LT(TS_RANK(CLOSE, 10), 0.3), AMOUNT / VOLUME - OPEN,
    0), 12)) - RANK(TS_STDDEV(IF(GT(TS_RANK(VOLUME, 10), 0.7), VWAP - CLOSE, 0), 10)))
    / (TS_STDDEV(CLOSE, 10) + 1e-12)
  explanation: 比较价格排名靠后个股的成交均价相对开盘价溢价的均值，与成交量排名靠前个股的VWAP相对收盘价折价的波动性，捕捉弱势股的成交支撑意愿与强势股的VWAP偏离风险之间的结构性差异。
- name: LLM_Factor6156
  expression: (RANK(CORREL(TS_ARGMIN(VOLUME, 6), TS_ARGMAX(ABS(CLOSE-OPEN), 6), 8))
    - RANK(TS_MEAN(IF(GT(HIGH/OPEN, 1.01 * TS_MEAN(HIGH/OPEN, 15)), AMOUNT, 0), 10)))
    / (TS_STDDEV(CLOSE, 15) + 1e-12)
  explanation: 通过成交量低点与价格绝对变化高点的时机相关性捕捉无量急拉/急跌的日内模式，并与异常高开高走日的大额成交均值对比，识别虚假突破与真实突破在量价时序上的不同特征。
- name: LLM_Factor6225
  expression: (RANK(TS_MEAN(IF(AND(GT(VOLUME, TS_MEAN(VOLUME, 15)), LT(ABS(CLOSE -
    VWAP) / (HIGH - LOW + 1e-12), 0.5)), RET, 0), 12)) - RANK(TS_STDDEV(LOG(VOLUME
    / (DELAY(VOLUME, 3) + 1e-07) + 1), 15))) / (ABS(TS_MEAN(RET, 15)) + 1e-12)
  explanation: 该因子对高成交量且收盘价接近均价时期平均收益的排名，减去成交量对数增长率波动性的排名，识别流动性冲击下的隐蔽阿尔法收益。
- name: LLM_Factor6252
  expression: (RANK(TS_STDDEV(IF(LT(TS_ARGMIN(LOW, 5), TS_ARGMAX(VOLUME, 5)), RET,
    0), 15)) - RANK(TS_MEAN(IF(GT(TS_ARGMAX(HIGH, 5), TS_ARGMIN(VOLUME, 5)), HIGH
    - LOW, 0), 10))) / (ABS(TS_MEAN(RET, 15)) + 1e-12)
  explanation: 比较低点领先于放量时的收益波动性与高点领先于缩量时的价格波幅差异，反映价格极值点与量能时序错位对市场波动结构的预测信息。
- name: LLM_Factor6258
  expression: (RANK(TS_SUM(IF(GT(ABS(AMOUNT/(VOLUME+1e-12) - VWAP), TS_STDDEV(AMOUNT/(VOLUME+1e-12),
    10)), SIGN(CLOSE - VWAP), 0), 8)) - RANK(TS_MEAN(CORREL(RET, VOLUME, 5), 10)))
    / (TS_STDDEV(CLOSE, 15) + 1e-12)
  explanation: 衡量成交价格显著偏离VWAP时的累积方向性信号与同期量价相关性均值的排名差，并进行价格波动标准化，以探测大宗交易或市场微观结构冲击带来的短期定价偏离与市场效率的交互效应。
- name: LLM_Factor6264
  expression: (RANK(TS_QUANTILE(ABS(VWAP - (HIGH + LOW)/2), 20, 0.8)) - RANK(TS_MEAN(IF(GT(VOLUME,
    TS_MEAN(VOLUME, 20)), (HIGH - LOW)/OPEN, 0), 15))) / (TS_STDDEV(RET, 12) + 1e-12)
  explanation: 对比VWAP与日中点绝对偏差的高分位数排名与放量日相对波幅均值的排名，探测成交重心持续偏离日中点的程度与交易活跃时的名义波动背离，可能反映订单流不平衡或市场微观摩擦。
- name: LLM_Factor6270
  expression: (RANK(TS_MEAN(DECAY_LINEAR(IF(GT(CORREL(HIGH - LOW, VOLUME, 5), 0),
    AMOUNT/(VOLUME+1e-12) - OPEN, 0), 4), 12)) - RANK(TS_STDDEV(IF(LT(CORREL(HIGH
    - LOW, VOLUME, 5), 0), CLOSE - OPEN, 0), 15))) / (TS_MEAN(HIGH - LOW, 10) + 1e-12)
  explanation: 对比正量价相关性（波动与成交量正相关）下成交均价偏离开盘价的衰减均值排名，与负量价相关性下开盘收盘价差的波动性排名，探测不同量价关系模式下，价格形成过程的渐进性与突发性差异。
- name: LLM_Factor6274
  expression: (RANK(TS_SUM(IF(LT(TS_RANK(OPEN, 10), 0.3), VOLUME * (CLOSE - VWAP),
    0), 12)) - RANK(TS_STDDEV(IF(GT(TS_MEAN(RET, 5), 0), AMOUNT, VOLUME), 20))) /
    (TS_MEAN(HIGH - LOW, 10) + 1e-12)
  explanation: 差异化对比低开盘排名区域的成交偏离成本动量强度，与价格趋势分化期量价指标波动性，捕捉市场反应延迟与结构脆弱性特征。
- name: LLM_Factor6284
  expression: (RANK(DECAY_LINEAR(TS_MEAN(IF(GT(CLOSE, DELAY(CLOSE, 1)), HIGH - CLOSE,
    CLOSE - LOW), 10), 6)) - RANK(TS_STDDEV(AMOUNT / (CLOSE + 1e-12), 20))) / (ABS(TS_MEAN(RET,
    20)) + 1e-12)
  explanation: 对比上涨日高位折价与下跌日低位折价均值的衰减记忆强度排名，与单位市值成交额波动率排名，揭示价格边际压力与资金效率风险的相对关系。
- name: LLM_Factor6286
  expression: (RANK(TS_MEAN(IF(LE(CLOSE, TS_MIN(VWAP, 10)), VOLUME * (OPEN - CLOSE),
    0), 12)) * RANK(TS_STDDEV(IF(GT(VOLUME, TS_MEAN(VOLUME, 20)), RET, 0), 15))) /
    (TS_MAX(HIGH, 20) - TS_MIN(LOW, 20) + 1e-12)
  explanation: 将跌破短期成本线时的开盘至收盘价量损失均值排名，与放量日正收益波动率排名相乘，用近期波幅归一，衡量破位抛压与放量收益不稳定性耦合的复合风险。
- name: LLM_Factor6291
  expression: (RANK(TS_MEAN(TS_ARGMAX(VOLUME, 10) - TS_ARGMIN(VWAP, 10), 8)) - RANK(TS_SUM(IF(LE(OPEN,
    TS_MIN(CLOSE, 5)), HIGH - OPEN, 0), 12))) / (TS_STDDEV(AMOUNT, 15) + 1e-12)
  explanation: 比较成交量峰值与均价低位时点差值的平均排名与开盘价弱势下日内涨幅累计排名的差异，刻画量价时间错配与价格低开的博弈。
- name: LLM_Factor6294
  expression: (RANK(TS_STDDEV(LOG(AMOUNT + 1) - LOG(VOLUME + 1), 15)) - RANK(TS_MAX(IF(GE(VWAP,
    DELAY(VWAP, 1)), CLOSE - VWAP, 0), 10))) / (TS_MAX(HIGH, 10) - TS_MIN(LOW, 10)
    + 1e-12)
  explanation: 比较基于成交金额与量对数差（近似单价波动）的波动率排名与均价上行下收盘溢价的最大值排名，归一化后突出价格范围内的单位价值波动异常。
- name: LLM_Factor6298
  expression: (RANK(TS_SUM(IF(AND(GE(TS_RANK(VOLUME, 10), 0.7), LE(CLOSE, TS_MIN(OPEN,
    5))), ABS(OPEN - CLOSE), 0), 10)) - RANK(TS_STDDEV(AMOUNT / VOLUME, 15))) / (TS_MEAN(VOLUME,
    20) + 1e-12)
  explanation: 突出高成交量排名下收盘价弱势时的开盘-收盘价差累计，减去成交均价稳定性排名，反映量能异常中价格运动的持续性与均值回复可能。
- name: LLM_Factor6307
  expression: (RANK(TS_STDDEV(TS_LINEAR_REGRESSION_RESI(VOLUME, 10), 15)) - RANK(TS_MEAN(IF(LT(CLOSE,
    TS_MIN(OPEN, 5)), VWAP - LOW, 0), 10))) / (ABS(TS_MEAN(RET, 10)) + 1e-12)
  explanation: 比较成交量短期趋势残差波动率与价格低于近期开盘低点时均价相对低点优势的均值排名差异，反映量能趋势不稳定与价格弱势下支撑强度的权衡。
- name: LLM_Factor6326
  expression: (RANK(TS_STDDEV(IF(GT(ABS(OPEN-CLOSE), TS_MEAN(HIGH-LOW, 10)*0.7), AMOUNT/VOLUME,
    VWAP), 20)) - RANK(TS_MEAN(IF(LT(AMOUNT, TS_MEAN(AMOUNT, 15)), HIGH-LOW, 0), 10)))
    / (ABS(TS_MEAN(RET, 15))+1e-12)
  explanation: 对比大实体K线日成交均价的异常波动性与低成交日价格波动幅度的平均水平，区分基于价格效率的异常交易成本与低流动性下的自然波动。
- name: LLM_Factor6335
  expression: (TS_SUM(IF(AND(LT(CLOSE, OPEN), GT(HIGH - LOW, TS_STDDEV(HIGH - LOW,
    10))), ABS(CLOSE - VWAP), 0), 20) - TS_SUM(IF(AND(GE(CLOSE, OPEN), LE(HIGH - LOW,
    TS_MEAN(HIGH - LOW, 10))), RET, 0), 20)) / (TS_STDDEV(VOLUME, 15) + 1e-12)
  explanation: 高波动下跌日中收盘价偏离均价绝对值的累计，减去低波动上涨日中收益率的累计，并经成交量波动率调整，捕捉下跌偏离与上涨乏力在特定波动条件与价格区间中的差值。
- name: LLM_Factor6369
  expression: (RANK(TS_SUM(IF(AND(LE(ABS(CLOSE-OPEN)/(HIGH-LOW+1e-12), 0.3), GT(VOLUME,
    TS_MEAN(VOLUME, 10))), SIGN(CLOSE-OPEN)*AMOUNT, 0), 12)) - RANK(TS_MEAN(IF(GE(ABS(CLOSE-OPEN)/(HIGH-LOW+1e-12),
    0.7), VWAP-CLOSE, 0), 10))) / (TS_STDDEV(CLOSE, 12) + 1e-12)
  explanation: 窄幅波动但放量日的方向性资金净流入排名减去宽幅波动日均价与收盘价偏差均值排名，捕捉高量窄幅与宽幅低效两种市场状态的资金效率差异。
- name: LLM_Factor6375
  expression: (RANK(TS_STDDEV(IF(AND(GE(RET, 0), LT(VOLUME, TS_MEAN(VOLUME, 10))),
    OPEN / DELAY(CLOSE, 1) - 1, RET), 15)) - RANK(TS_MEAN(IF(GT(HIGH - LOW, TS_STDDEV(HIGH
    - LOW, 10)), CLOSE - VWAP, 0), 10))) / (ABS(TS_MEAN(RET, 20)) + 1e-12)
