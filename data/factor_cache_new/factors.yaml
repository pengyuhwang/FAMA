- name: LLM_Factor1788
  expression: (TS_QUANTILE(HIGH - OPEN, 20, 0.8) - TS_QUANTILE(OPEN - LOW, 20, 0.2))
    / (TS_MEAN(HIGH - LOW, 20) + 1e-12)
  explanation: 通过比较过去20日“开盘后上冲幅度”的80%分位点与“开盘下探幅度”的20%分位点之差，并除以平均振幅，量化多头潜在爆发力相对于空头抵抗力的结构性优势。
- name: LLM_Factor1837
  expression: DECAY_LINEAR(IF(GT((CLOSE - OPEN) / (HIGH - LOW + 1e-12), 0.5), RET,
    -RET), 8)
  explanation: 对日内趋势效率（净变动占区间比例）较高的交易日，赋予正向收益率衰减权重；反之赋予负向衰减权重，累计捕捉高效率交易日带来的持续动量或反转效应。
- name: LLM_Factor1984
  expression: DECAY_LINEAR(IF(LT(CORREL(VOLUME, RET, 5), -0.1), (HIGH+CLOSE)/2 - LOW,
    CLOSE - (LOW+OPEN)/2), 8)
  explanation: 根据量价短期负相关性，选择性加权不同价格基准下的潜在盈利空间，进行线性衰减平滑。
- name: LLM_Factor2006
  expression: TS_QUANTILE(IF(LT(CLOSE, VWAP), HIGH - OPEN, OPEN - LOW), 20, 0.7) /
    (TS_MEAN(HIGH - LOW, 20) + 1e-12)
  explanation: 在收盘低于VWAP时取上影线、高于时取下影线的70分位数，相对平均振幅的比例，衡量关键价格位置附近的受阻/支撑强度。
- name: LLM_Factor2031
  expression: (TS_QUANTILE(VOLUME * SIGN(CLOSE - OPEN), 25, 0.7) - TS_MEAN(VOLUME
    * SIGN(CLOSE - OPEN), 25)) / (TS_STDDEV(VOLUME, 25) + 1e-12)
  explanation: 量化带方向成交量的高位分位数与均值的偏离程度，用成交量波动率标准化，识别极端情绪下单边资金流入的异常强度。
- name: LLM_Factor2105
  expression: (TS_QUANTILE(VWAP * VOLUME, 30, 0.8) - TS_QUANTILE(VWAP, 30, 0.2)) /
    TS_MEAN(AMOUNT, 30)
  explanation: 该因子使用成交额加权VWAP的高分位数与VWAP低分位数的差值，用平均成交额标准化，衡量高成交价格区与平均价格区的溢价水平。
- name: LLM_Factor2145
  expression: (TS_MEAN(CORREL(TS_SUM(ABS(RET), 5), VOLUME, 8), 10) - RANK(VOLUME))
    / TS_STDDEV(CLOSE, 20)
  explanation: 比较近期波动率与成交量的相关性均值与全市场成交量排名的差异，并除以价格波动进行标准化，捕捉交易活跃度与波动关系的异常。
- name: LLM_Factor2175
  expression: (RANK(TS_MEAN(VWAP, 5)) - RANK(TS_MEAN(CLOSE, 5))) / (TS_STDDEV(CLOSE,
    10) + 1e-12)
  explanation: 比较短期均价与收盘价的截面相对位置，并用价格波动标准化，反映市场在均价附近累积的单边驱动强度。
- name: LLM_Factor2200
  expression: (TS_MEAN(CORREL(TS_SUM(IF(GT((CLOSE - VWAP) / VWAP, 0.01), AMOUNT, 0),
    3), TS_SUM(IF(LT((VWAP - CLOSE) / VWAP, -0.01), AMOUNT, 0), 3), 10) * 2, 15) -
    RANK(TS_MEAN(VOLUME, 20))) / (TS_STDDEV(VOLUME, 10) + 0.001)
  explanation: 该因子利用高低价收盘价与VWAP偏离时对应的买卖资金流的短期相关性，探测多空力量同步增强现象的强度，并结合成交量的截面与波动性进行标准化。
- name: LLM_Factor2430
  expression: (TS_QUANTILE(HIGH - OPEN, 30, 0.9) - TS_QUANTILE(OPEN - LOW, 30, 0.1))
    / (TS_MEAN(HIGH - LOW, 30) + 1e-12)
  explanation: 度量开盘后价格向上异动极值强于向下异动极值的非对称性，捕捉早盘突破强度与随后的动量延续。
- name: LLM_Factor2522
  expression: SIGN(TS_MAX(OPEN / DELAY(CLOSE, 1) - 1, 20)) * TS_RANK(ABS(VOLUME -
    TS_QUANTILE(VOLUME, 30, 0.5)), 20)
  explanation: 结合过去20日隔夜收益最大值的符号与成交量偏离中位数的绝对幅度排序，识别隔夜缺口方向与异常成交量配合下的短期动量延续概率。
- name: LLM_Factor2784
  expression: (TS_SUM(IF(AND(LT(CORREL(CLOSE, OPEN, 10), -0.1), GT(ABS(OPEN - CLOSE),
    TS_MEAN(HIGH - LOW, 10))), VOLUME, 0), 20) - TS_SUM(IF(AND(GT(CORREL(CLOSE, OPEN,
    10), 0.1), GT(ABS(OPEN - CLOSE), TS_MEAN(HIGH - LOW, 10))), VOLUME, 0), 20)) /
    (TS_MEAN(VOLUME, 20) + 1e-12)
  explanation: 该因子分别累积在开盘收盘负相关且价差超过区间均值（震荡分歧）时的成交量，以及正相关且价差超过区间均值（趋势确认）时的成交量，求差值后标准化，捕捉不同市场状态（分歧vs趋势）下异常价差伴随的成交量差异，反映资金行为的异质性。
- name: LLM_Factor2872
  expression: REPLACE_NAN_INF(TS_QUANTILE(ABS(TS_SUM(RET, 3)) / (TS_STDDEV(RET, 10)
    + 1e-12), 20, 0.8) - TS_QUANTILE(VOLUME / (TS_MEAN(VOLUME, 20) + 1e-12), 20, 0.2),
    0)
  explanation: 衡量短期累积收益波动率调整后的强势分位数与成交量相对弱势分位数的差值，捕捉高波动收益与低流动性状态的背离。
- name: LLM_Factor2879
  expression: (RANK(DECAY_LINEAR(MAX(VWAP - LOW, 0), 12)) - RANK(DECAY_LINEAR(MAX(HIGH
    - VWAP, 0), 12))) / (TS_STDDEV(CLOSE, 15) + 1e-12)
  explanation: 对比VWAP相对下轨优势与上轨劣势的线性衰减排名差异，并标准化，捕捉以VWAP为轴心的多空支撑阻力非对称结构。
- name: LLM_Factor2886
  expression: (RANK(TS_SUM(IF(LT(CLOSE, TS_MEAN(VWAP, 10)), VOLUME, 0), 15)) - RANK(TS_SUM(IF(GT(CLOSE,
    TS_MEAN(VWAP, 10)), VOLUME, 0), 15))) / (TS_STDDEV(VOLUME, 20) + 1e-12)
  explanation: 比较股价低于与高于VWAP期间的累计成交量排名差异，并通过成交量波动标准化，捕捉资金在均价下方的积累相对于上方积累的相对强度。
- name: LLM_Factor2893
  expression: CORREL(RANK(TS_STDDEV(OPEN, 10)), RANK(TS_MEAN(ABS(CLOSE - OPEN) / (HIGH
    - LOW + 1e-12), 10)), 20)
  explanation: 衡量开盘价波动率的排名与日内价格效率（收盘开盘差占区间比例）均值的排名之间的相关性，反映开盘不确定性对后续交易日价格发现效率的预测关系。
- name: LLM_Factor2895
  expression: (RANK(TS_MAX(HIGH - LOW, 5)) * RANK(TS_MEAN(VOLUME, 10))) / (TS_STDDEV(CLOSE,
    20) + 1e-12) - RANK(DELAY(AMOUNT / (VOLUME + 1e-07) - CLOSE, 3))
  explanation: 将价格区间极值与成交量均值的排名乘积用价格波动标准化，再减去VWAP与收盘价价差的滞后排名，衡量波动与成交量的联合强度相对于历史均价偏离的调整。
- name: LLM_Factor2913
  expression: DECAY_LINEAR(IF(LT(CORREL(DELAY(CLOSE, 1), VOLUME, 10), 0), ABS(RET),
    -ABS(RET)), 6)
  explanation: 对价量负相关的时期赋予正衰减的绝对收益动量，反之则赋予负衰减动量，旨在捕捉流动性错配驱动的价格惯性。
- name: LLM_Factor2964
  expression: (RANK(TS_SUM(IF(GT(CLOSE, OPEN), VOLUME * (CLOSE - OPEN), 0), 20)) -
    RANK(TS_SUM(IF(LT(CLOSE, OPEN), VOLUME * (OPEN - CLOSE), 0), 20)))
  explanation: 对比上涨日和下跌日经成交量加成的价格变动总量排名，衡量多空力量在时间上的净效应。
- name: LLM_Factor3081
  expression: (RANK(TS_STDDEV(VWAP, 10)) - RANK(TS_MEAN(HIGH - LOW, 10))) / (TS_STDDEV(CLOSE,
    5) + 1e-12)
  explanation: 对比日内均价波动率与价格波幅的相对排名，识别波动结构错配下的潜在趋势转换点。
- name: LLM_Factor3091
  expression: (RANK(TS_MEAN(OPEN / DELAY(CLOSE, 1) - 1, 10)) * RANK(TS_STDDEV(AMOUNT,
    10))) / (ABS(TS_MEAN(RET, 10)) + 1e-12)
  explanation: 结合开盘跳空幅度排名与成交金额波动排名，除以收益均值绝对值，衡量跳空强度与资金波动在收益背景下的复合效应。
- name: LLM_Factor3100
  expression: RANK(TS_MEAN(ABS(TS_ARGMIN(LOW, 5) - TS_ARGMAX(VOLUME, 5)), 10)) / (TS_STDDEV(CLOSE,
    10) + 1e-12)
  explanation: 排名近期低价出现时点与成交量峰值时点绝对差值的滚动均值，并用价格波动率归一化，衡量价格底部与流动性峰值的时序错位程度
- name: LLM_Factor3104
  expression: TS_RANK(TS_SUM(IF(GT(AMOUNT, TS_QUANTILE(AMOUNT, 30, 0.75)), CLOSE -
    LOW, HIGH - CLOSE), 10), 20)
  explanation: 在成交金额处于高位区间时计算收盘相对低点的涨幅，否则计算高点相对收盘的跌幅，对其10日求和进行时间序列排名，捕捉大额成交对价格区间利用效率的影响
- name: LLM_Factor3107
  expression: (RANK(TS_MEAN(IF(AND(LT(CLOSE, TS_MIN(LOW, 10)), GT(VOLUME, TS_MEAN(VOLUME,
    20))), 1, 0), 15)) - RANK(TS_STDDEV(AMOUNT, 15))) / (ABS(TS_MEAN(RET, 20)) + 1e-12)
  explanation: 比较价格触及近期低位且成交量高于长期均量发生频率的排名与成交金额波动率排名，用平均收益率绝对值归一化，捕捉放量破位事件相对于资金波动幅度的相对强度
- name: LLM_Factor3165
  expression: DECAY_LINEAR(RANK(TS_MAX(IF(LE(CLOSE, TS_QUANTILE(CLOSE, 15, 0.25)),
    (OPEN - LOW) / (HIGH - LOW + 1e-12), 0), 10)) - RANK(TS_MIN(IF(GE(CLOSE, TS_QUANTILE(CLOSE,
    15, 0.75)), (HIGH - OPEN) / (HIGH - LOW + 1e-12), 0), 10)), 7)
  explanation: 对低价区下影线强度最大值与高价区上影线强度最小值的排名差进行线性衰减，捕捉极端价位下影线支撑与上影线压力在截面上的相对动态变化动量。
- name: LLM_Factor3166
  expression: RANK(TS_MEAN(IF(GT(ABS(CLOSE - VWAP) / (HIGH - LOW + 1e-12), TS_QUANTILE(ABS(CLOSE
    - VWAP) / (HIGH - LOW + 1e-12), 20, 0.75)), RET, 0), 15))
  explanation: 该因子捕捉当价格偏离日内均价幅度异常大时收益的长期排序，反映价格在极端偏离均值时潜在的反转驱动力。
- name: LLM_Factor3224
  expression: (RANK(TS_SUM(IF(LT((HIGH+LOW)/2, VWAP), VOLUME, 0), 20)) - RANK(TS_SUM(IF(GT((HIGH+LOW)/2,
    VWAP), VOLUME, 0), 20))) / (TS_STDDEV((HIGH+LOW)/2, 15) + 1e-12)
  explanation: 日内均价低于VWAP的成交量累计与高于VWAP的成交量累计的秩差，并由日内价格波动标准化，捕捉围绕VWAP成交结构失衡与价格波动的交互。
- name: LLM_Factor3245
  expression: (RANK(TS_MEAN(ABS(AMOUNT / (VOLUME + 1e-07) - DELAY(AMOUNT / (VOLUME
    + 1e-07), 1)), 20)) - RANK(TS_MIN(HIGH - LOW, 5))) / (TS_STDDEV(CLOSE, 10) + 1e-12)
  explanation: 比较平均VWAP日间波动的排名与最小日内波幅的排名之差并进行波动性标准化，寻找价格波动微弱但交易中枢却变化频繁的异常股。
- name: LLM_Factor3297
  expression: (RANK(TS_SUM(MAX(VWAP - CLOSE, 0), 10)) - RANK(TS_SUM(MAX(CLOSE - VWAP,
    0), 10))) / (TS_MEAN(HIGH - LOW, 10) + 1e-12)
  explanation: 比较收盘价低于VWAP的累计幅度与高于VWAP的累计幅度之差，用平均日内波幅调整，捕捉价格相对于市场平均成本的偏离累积效应。
- name: LLM_Factor3312
  expression: TS_MEAN(IF(LE(ABS(RET), TS_QUANTILE(ABS(RET), 20, 0.25)), VWAP - CLOSE,
    0), 15) / (TS_MAX(HIGH, 10) - TS_MIN(LOW, 10) + 1e-12)
  explanation: 在收益绝对值较小的平静期内，衡量VWAP与收盘价之差的均值，并除以价格区间进行归一化，捕捉微观定价偏差。
- name: LLM_Factor3364
  expression: DECAY_LINEAR(IF(LT(VOLUME, TS_MEAN(VOLUME, 30)), (OPEN + CLOSE) / 2
    - VWAP, 0), 8) / (TS_MAX(AMOUNT, 20) - TS_MIN(AMOUNT, 20) + 1e-07)
  explanation: 在成交量低于平均水平时，捕捉盘中均价与加权均价价差的趋势性成分，并标准化于金额极差，衡量缩量状态下市场效率与价格分歧度。
- name: LLM_Factor3498
  expression: DECAY_LINEAR(RANK(TS_MEAN(IF(AND(GE(OPEN, DELAY(CLOSE, 1)), GT(VOLUME,
    TS_MEAN(VOLUME, 20))), HIGH - LOW, 0), 15)) - RANK(TS_MEAN(IF(AND(LE(OPEN, DELAY(CLOSE,
    1)), LT(VOLUME, TS_QUANTILE(VOLUME, 20, 0.3))), HIGH - LOW, 0), 15)), 10)
  explanation: 以线性衰减加权高开高量与低开低量的波动性差异，并做横截面排名差，筛选市场预期变化与流动性格局变化的股票。
- name: LLM_Factor3593
  expression: (RANK(TS_MEAN(IF(LE(HIGH - LOW, TS_QUANTILE(HIGH - LOW, 20, 0.3)), VWAP
    - CLOSE, 0), 12)) - RANK(TS_MAX(VOLUME, 30))) / (TS_STDDEV(RET, 20) + 1e-12)
  explanation: 在低波动日捕捉VWAP与收盘价偏差的均值排名，减去成交量峰值的排名，并经收益波动率调整，识别在平静期存在定价偏差且未伴随异常放量的股票。
- name: LLM_Factor3641
  expression: RANK(CORREL(TS_ARGMAX(HIGH, 5), TS_ARGMIN(AMOUNT / (VOLUME + 1e-07),
    5), 10)) / (ABS(TS_MEAN(RET, 10)) + 1e-12)
  explanation: 排名高点与均价低点出现时点的相关性，并除以收益率均值以抑制市场整体方向影响，捕捉价格高点与低估均价同时出现的稀缺性。
- name: LLM_Factor3678
  expression: (RANK(TS_MEAN(IF(LT(ABS(OPEN - DELAY(CLOSE, 1)), TS_QUANTILE(ABS(OPEN
    - DELAY(CLOSE, 1)), 20, 0.5)), HIGH - LOW, 0), 15)) - RANK(TS_STDDEV(AMOUNT, 15)))
    / (TS_MAX(HIGH, 10) - TS_MIN(LOW, 10) + 1e-12)
  explanation: 在开盘缺口较平的平静日内，衡量价格区间的相对宽度并与成交额的波动性对比，偏好区间稳定但非流动性驱动的股票。
- name: LLM_Factor3701
  expression: TS_MEAN(CORREL(TS_ARGMAX(AMOUNT, 10), TS_ARGMIN(HIGH - LOW, 10), 5),
    15)
  explanation: 成交金额峰值出现的位置与日内波动率极小值出现的位置之间的相关性滚动均值，捕捉资金流入与市场平静期的时间联动。
- name: LLM_Factor3733
  expression: (RANK(TS_MEAN(ABS((CLOSE - TS_MEAN(CLOSE, 10)) / (TS_STDDEV(CLOSE, 10)
    + 1e-12)), 10)) - RANK(TS_QUANTILE(AMOUNT, 30, 0.8))) / (TS_STDDEV(AMOUNT, 20)
    + 1e-12)
  explanation: 该因子结合股价偏离均值的标准化程度与成交额高分位数进行截面排序，识别价格中枢性与流动性分布的综合背离，负向值可能预示中短期风险或趋势反转潜力。
- name: LLM_Factor3759
  expression: RANK(TS_STDDEV(TS_MEAN(AMOUNT, 5), 20)) / (ABS(TS_MEAN(RET, 20)) + 1e-12)
  explanation: 以近期收益均值的绝对值为分母，标准化成交金额短期均值的长期波动性，筛选出资金流波动大而价格趋势弱的股票。
- name: LLM_Factor3764
  expression: (TS_MAX(CORREL(OPEN, LOW, 8), 10) - TS_MIN(CORREL(CLOSE, HIGH, 8), 10))
    / (TS_STDDEV(RET, 15) + 1e-12)
  explanation: 衡量开盘价与最低价、收盘价与最高价相关性的极差，并用收益率波动率标准化，反映日内价格与边界联动模式的稳定性差异。
- name: LLM_Factor3784
  expression: (RANK(TS_QUANTILE(AMOUNT / VOLUME, 30, 0.75) - TS_QUANTILE(AMOUNT /
    VOLUME, 30, 0.25)) - RANK(TS_QUANTILE(VOLUME, 30, 0.75) - TS_QUANTILE(VOLUME,
    30, 0.25))) / (RANK(TS_STDDEV(CLOSE, 30)) + 1e-12)
  explanation: 对成交均价（成交额/成交量）分布的宽度（高阶分位差）与成交量分布的宽度之差进行差秩比较，并除以价格波动率，衡量市场交易质量的离散度是否主要由高价订单还是普适性交易量贡献。
- name: LLM_Factor3795
  expression: DECAY_LINEAR(IF(GT(ABS(VWAP - CLOSE), TS_STDDEV(ABS(VWAP - CLOSE), 10)),
    SIGN(OPEN - DELAY(CLOSE, 1)) * RET, 0), 12)
  explanation: 对VWAP与收盘价偏离超出历史波动时，赋予开盘相对于前收盘方向符号加权的收益率进行线性衰减，捕捉定价大幅偏离后的方向性修正动量。
- name: LLM_Factor3833
  expression: (RANK(TS_MIN(IF(GT(AMOUNT, VOLUME * TS_MEAN(CLOSE, 5)), CLOSE, OPEN),
    10)) - RANK(TS_MAX(VOLUME, 10))) / (ABS(TS_MEAN(RET, 10)) + 1e-12)
  explanation: 比较在高额成交日选取收盘价（否则用开盘价）的近期低点排序与成交量高点排序，用收益均值绝对值归一化。
- name: LLM_Factor3860
  expression: (RANK(TS_MEAN(VWAP - TS_MIN(VWAP, 5), 10)) - RANK(TS_MEAN(TS_MAX(HIGH,
    5) - CLOSE, 10))) / (TS_STDDEV(AMOUNT, 20) + 1e-12)
  explanation: 对比均价相对于近期低点的恢复强度排名与价格上行阻力排名，并经成交额波动调整，评估买方在均价支撑位的相对效力。
- name: LLM_Factor3890
  expression: (RANK(TS_QUANTILE(AMOUNT / (VOLUME + 1e-07) - CLOSE, 20, 0.9)) - RANK(TS_QUANTILE(CLOSE
    - AMOUNT / (VOLUME + 1e-07), 20, 0.1))) / (TS_STDDEV(RET, 15) + 1e-12)
  explanation: 对比成交均价高于收盘价的极端分位数排名与低于收盘价的极端分位数排名，用收益波动标准化，衡量买卖均价相对收盘价的极端非对称性。
- name: LLM_Factor3925
  expression: (RANK(TS_MEAN(CORREL(TS_RANK(OPEN, 6), TS_RANK(HIGH - LOW, 6), 5), 10))
    * RANK(TS_STDDEV(AMOUNT, 15))) / (ABS(TS_MEAN(RET, 10)) + 1e-12)
  explanation: 开盘价与日内波动的短期排名相关性均值排名，乘以成交金额波动率排名，捕捉开盘驱动波动的特质性与资金面不稳定的复合效应。
- name: LLM_Factor3957
  expression: RANK(CORREL(ABS(CLOSE - TS_MEAN(CLOSE, 5)), TS_STDDEV(VOLUME, 10), 20))
    / (ABS(TS_MEAN(RET, 10)) + 1e-12)
  explanation: 度量收盘价偏离均值的稳定性与短期成交量波动的协同性，低值为同步无序，高值预示价格偏离相对放量但波动不匹配，潜在拐点。
- name: LLM_Factor3999
  expression: (RANK(TS_MEAN(ABS(CLOSE - OPEN), 10)) - RANK(TS_SUM(VOLUME, 5))) / (TS_STDDEV(CLOSE,
    10) + 1e-12)
  explanation: 比较日内绝对价格变动均值与短期成交总量的秩差，再除以价格波动，衡量价格变化幅度与成交活跃度的不匹配程度。
- name: LLM_Factor4022
  expression: (RANK(TS_MAX(VWAP, 10) - TS_MIN(VWAP, 10)) - RANK(TS_MEAN(HIGH - LOW,
    10))) / (TS_STDDEV(AMOUNT, 10) + 1e-12)
  explanation: 比较均价在十日窗口内的波动幅度与平均日内波幅的截面排名，并用成交额波动调整，度量中期均价分布宽度相对于日内价格区间的超额变化带来的不确定性溢价。
- name: LLM_Factor4034
  expression: (RANK(TS_STDDEV(IF(AND(LE(CLOSE, VWAP), GT(VOLUME, TS_MEAN(VOLUME, 20))),
    OPEN, CLOSE), 15)) - RANK(TS_MEAN(VWAP - OPEN, 10))) / (ABS(TS_MEAN(RET, 20))
    + 1e-12)
  explanation: 比较放量收于均价之下时开盘价波动幅度与均价开盘价差均值的截面排名，用收益绝对值归一化，捕捉弱势放量下开盘行为异动与成本偏离的相对强度。
- name: LLM_Factor4108
  expression: (RANK(TS_MEAN(IF(LT(ABS(CLOSE - OPEN), TS_MEAN(HIGH - LOW, 5)), AMOUNT,
    0), 12)) - RANK(TS_MAX(HIGH - LOW, 10))) / (ABS(TS_MEAN(RET, 20)) + 1e-12)
  explanation: 比较窄幅波动日（开盘收盘接近）的成交金额与近期最大日内波幅的截面相对排名，用长期收益绝对值调整，捕捉低波动下的隐蔽资金流入强度。
- name: LLM_Factor4115
  expression: (RANK(TS_MAX(IF(GT(AMOUNT, VOLUME * TS_MEAN(CLOSE, 10)), CLOSE - OPEN,
    0), 8)) - RANK(TS_MIN(VOLUME, 10))) / (TS_STDDEV(RET, 15) + 1e-12)
  explanation: 比较高单位成交金额日的最大收益与近期最低成交量的相对排名，并用收益波动调整，识别资金效率极高但交易冷清时的价格推动潜力。
- name: LLM_Factor4203
  expression: (RANK(TS_STDDEV(IF(LT(VOLUME, TS_QUANTILE(VOLUME, 30, 0.3)), HIGH -
    LOW, 0), 20)) - RANK(TS_MEAN(CLOSE / DELAY(CLOSE, 1) - 1, 20))) / (ABS(TS_MEAN(RET,
    20)) + 1e-12)
  explanation: 衡量在成交量极低时段内股价波动性的异常变化与整体收益趋势的偏离，捕捉流动性枯竭时波动率结构突变对后续收益的预测信号。
- name: LLM_Factor4211
  expression: (RANK(TS_MEAN(IF(LT(TS_MAX(HIGH, 5) - TS_MIN(LOW, 5), TS_QUANTILE(HIGH
    - LOW, 20, 0.25)), RET, 0), 10)) - RANK(TS_STDDEV(VWAP, 15))) / (ABS(TS_MEAN(RET,
    10)) + 1e-12)
  explanation: 衡量价格在极窄波动区间内的收益均值与VWAP波动率的差异，识别波动收敛后资金成本稳定下的收益持续性。
- name: LLM_Factor4240
  expression: (RANK(TS_STDDEV(TS_MEAN(AMOUNT / (VOLUME + 1e-07), 10), 20)) - RANK(TS_MEAN(HIGH
    - LOW, 15))) / (ABS(TS_MEAN(RET, 20)) + 1e-12)
  explanation: 比较平均成交价（成交额/成交量）的长期波动性与近期平均价格波幅的截面相对排名，并用长期收益绝对值调整，识别流动性成本稳定性与价格波动之间的结构性差异。
- name: LLM_Factor4252
  expression: (RANK(TS_MAX(CLOSE, 8)) - RANK(TS_SUM(IF(LT(VWAP, CLOSE), VOLUME, 0),
    8))) / (ABS(TS_MEAN(RET, 20)) + 1e-12)
  explanation: 比较近期最高价与低于VWAP的成交量累计的截面相对排名，捕捉在价格高位下隐秘的卖方压力。
- name: LLM_Factor4287
  expression: (RANK(TS_STDDEV(IF(LT(ABS(RET), TS_STDDEV(RET, 30)), AMOUNT, 0), 15))
    - RANK(TS_MEAN(HIGH - LOW, 15))) / (ABS(TS_MEAN(RET, 20)) + 1e-12)
  explanation: 对比低波动日成交金额的稳定性与近期平均波幅的相对排名，揭示在平静市场中资金流动的隐蔽性强度。
- name: LLM_Factor4295
  expression: (RANK(TS_MEAN((HIGH - TS_MAX(HIGH, 5)) / (TS_MAX(HIGH, 5) - TS_MIN(LOW,
    5) + 0.0001), 15)) - RANK(TS_STDDEV(ABS(OPEN - DELAY(VWAP, 1)), 10))) / (ABS(TS_MEAN(RET,
    20)) + 1e-12)
  explanation: 该因子比较近期价格从阶段高点回撤幅度的平均截面排名与开盘价相对于前一日VWAP的偏离波动率排名，捕捉股价回撤乏力与开盘异常变动的背离信号。
- name: LLM_Factor4378
  expression: (RANK(TS_SUM(IF(AND(GT(AMOUNT / (VOLUME + 1e-07), TS_MEAN(AMOUNT / (VOLUME
    + 1e-07), 10)), LT(CLOSE, VWAP)), VOLUME, 0), 12)) - RANK(TS_MEAN(HIGH - LOW,
    12))) / (TS_STDDEV(CLOSE, 15) + 1e-12)
  explanation: 成交均价高于其均值但收盘价低于VWAP时的成交量累积排名减去近期价格平均波幅排名，反映高价低收（可能资金出逃或套牢盘）且交易活跃的程度，捕捉可能的假突破资金流出信号。
- name: LLM_Factor4392
  expression: (RANK(TS_MEAN(IF(LE(TS_STDDEV(AMOUNT, 10), TS_MEAN(AMOUNT, 10) * 0.1),
    VWAP - CLOSE, 0), 15)) - RANK(TS_MAX(CLOSE - OPEN, 10))) / (TS_MEAN(HIGH - LOW,
    10) + 1e-12)
  explanation: 计算在成交额波动较为稳定时期，VWAP相对于收盘价长期偏离的排名，并减去较强的日间绝对收益（跳空）排名，用以识别市场微观结构定价效率与价格行为的差异。
- name: LLM_Factor4394
  expression: (RANK(TS_MAX(IF(LT(CLOSE, VWAP), AMOUNT, 0), 10)) - RANK(TS_MEAN(IF(GT(HIGH
    - LOW, TS_MEAN(HIGH - LOW, 20)), OPEN, 0), 15))) / (ABS(TS_MEAN(RET, 25)) + 1e-12)
  explanation: 对比价格低于均价时的大额成交强度与价格波动放大时的开盘价表现，衡量卖压与异常波动之间的差异。
- name: LLM_Factor4422
  expression: (RANK(TS_SUM(IF(AND(LT(VWAP, TS_MEAN(VWAP, 20)), GT(CLOSE, OPEN)), VOLUME,
    0), 15)) * RANK(TS_MEAN(HIGH / LOW, 10))) / (ABS(TS_MEAN(RET, 15)) + 1e-12)
  explanation: 结合在加权均价低于长期均值且收盘上涨时的累积成交量排名，以及平均日内价格波动幅度排名，用收益均值标准化，捕捉价值洼地（低VWAP）中上涨放量信号与价格扩散幅度的双向增强效应。
- name: LLM_Factor4433
  expression: (RANK(TS_MAX(IF(GT(VOLUME, TS_MEAN(VOLUME, 30)), HIGH - LOW, 0), 10))
    - RANK(TS_MIN(IF(LT(VOLUME, TS_MEAN(VOLUME, 30)), HIGH - LOW, 0), 10))) / (ABS(TS_MEAN(RET,
    20)) + 1e-12)
  explanation: 对比高成交量下最大真实波幅与低成交量下最小真实波幅的相对强弱，标准化后反映放量对股价有效波动范围的扩张效应。
- name: LLM_Factor4446
  expression: (RANK(DELAY(CORREL(TS_ARGMAX(OPEN, 10), TS_ARGMIN(VWAP, 10), 5), 3))
    * RANK(TS_SUM(IF(GT(HIGH - LOW, TS_MEAN(HIGH - LOW, 15)), RET, 0), 10))) / (ABS(TS_MEAN(RET,
    20)) + 1e-12)
  explanation: 基于开盘高点与VWAP低点时序相关性的历史滞后效应与宽幅波动正收益的横截面强度进行合成，捕捉因市场微观结构间歇性扭曲所产生的多重动量共振效应。
- name: LLM_Factor4447
  expression: TS_MEAN(IF(GT(TS_RANK(AMOUNT, 5), TS_RANK(CLOSE, 5)), TS_STDDEV(VWAP,
    10), 0), 10) / (TS_STDDEV(CLOSE, 10) + 1e-12)
  explanation: 计算成交额序列排序相对于价格排序更突出时的VWAP波动浓度均值，反映资金流入活跃度领先于价格表现期间的定价不稳定性，用以识别潜在的价值重估启动点。
- name: LLM_Factor4451
  expression: TS_SUM(IF(EQ(SIGN(CLOSE - DELAY(VWAP, 1)), SIGN(OPEN - DELAY(CLOSE,
    1))), AMOUNT, -AMOUNT), 20) / (TS_SUM(AMOUNT, 20) + 1e-12)
  explanation: 累加VWAP动量方向与开盘情绪方向一致时的成交额贡献，对不一致时进行惩罚，反映方向性资金流在多周期信号协同上的持续强度与市场意见统一度。
- name: LLM_Factor4456
  expression: (RANK(TS_MAX(TS_STDDEV(OPEN, 8), 10)) * RANK(TS_MEAN(IF(AND(LT(AMOUNT,
    TS_MEAN(AMOUNT, 10)), GT(CLOSE, OPEN)), HIGH - LOW, 0), 10))) / (ABS(TS_MEAN(RET,
    12)) + 1e-12)
  explanation: 度量开盘价波动峰值与低成交上涨日波幅的交互效应，捕捉市场在缩量上涨期面临的结构性分歧与突破倾向。
- name: LLM_Factor4505
  expression: (RANK(TS_STDDEV(IF(OR(LT(CLOSE, TS_MIN(OPEN, 5)), GT(CLOSE, TS_MAX(OPEN,
    5))), HIGH - LOW, 0), 15)) - RANK(TS_MEAN(ABS(VWAP - CLOSE) / (HIGH - LOW + 1e-12),
    10))) / (TS_STDDEV(CLOSE, 12) + 1e-12)
  explanation: 开盘价突破区间后的波幅波动率排名与价格在当日区间内相对位置效率的差异，衡量突破的真实动量强度。
- name: LLM_Factor4541
  expression: (RANK(TS_SUM(IF(AND(EQ(SIGN(OPEN - DELAY(CLOSE, 1)), SIGN(CLOSE - OPEN)),
    GT(AMOUNT, TS_QUANTILE(AMOUNT, 20, 0.6))), 1, 0), 10)) - RANK(TS_MEAN(ABS(VWAP
    - CLOSE), 15))) / (TS_STDDEV(CLOSE, 10) + 1e-12)
  explanation: 比较日内情绪一致（开盘方向与日内方向同向）且大额的天数累积排名与均价偏离度平均值的排名，以价格波动标准化，捕捉一致性强且价格偏离度低的资金行为持续效应。
- name: LLM_Factor4544
  expression: (RANK(TS_SUM(IF(AND(LT(TS_RANK(LOW, 10), 0.3), GT(VOLUME, TS_MEAN(VOLUME,
    10))), CLOSE - OPEN, 0), 15)) - RANK(TS_MEAN(ABS(VWAP - OPEN), 20))) / (TS_STDDEV(RET,
    15) + 1e-12)
  explanation: 衡量低价区伴随放量的日K线实体强度，并对比其与开盘价位偏离均价的程度，识别底部放量启动的确认信号。
- name: LLM_Factor4563
  expression: (RANK(TS_MAX(VOLUME * SIGN(CLOSE - VWAP), 10)) - RANK(TS_MIN(AMOUNT
    / (VOLUME + 1e-12), 10))) / (ABS(TS_MEAN(RET, 15)) + 1e-12)
  explanation: 比较成交量与价格相对均价符号乘积的最大值排名与均价的最小值排名，经平均收益绝对值调整，捕捉放量方向一致性与交易成本极端值的相对强弱。
- name: LLM_Factor4569
  expression: (RANK(TS_MAX(IF(GT(AMOUNT, VOLUME * TS_MEAN(CLOSE, 3)), AMOUNT, 0),
    10)) - RANK(TS_MEAN(IF(LE(RET, 0), VWAP - LOW, 0), 10))) / (ABS(TS_MEAN(RET, 20))
    + 1e-12)
  explanation: 比较高单位成交金额的最大值排名与下跌日中均价接近低点的平均程度排名，经平均收益调整，衡量资金效率与下跌支撑的相对表现。
- name: LLM_Factor4583
  expression: (RANK(TS_STDDEV(IF(GT(RET, 0), AMOUNT, 0), 20)) - RANK(TS_STDDEV(IF(LE(RET,
    0), VOLUME, 0), 20))) / (TS_MAX(CLOSE, 15) - TS_MIN(CLOSE, 15) + 1e-12)
  explanation: 对比上涨日中成交额的波动性与下跌日中成交量的波动性的截面相对排名，并进行价格区间归一化，捕捉不同收益方向下资金冲击的稳定性差异。
- name: LLM_Factor4587
  expression: (RANK(TS_STDDEV(IF(AND(GE(VOLUME, TS_MEAN(VOLUME, 10)), LE(ABS(CLOSE
    - OPEN), TS_MEAN(HIGH - LOW, 5) * 0.5)), VWAP, AMOUNT / (VOLUME + 1e-07)), 15))
    - RANK(TS_QUANTILE(TS_MAX(HIGH, 5) - TS_MIN(LOW, 5), 20, 0.7))) / (TS_MEAN(ABS(RET),
    10) + 1e-12)
  explanation: 该因子识别在成交量较高但价格波动内敛时，VWAP与成交均价的不一致变化及其离散程度，并结合了价格扩张性百分位数，捕捉流动性充裕下的隐蔽价格分化信息。
- name: LLM_Factor4594
  expression: (RANK(TS_MEAN(IF(AND(LE(TS_MEAN(CLOSE, 10), TS_MEAN(VWAP, 10)), GT(TS_STDDEV(VOLUME,
    15), TS_MEAN(VOLUME, 15))), RET, 0), 12)) - RANK(TS_MAX(AMOUNT, 20))) / (TS_STDDEV(CLOSE,
    10) + 1e-12)
  explanation: 比较价格趋势位于VWAP下方且成交量波动加剧时的收益率排名与最大成交额排名，探测在弱势环境下由异常成交带来的潜在逆转机会。
- name: LLM_Factor4596
  expression: (RANK(DELAY(CORREL(TS_ARGMAX(VOLUME, 8), TS_ARGMIN(ABS(CLOSE - VWAP)
    / (HIGH - LOW + 1e-12), 8), 6), 2)) * RANK(TS_STDDEV(AMOUNT / VOLUME, 12))) /
    (ABS(TS_MEAN(RET, 10)) + 1e-12)
  explanation: 融合成交量峰值位置与价格偏离位置的相关性滞后排名，乘以成交均价波动性排名，监测市场峰值活跃度与价格定位效率之间的耦合动态。
- name: LLM_Factor4614
  expression: RANK(TS_MEAN(ABS(TS_LINEAR_REGRESSION_RESI(AMOUNT / (VOLUME + 1e-07),
    10)), 20)) - RANK(TS_SUM(IF(LT(CLOSE, VWAP), 1, 0), 30))
  explanation: 比较平均成交价短期趋势残差的绝对波动与价格低于VWAP的天数，识别成交价趋势不稳定但价格常处弱势的股票。
- name: LLM_Factor4624
  expression: (RANK(TS_MEAN(IF(LT(TS_MAX(CLOSE, 5) - TS_MIN(CLOSE, 5), TS_QUANTILE(HIGH
    - LOW, 20, 0.4)), AMOUNT, 0), 15)) - RANK(TS_ARGMIN(OPEN, 10))) / (ABS(TS_MEAN(RET,
    15)) + 1e-12)
  explanation: 在价格区间收窄时，成交额的均值排名减去开盘价最低点位置排名，标准化后识别窄幅整理中资金潜伏后等待突破的时机。
- name: LLM_Factor4625
  expression: DECAY_LINEAR(IF(GT(CORREL(TS_RANK(VOLUME, 10), TS_RANK(HIGH - LOW, 10),
    8), 0.5), TS_QUANTILE(CLOSE, 20, 0.8) - CLOSE, CLOSE - TS_QUANTILE(CLOSE, 20,
    0.2)), 8)
  explanation: 当成交量与价格波动率排序高度相关时，对价格接近近期高点的股票赋予正向均值回复预期，否则赋予反向均值回复，捕捉量价配合下的反转信号。
- name: LLM_Factor4633
  expression: (RANK(TS_STDDEV(IF(LT(ABS(CLOSE - VWAP), TS_MEAN(HIGH - LOW, 5)), RET,
    0), 20)) - RANK(TS_MAX(ABS(OPEN - DELAY(CLOSE, 1)), 10))) / (TS_STDDEV(CLOSE,
    20) + 1e-12)
  explanation: 衡量价格贴近均价时收益波动与隔夜最大跳空幅度的排名差异，标准化后捕捉微观结构稳定下的异常收益波动。
- name: LLM_Factor4652
  expression: (RANK(TS_MAX(IF(LT(TS_MEAN(RET,5),0), HIGH-LOW, OPEN-CLOSE), 10)) -
    RANK(TS_MIN(IF(GT(VOLUME, TS_MEAN(VOLUME,20)), AMOUNT/VOLUME, VWAP), 15))) / (TS_STDDEV(CLOSE,
    20)+1e-12)
  explanation: 在收益弱势下比较波动极值和放量时的均价极值，突出流动性冲击下的价格韧性差异。
- name: LLM_Factor4656
  expression: (TS_QUANTILE(TS_SUM(MAX(CLOSE-OPEN,0), 10), 20, 0.75) - TS_QUANTILE(TS_SUM(MAX(OPEN-CLOSE,0),
    10), 20, 0.25)) / (TS_MEAN(TS_SUM(VOLUME, 10), 20)+1e-12)
  explanation: 通过对比近期净上涨幅度与净下跌幅度的分位数极差，并除以成交量活跃度均值，衡量多空力量积聚的非对称性与市场情绪极化程度。
- name: LLM_Factor4663
  expression: RANK(CORREL(TS_MAX(IF(LT(RET, 0), CLOSE, OPEN), 8), TS_ARGMIN(VOLUME,
    15), 10)) / (ABS(TS_MEAN(CLOSE, 10) - TS_MEAN(CLOSE, 5)) + 1e-12)
  explanation: 评估下跌中资金消耗形态：在局部低点成交量极小值的出现时间与价格弱势特征（下跌日收盘或开盘的最大值）的时序相关性，并除以短期价格偏离以增强选股区分度。
- name: LLM_Factor4668
  expression: TS_MEAN(IF(LT(ABS(CLOSE - VWAP) / (HIGH - LOW + 1e-12), TS_QUANTILE(ABS(VWAP
    - CLOSE) / (HIGH - LOW + 1e-12), 20, 0.25)), TS_SUM(VOLUME, 3), 0), 12) / (TS_MEAN(VOLUME,
    20) + 1e-12)
  explanation: 衡量收盘价相对VWAP偏差处于日内区间低位时的短期成交量累积与历史均量之比，捕捉价格在日内成本线附近窄幅震荡伴随的温和放量，预示潜在的变盘前兆。
- name: LLM_Factor4680
  expression: (RANK(TS_MAX(IF(GT(AMOUNT, TS_MEAN(AMOUNT, 20)), ABS(CLOSE - VWAP),
    0), 15)) - RANK(TS_MIN(IF(LT(VOLUME, TS_MEAN(VOLUME, 20)), ABS(OPEN - VWAP), 0),
    15))) / (TS_STDDEV(RET, 15) + 1e-12)
  explanation: 对比大额成交下收盘价偏离均价的极端程度与小额成交下开盘价偏离均价的极端程度，反映不同资金体量对均价锚定作用的冲击差异。
- name: LLM_Factor4695
  expression: RANK(CORREL(TS_QUANTILE(ABS(RET),10,0.75), TS_MEAN(CLOSE-OPEN,5),8))
    * (TS_MAX(AMOUNT,15)-TS_MIN(AMOUNT,15)) / TS_MEAN(AMOUNT,15)
  explanation: 度量尾部波动与日内趋势方向的相关性，并辅以成交额的近期极值波动，揭示高风险时段价格行为的集中性与市场情绪的一致性。
- name: LLM_Factor4698
  expression: (RANK(TS_MIN(IF(GT(AMOUNT,TS_MEAN(AMOUNT,20)*1.5), CLOSE, LOW),10))
    - RANK(TS_MAX(CORREL(OPEN,RET,5),10))) / (TS_STDDEV(CLOSE,15)+1e-12)
  explanation: 衡量异常高额成交期间的价格保护水平（收盘或最低价），并对比与开盘收益相关性的强弱，识别大额交易对价格底部的支撑效应。
- name: LLM_Factor4713
  expression: SIGN(CORREL(TS_MIN(OPEN, 15), TS_MAX(CLOSE, 15), 10)) * ABS(TS_MEAN(AMOUNT,
    20) / (TS_STDDEV(AMOUNT, 30) + 1e-12))
  explanation: 结合近期开盘价低点与收盘高点的相关性方向与成交额的稳健性比率，强调在价差收敛或发散周期中资金共识强度的放大效应。
- name: LLM_Factor4717
  expression: RANK(CORREL(TS_MEAN(AMOUNT / VOLUME, 8), TS_MEAN(HIGH - LOW, 8), 12))
    * (TS_MAX(CLOSE, 20) - TS_MIN(CLOSE, 20)) / TS_MEAN(CLOSE, 40)
  explanation: 结合成交均价与日内波动率的相关性排名与价格长期波动幅度，识别高相关性下的大幅价格运动，捕捉由均价稳定性支撑的趋势持续性。
- name: LLM_Factor4720
  expression: (RANK(DECAY_LINEAR(TS_MAX(AMOUNT, 10) - TS_MIN(AMOUNT, 10), 8)) - RANK(TS_MEAN(ABS(CLOSE
    - VWAP), 15))) / (TS_STDDEV(VOLUME, 20) + 1e-12)
  explanation: 将成交额范围的近期线性衰减强度与收盘价偏离VWAP的平均绝对距离进行比较，衡量资金波动强度与价格价值偏离度的相对变化，捕捉资金驱动的价值回归机会。
- name: LLM_Factor4748
  expression: (RANK(TS_MIN(IF(LT(ABS(RET), 0.01 * TS_STDDEV(RET, 30)), VWAP, CLOSE),
    15)) - RANK(TS_MAX(AMOUNT, 15))) / (ABS(TS_MEAN(RET, 20)) + 1e-12)
  explanation: 识别收益率异常平静时的成本价格或收盘价最小值与最大成交额排名差异，捕捉低波动环境下市场成本支撑与资金流向的错配信号。
- name: LLM_Factor4756
  expression: (RANK(TS_SUM(IF(AND(LT(CLOSE, TS_MEAN(CLOSE, 5)), GT(VOLUME, TS_MEAN(VOLUME,
    10))), VOLUME, 0), 20)) - RANK(TS_SUM(VWAP, 10))) / (TS_STDDEV(CLOSE, 20) + 1e-12)
  explanation: 捕捉价格短期破位但成交量放大的资金介入强度，并与价格波动水平对比，用于逆向识别在大幅下跌中可能出现反弹的品种。
- name: LLM_Factor4758
  expression: (RANK(TS_MAX(IF(LT(CLOSE, OPEN), AMOUNT, 0), 15)) - RANK(TS_MIN(IF(GT(CLOSE,
    OPEN), VOLUME, 0), 15))) / (ABS(TS_MEAN(RET, 10)) + 1e-12)
  explanation: 比较阴线日成交金额的最大值与阳线日成交量的最小值，识别资金在上涨缩量和下跌放量时的异常交易行为。
- name: LLM_Factor4764
  expression: (RANK(TS_STDDEV(IF(GT(AMOUNT, VOLUME * OPEN), CLOSE - OPEN, 0), 15))
    - RANK(TS_MEAN(HIGH - LOW, 10))) / (ABS(TS_MEAN(RET, 10)) + 1e-12)
  explanation: 衡量成交额显著高于开盘市值时价差波动的稳定性，并与平均日内波动对比，捕捉大单推动下价格形成的超额效率。
- name: LLM_Factor4775
  expression: (RANK(TS_ARGMIN(IF(AND(LT(OPEN, DELAY(CLOSE, 1)), LE(ABS(CLOSE - OPEN)
    / (HIGH - LOW + 1e-12), 0.3)), LOW, HIGH), 10)) - RANK(TS_QUANTILE(TS_MEAN(CLOSE,
    5), 20, 0.5))) / (TS_STDDEV(VOLUME, 10) + 1e-12)
  explanation: 度量低开且日内价格效率低（开盘收盘差占波幅小）时低点的出现时序，与中期收盘价中位数的排名差异，并用成交量波动标准化，捕捉价格在特定形态下反转位置的领先性或滞后性。
- name: LLM_Factor4780
  expression: (RANK(TS_SUM(IF(GT(CLOSE, TS_MEAN(VWAP, 5)), VOLUME * (HIGH - OPEN),
    0), 10)) - RANK(TS_SUM(IF(LT(CLOSE, TS_MEAN(VWAP, 5)), VOLUME * (OPEN - LOW),
    0), 10))) / (TS_MEAN(HIGH - LOW, 10) + 1e-12)
  explanation: 对比收盘价高于短期成本时的高开上涨量价动量，与收盘价低于短期成本时的低开下跌量价动量，表征相对成本位置的多空动能净差异。
- name: LLM_Factor4785
  expression: (RANK(TS_STDDEV(IF(LT(CLOSE, OPEN), AMOUNT / (VOLUME + 1e-07), VWAP),
    15)) - RANK(TS_MEAN(IF(GT(CLOSE, OPEN), HIGH - LOW, 0), 10))) / (ABS(TS_MEAN(RET,
    20)) + 1e-12)
  explanation: 对比下跌日成交均价波动性与上涨日平均振幅的截面排名，用长期收益绝对值调整，评估下跌时价格形成的不确定性相对于上涨时波动强度的相对异常。
- name: LLM_Factor4802
  expression: (TS_QUANTILE(CLOSE / VWAP, 20, 0.8) - TS_QUANTILE(CLOSE / VWAP, 20,
    0.2)) / (TS_MAX(AMOUNT, 10) - TS_MIN(AMOUNT, 10) + 1e-12)
  explanation: 价格相对均价比值的分布宽度（80%与20%分位点之差）除以同期成交额的极端差值，衡量价格效率相对于流动性冲击的稳定性。
- name: LLM_Factor4809
  expression: (RANK(CORREL(TS_MEAN(IF(GT(CLOSE, DELAY(CLOSE, 5)), AMOUNT, VOLUME),
    20), TS_MEAN(HIGH - LOW, 20), 10)) - RANK(TS_STDDEV(VWAP - CLOSE, 10))) / (ABS(TS_MEAN(RET,
    15)) + 1e-12)
  explanation: 衡量价格上升期间成交活跃度与价格波动的长期协同性，减去短期均价偏离的稳定性，捕捉趋势强度与定价效率的截面差异。
- name: LLM_Factor4814
  expression: (RANK(TS_SUM(IF(AND(LT(TS_RANK(CLOSE, 10), 0.4), GT(VWAP, TS_MEAN(VWAP,
    15))), VOLUME, 0), 20)) - RANK(TS_MEAN(IF(GT(HIGH - LOW, TS_STDDEV(HIGH - LOW,
    10)), AMOUNT, 0), 15))) / (ABS(TS_MEAN(RET, 25)) + 1e-12)
  explanation: 比较低位但均价上移期间的累积成交量与高波动日成交额的均值排名，捕捉低位吸筹相对于波动消耗资金的相对强度。
- name: LLM_Factor4818
  expression: (RANK(TS_MEAN(IF(LT(ABS(RET), TS_STDDEV(RET, 15)), AMOUNT / VOLUME,
    CLOSE), 20)) - RANK(TS_STDDEV(IF(GT(VOLUME, DELAY(VOLUME, 1)), OPEN, CLOSE), 15)))
    / (ABS(TS_MEAN(CLOSE - OPEN, 10)) + 1e-12)
  explanation: 低波动日的成交均价或收盘价均值排名，减去放量日开收盘波动率排名，用日内趋势强度调整，识别静默期的价值中枢相对于放量噪声的稳定性。
- name: LLM_Factor4825
  expression: (RANK(TS_ARGMIN(CLOSE, 60)) - RANK(TS_MAX(OPEN, 20))) / (TS_STDDEV(CLOSE,
    20) + 1e-12)
  explanation: 比较股价近期低点出现的新久（反映趋势延续性）与近期开盘价的强势程度，捕捉趋势动量与价格行为中短期强度背离的机会。
- name: LLM_Factor4833
  expression: RANK(TS_SUM(IF(AND(LT(TS_MEAN(CLOSE, 5), TS_MEAN(CLOSE, 20)), GT(VOLUME,
    TS_QUANTILE(VOLUME, 20, 0.8))), 1, 0), 30)) / (TS_MEAN(HIGH - LOW, 10) + 1e-12)
  explanation: 统计在短期趋势弱于长期趋势且成交量处于高位分位点时的天数，衡量下跌趋势中高量抛压的持续性，并进行波动性标准化。
- name: LLM_Factor4869
  expression: (RANK(TS_MEAN(IF(LT(VWAP, TS_MEAN(CLOSE, 3)), TS_STDDEV(CLOSE, 5), 0),
    10)) - RANK(TS_MEAN(IF(GE(VWAP, TS_MEAN(CLOSE, 3)), ABS(RET), 0), 10))) / (TS_STDDEV(CLOSE,
    20) + 1e-12)
  explanation: 比较价格位于VWAP下方时收盘价的局部波动性与VWAP上方时期望收益绝对值的排名，反映弱势区间内的定价分歧相对于强势区间内收益波动的异常。
- name: LLM_Factor4873
  expression: (RANK(TS_STDDEV(IF(AND(LT(CLOSE, OPEN), GT(VOLUME, TS_QUANTILE(VOLUME,
    20, 0.6))), AMOUNT / (VOLUME + 1e-07), VWAP), 12)) - RANK(TS_MEAN(IF(AND(GE(CLOSE,
    OPEN), LT(VOLUME, TS_QUANTILE(VOLUME, 20, 0.4))), HIGH - LOW, 0), 12))) / (ABS(TS_MEAN(RET,
    15)) + 1e-12)
  explanation: 对比高成交量下跌日成交均价波动性与低成交量上涨日平均振幅的截面排名，用收益水平调整，探测放量下跌中的信息不对称与缩量上涨中的虚假强度。
- name: LLM_Factor4883
  expression: (RANK(TS_MEAN(IF(AND(LT(VOLUME, TS_MEAN(VOLUME, 30)), GT(CLOSE, VWAP)),
    AMOUNT / (VOLUME + 1e-12), 0), 10)) - RANK(TS_MAX(IF(LT(VWAP, CLOSE), HIGH - LOW,
    OPEN - CLOSE), 15))) / (TS_STDDEV(CLOSE, 20) + 1e-12)
  explanation: 识别在上涨但成交量萎缩时的单位成交金额强度，并与高位波动范围对比，捕捉缩量上涨中的潜在动力衰竭信号。
- name: LLM_Factor4887
  expression: (RANK(TS_MAX(IF(AND(LT(CLOSE, VWAP), GT(OPEN, CLOSE)), VOLUME, 0), 10))
    - RANK(TS_MEAN(IF(AND(GT(CLOSE, VWAP), LT(OPEN, CLOSE)), HIGH - LOW, 0), 10)))
    / (TS_STDDEV(CLOSE, 15) + 1e-12)
  explanation: 度量在价格位于均价下方且当日收阴时的最大卖出压力，并对比在均价上方收阳时的平均波动幅度，捕捉不同市场状态下的压力释放与动能确认。
- name: LLM_Factor4896
  expression: (RANK(TS_MIN(IF(AND(LE(VOLUME, TS_MEAN(VOLUME, 20)), GT(CLOSE, TS_MAX(OPEN,
    5))), VWAP, HIGH), 15)) - RANK(TS_MAX(IF(GT(VOLUME, TS_MEAN(VOLUME, 30)), LOW,
    CLOSE), 10))) / (TS_STDDEV(CLOSE, 15) + 1e-12)
  explanation: 在低成交量下价格突破近期开盘高点时，寻找最低的价值中枢或高价；减去高成交量下的最低价或收盘价高点，捕捉静默突破与放量支撑的差异。
- name: LLM_Factor4911
  expression: (RANK(TS_MEAN(IF(LE(CLOSE, TS_MIN(VWAP, 8)), HIGH - CLOSE, CLOSE - LOW),
    12)) - RANK(TS_STDDEV(VOLUME, 18))) / (TS_MEAN(ABS(CLOSE - OPEN), 10) + 1e-12)
  explanation: 比较收盘价低于近期均价时的上方空间与下方空间的均值排名，减去成交量波动排名，并用绝对价格变动调整，捕捉价格受压区间的非对称弹性与流动性的互动效应。
- name: LLM_Factor4959
  expression: (RANK(TS_STDDEV(IF(LT(TS_MEAN(HIGH - LOW, 15), TS_QUANTILE(HIGH - LOW,
    20, 0.3)), AMOUNT, VWAP), 20)) - RANK(TS_MEAN(ABS(CLOSE - OPEN), 10))) / (TS_MEAN(VOLUME,
    20) + 1e-12)
  explanation: 该因子在低波动环境下度量总成交额与VWAP变化的波动性，并与绝对日内价格变化结合，以寻找流动性充足但价格活跃度的异常变化股票。
- name: LLM_Factor4976
  expression: TS_QUANTILE(TS_SUM(IF(LT(ABS(OPEN - CLOSE), TS_MEAN(HIGH - LOW, 10)),
    AMOUNT, 0), 25), 20, 0.8) / TS_MEAN(AMOUNT, 25)
  explanation: 计算区间振幅内累积成交额在较长时间窗口的高分位数与同期平均成交额的比值，衡量集中交易在平稳价格区间发生的统计密度。
- name: LLM_Factor4990
  expression: (RANK(TS_SUM(IF(AND(LT(RET, 0), GT(AMOUNT, TS_MEAN(AMOUNT, 10))), VWAP
    - LOW, 0), 8)) - RANK(TS_MIN(IF(AND(GT(RET, 0), LT(VOLUME, TS_MEAN(VOLUME, 15))),
    HIGH - CLOSE, 0), 8))) / (ABS(TS_MEAN(RET, 20)) + 1e-12)
  explanation: 对比放量下跌时VWAP相对低点的累积支撑强度与缩量上涨时上影线累积压力，用长期收益调整以识别多空力量反转点。
- name: LLM_Factor4992
  expression: RANK(CORREL(TS_ARGMIN(AMOUNT, 8), TS_ARGMAX(CLOSE, 8), 10)) / (TS_STDDEV(VOLUME,
    15) + 1e-12)
  explanation: 度量成交额最低点与价格最高点时序位置的相关性，并以成交量波动标准化，捕捉量缩价涨背离下的趋势脆弱性。
- name: LLM_Factor5007
  expression: (RANK(TS_QUANTILE(IF(AND(LT(CLOSE, OPEN), GT(VOLUME, TS_MEAN(VOLUME,
    10))), VWAP - LOW, 0), 20, 0.6)) - RANK(TS_STDDEV(OPEN / DELAY(CLOSE, 1) - 1,
    15))) / (TS_STDDEV(CLOSE, 20) + 1e-12)
  explanation: 比较放量下跌时均价至低点距离的分位数与开盘收益波动的排名，反映下跌中承接强度与开盘波动的相对关系。
- name: LLM_Factor5011
  expression: (RANK(TS_ARGMAX(IF(GT(VOLUME, TS_QUANTILE(VOLUME, 20, 0.8)), CLOSE -
    VWAP, 0), 12)) - RANK(TS_STDDEV(OPEN - DELAY(CLOSE, 1), 10))) / (ABS(TS_MEAN(RET,
    20)) + 1e-12)
  explanation: 比较高成交量下收盘溢价的最大值位置与隔夜跳空波动排名，捕捉放量溢价时机与隔夜风险的结构性差异。
- name: LLM_Factor5046
  expression: (RANK(TS_SUM(IF(AND(LE(CLOSE, VWAP), GT(VOLUME, TS_MEAN(VOLUME, 15))),
    RET, 0), 20)) - RANK(TS_MAX(OPEN - LOW, 10))) / (TS_STDDEV(CLOSE, 15) + 1e-12)
  explanation: 对比在均价下方放量时的累计收益与开盘相对低点的最大优势，捕捉弱势放量反弹与价格支撑的相对强度。
- name: LLM_Factor5050
  expression: DECAY_LINEAR(IF(GT(CORREL(OPEN, VOLUME, 10), 0), TS_MAX(CLOSE, 5) -
    TS_MIN(CLOSE, 5), TS_MEAN(CLOSE, 5) - CLOSE), 12)
  explanation: 根据开盘价与成交量的正相关性，线性加权价格区间宽度或均值偏离，强调量价同向时的价格拓展或回归特性。
- name: LLM_Factor5051
  expression: (RANK(TS_STDDEV(IF(LE(VOLUME, TS_QUANTILE(VOLUME, 30, 0.25)), AMOUNT,
    0), 20)) - RANK(TS_MEAN(HIGH - LOW, 15))) / (ABS(TS_MEAN(RET, 10)) + 1e-12)
  explanation: 对比低成交量时期成交金额的波动性与价格区间宽度的相对排名，识别清淡市场中交易额的不稳定性。
- name: LLM_Factor5061
  expression: RANK(DELAY(TS_MEAN(SIGN(TS_MAX(VOLUME, 12) - TS_MIN(VOLUME, 12)) * CORREL(TS_RANK(LOW,
    10), TS_RANK(AMOUNT, 10), 8), 15), 3)) / (ABS(TS_MEAN(RET, 18)) + 1e-12)
  explanation: 基于滞后流动性波动率符号与量价结构相关性的均值排名，捕捉波段起点到加速阶段的过渡期资金匹配效率。
- name: LLM_Factor5086
  expression: (RANK(TS_QUANTILE(VWAP, 15, 0.75) - TS_QUANTILE(VWAP, 15, 0.25)) - RANK(TS_SUM(IF(AND(GT(RET,
    0), LT(VOLUME, TS_MEAN(VOLUME, 20))), 1, 0), 10))) / (TS_STDDEV(RET, 20) + 1e-12)
  explanation: 比较均价分布的宽度截面排名与低量上涨日次数的排名差异，并用收益波动标准化，识别出均价区间宽但上涨日无需放量的稳健趋势股。
- name: LLM_Factor5094
  expression: (RANK(TS_SUM(IF(LT(TS_RANK(CLOSE, 20), 0.15), IF(GT(RET, 0), VOLUME,
    -VOLUME), 0), 25)) - RANK(TS_MEAN(OPEN - DELAY(CLOSE, 1), 15))) / (TS_STDDEV(CLOSE,
