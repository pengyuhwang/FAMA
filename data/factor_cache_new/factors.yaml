    20)), 15)
  explanation: 衡量股价短期高点阻力强度与相对成交量变化的截面相关性，捕捉放量遇阻或缩量突破的市场微观结构信息。
- name: LLM_Factor872
  expression: IF(LT(CORREL(CLOSE, VOLUME, 10), -0.2), TS_MIN(LOW, 10) / HIGH, TS_MAX(HIGH,
    10) / LOW)
  explanation: 基于负相关市场设定震荡区间的上下边界比率，捕捉量价背离状态下的极限转折点价格行为。
- name: LLM_Factor877
  expression: TS_MEAN(IF(LT(CORREL(RET, VOLUME, 5), 0), ABS(RET) * (HIGH - LOW), 0),
    15) / TS_MEAN(HIGH - LOW, 15)
  explanation: 捕捉价格与成交量负相关阶段的异常波动强度，并相对于基准波动归一，挖掘市场在分化期的定价错位。
- name: LLM_Factor903
  expression: (TS_MEAN(IF(LT((HIGH-LOW), TS_QUANTILE(HIGH-LOW, 20, 0.4)), (CLOSE -
    (HIGH+LOW)/2)/(HIGH-LOW+1e-12), 0), 10) - TS_MEAN(IF(GE((HIGH-LOW), TS_QUANTILE(HIGH-LOW,
    20, 0.6)), (CLOSE - (HIGH+LOW)/2)/(HIGH-LOW+1e-12), 0), 10)) * RANK(VOLUME)
  explanation: 该因子计算窄幅波动日内收盘价相对区间中点的位置均值与宽幅波动日内相应位置的均值之差，并用成交量排序加权，捕捉不同波动状态下价格中心粘性的差异。
- name: LLM_Factor1004
  expression: RANK(TS_SUM(IF(LT(HIGH - LOW, TS_MEAN(HIGH - LOW, 10)), AMOUNT, 0),
    15)) - RANK(TS_SUM(AMOUNT, 15))
  explanation: 识别在窄幅波动期间发生的成交金额占比，反映缩量整理后的潜在突破方向。
- name: LLM_Factor1027
  expression: DECAY_LINEAR(IF(LT(TS_MEAN(VOLUME, 10), VOLUME), (HIGH - LOW) / CLOSE,
    0), 8)
  explanation: 度量仅在放量日出现的大幅日内价格波动，并通过线性衰减赋予最近波动更高权重，反映短期资金推动下的价格动量。
- name: LLM_Factor1043
  expression: RANK(DECAY_LINEAR(IF(LT(VWAP, TS_MEAN(VWAP, 20)), AMOUNT, 0), 15))
  explanation: 对价格低于其20日均价时的成交额进行近期加权累积并做截面排序，反映在价格相对弱势区间内资金主动承接的强度，捕捉逢低布局的信号。
- name: LLM_Factor1075
  expression: TS_MEAN(IF(GT(ABS(RET), TS_STDDEV(RET, 20)), (HIGH - LOW) / CLOSE, 0),
    15)
  explanation: 在收益率异常波动日，捕捉其真实波幅的相对大小，衡量极端波动事件中价格的实际摆动幅度。
- name: LLM_Factor1077
  expression: (TS_MAX(AMOUNT, 30) - TS_MIN(AMOUNT, 30)) / TS_MEAN(AMOUNT, 30)
  explanation: 过去30日内成交金额的极差相对于其均值的比例，衡量资金流动的极端性，值高预示资金流入流出剧烈。
- name: LLM_Factor1126
  expression: TS_LINEAR_REGRESSION_RESI(RANK((CLOSE - TS_MIN(LOW, 10)) / (TS_MAX(HIGH,
    10) - TS_MIN(LOW, 10))), 15) - TS_STDDEV(AMOUNT / (VOLUME + 1e-07), 20)
  explanation: 对价格相对位置排名进行趋势残差调整，并减去均价波动率，识别潜在价格中枢收敛时的估值修复机会。
- name: LLM_Factor1225
  expression: REPLACE_NAN_INF(CORREL(TS_MAX(CLOSE, 10) - TS_MIN(LOW, 10), (VOLUME
    / TS_MEAN(VOLUME, 10)), 20), 0)
  explanation: 度量近期价格区间宽度与成交活跃度变化的相关性，反映价格突破与资金跟随的共同性强弱。
- name: LLM_Factor1230
  expression: (TS_MAX(VWAP, 10) - TS_MEAN(VWAP, 10)) / (TS_STDDEV(AMOUNT, 10) + 1e-7)
  explanation: 衡量日内成交加权价格高点相对于其均值的偏离，并除以成交金额波动，刻画资金集中度的极端性与可适性。
- name: LLM_Factor1253
  expression: TS_MEAN(IF(LT(ABS((CLOSE - DELAY(CLOSE, 1)) / DELAY(CLOSE, 1)), TS_MEAN(ABS(RET),
    30)), 1, 0), 20) * RANK(VWAP - TS_MIN(LOW, 5))
  explanation: 低波动期间的VWAP与近期底部距离，识别安全边际下的价值回归动力。
- name: LLM_Factor1258
  expression: SIGN(CORREL(TS_RANK(OPEN, 20), TS_RANK(VOLUME, 20), 10)) * TS_STDDEV(CLOSE
    / DELAY(CLOSE, 1) - 1, 10)
  explanation: 开盘价与成交量排序相关性符号乘以收益波动率，结合市场结构与波动择时。
- name: LLM_Factor1260
  expression: RANK(TS_SUM(IF(LT(AMOUNT, TS_MEAN(AMOUNT, 20)), HIGH - LOW, 0), 15))
  explanation: 小成交额日振幅的截面排序，反映非流动性冲击下的价格弹性差异。
- name: LLM_Factor1281
  expression: IF(GT(TS_ARGMIN(LOW, 10), TS_ARGMIN(VOLUME, 10)), TS_MEAN(AMOUNT, 10),
    TS_MEAN(CLOSE, 10)) / TS_STDDEV(VWAP, 20)
  explanation: 判断价格低点出现是否晚于成交量低点，若是则采用近期平均成交金额，反之用近期平均价格，并除以价格波动以区分驱动类型。
- name: LLM_Factor1323
  expression: CORREL(TS_ARGMIN(IF(LT(VWAP, CLOSE), LOW, HIGH), 10), TS_ARGMIN(VOLUME,
    10), 8) / 8
  explanation: 该因子计算价格低于/高于均价时的支撑/阻力位出现时间与成交量谷底出现时间的滚动相关性，衡量价量底部共振的时序同步性。
- name: LLM_Factor1330
  expression: SCALE(TS_MEAN(IF(LT(ABS(RET), TS_STDDEV(RET, 25)), HIGH - LOW, 0), 20)
    - TS_MEAN(IF(GT(ABS(RET), TS_STDDEV(RET, 25)), HIGH - LOW, 0), 20))
  explanation: 衡量正常波动日内与异常波动日内的平均振幅差异，反映价格稳定及冲击环境下市场流动性供给与交易深度的区别。
- name: LLM_Factor1407
  expression: (TS_MAX(HIGH - LOW, 15) - (HIGH - LOW)) / (TS_STDDEV(HIGH - LOW, 15)
    + 1e-12)
  explanation: 度量当前日波动幅度在近期波动极值中所处位置，及其在波动区间内的相对偏离度，用于识别波动率均值回归的潜在线索。
- name: LLM_Factor1421
  expression: (TS_ARGMAX(VOLUME, 30) - TS_ARGMIN(VWAP, 30)) / 30
  explanation: 该因子计算过去30个交易日成交量峰值与成交均价(VWAP)低谷出现的时间差，刻画市场流动性高位与价格低位之间的时间错配。
- name: LLM_Factor1423
  expression: TS_SUM(IF(LT(ABS(CLOSE - TS_MEAN(CLOSE, 20)), TS_STDDEV(CLOSE, 20)),
    AMOUNT, 0), 25) / TS_SUM(AMOUNT, 25)
  explanation: 该因子衡量在价格未明显偏离其长期均值的“正常”区间内所发生的累计成交金额占比，反映市场在价值中枢附近的交易活跃度与共识程度。
- name: LLM_Factor1451
  expression: TS_SUM(IF(LT((CLOSE - VWAP) / VWAP, TS_MEAN((CLOSE - VWAP) / VWAP, 10)),
    ABS(RET), 0), 15)
  explanation: 累计在股价低于近期平均VWAP偏离时的绝对值收益，捕捉弱势偏离期间的波动积聚，可能预示底部反转能量。
- name: LLM_Factor1456
  expression: (TS_QUANTILE(AMOUNT, 20, 0.75) - TS_QUANTILE(AMOUNT, 20, 0.25)) / TS_MEAN(VOLUME,
    20)
  explanation: 衡量成交金额在20日窗口内的四分位距相对于平均成交量的比值，刻画资金流分布的离散程度与流动性宽度的相对关系。
- name: LLM_Factor1498
  expression: CORREL(TS_RANK(CLOSE, 8), TS_RANK(HIGH - LOW, 8), 8)
  explanation: 价格排名与日内波幅排名的相关性，识别价格与波动同步性的短期变化。
- name: LLM_Factor1596
  expression: TS_STDDEV(CORREL(OPEN - LOW, HIGH - CLOSE, 10), 20)
  explanation: 开盘下探与收盘上冲相关性的波动率，捕捉日内多空博弈模式的稳定性，高波动预示情绪转变或信息不对称加剧。
- name: LLM_Factor1700
  expression: SIGN(TS_MAX(CLOSE, 10) - TS_MIN(CLOSE, 10)) * TS_RANK(ABS(AMOUNT - DELAY(AMOUNT,
