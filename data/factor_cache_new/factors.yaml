- name: alpha158_sumd10
  expression: ((TS_SUM(MAX((CLOSE - DELAY(CLOSE, 1)), 0), 10) - TS_SUM(MAX((DELAY(CLOSE,
    1) - CLOSE), 0), 10)) / (TS_SUM(ABS((CLOSE - DELAY(CLOSE, 1))), 10) + 1e-12))
  explanation: 衡量近10日上涨与下跌幅度之差占总波动的比例，刻画短期买卖力量对比与价格动量强弱，数值越高代表买盘占优、上涨趋势更强。
- name: alpha158_sumd20
  expression: ((TS_SUM(MAX((CLOSE - DELAY(CLOSE, 1)), 0), 20) - TS_SUM(MAX((DELAY(CLOSE,
    1) - CLOSE), 0), 20)) / (TS_SUM(ABS((CLOSE - DELAY(CLOSE, 1))), 20) + 1e-12))
  explanation: 该因子衡量近20日价格涨跌幅的相对强弱（归一到[-1,1]），反映短期动能与买卖力量平衡，值越高表示买盘占优、上行动能更强。
- name: alpha158_sumd30
  expression: ((TS_SUM(MAX((CLOSE - DELAY(CLOSE, 1)), 0), 30) - TS_SUM(MAX((DELAY(CLOSE,
    1) - CLOSE), 0), 30)) / (TS_SUM(ABS((CLOSE - DELAY(CLOSE, 1))), 30) + 1e-12))
  explanation: 该因子以近30日上涨与下跌幅度的净占比（归一化RSI）刻画短期价格动量与买卖力量不对称，值越高说明买压更强、上涨延续的可能性更大。
- name: alpha158_sumd60
  expression: ((TS_SUM(MAX((CLOSE - DELAY(CLOSE, 1)), 0), 60) - TS_SUM(MAX((DELAY(CLOSE,
    1) - CLOSE), 0), 60)) / (TS_SUM(ABS((CLOSE - DELAY(CLOSE, 1))), 60) + 1e-12))
  explanation: 该因子通过比较近60日累计上涨与下跌幅度之差占总波动的比重来刻画净买卖压力与趋势强度，数值越高代表买方占优、上行趋势更强，越低则卖方占优。
- name: alpha158_vma5
  expression: (TS_MEAN(VOLUME, 5) / (VOLUME + 1e-12))
  explanation: 该因子刻画当前成交量相对近5日平均成交量的偏离程度，值大于1表示量缩（当前低于均量）、小于1表示放量，反映短期流动性与市场关注度变化。
- name: alpha158_vma10
  expression: (TS_MEAN(VOLUME, 10) / (VOLUME + 1e-12))
  explanation: 该因子以近10日成交量均值除以当日成交量来衡量相对交易活跃度与流动性，值越低表示当日放量（信息到达/关注度提升、潜在流动性冲击），值越高表示缩量（关注度下降、流动性偏弱）。
- name: alpha158_vma20
  expression: (TS_MEAN(VOLUME, 20) / (VOLUME + 1e-12))
  explanation: 该因子刻画当前成交量相对20日均量的偏离程度，值越大表示当前量低于常态、流动性偏弱，值越小表示放量、市场关注与潜在价格冲击上升。
- name: alpha158_vma30
  expression: (TS_MEAN(VOLUME, 30) / (VOLUME + 1e-12))
  explanation: 该因子以近30日成交量均值与当日成交量之比刻画当前交易活跃度的异常程度，值越低表示放量（信息到达、关注度上升、流动性增强），值越高表示缩量（关注度下降、流动性偏弱）。
- name: alpha158_vma60
  expression: (TS_MEAN(VOLUME, 60) / (VOLUME + 1e-12))
  explanation: 该因子以60日均量除以当日成交量，刻画相对成交活跃度与流动性：值越大表示当前缩量、关注度偏低，值越小表示放量、资金关注度提升或信息冲击更强。
- name: alpha158_vstd5
  expression: (TS_STDDEV(VOLUME, 5) / (VOLUME + 1e-12))
  explanation: 该因子衡量近5日成交量相对当前水平的波动性，数值越大表示交易活跃度与流动性更不稳定、资金进出波动更大。
- name: alpha158_vstd10
  expression: (TS_STDDEV(VOLUME, 10) / (VOLUME + 1e-12))
  explanation: 该因子衡量近10日成交量相对当前成交量的波动幅度，数值越大表示交易活跃度更不稳定、潜在流动性冲击风险更高。
- name: alpha158_vstd20
  expression: (TS_STDDEV(VOLUME, 20) / (VOLUME + 1e-12))
  explanation: 衡量近20日成交量波动相对于当日成交量的强度，反映流动性稳定性与交易参与不确定性，数值越大表示近期量能起伏大而当日量能偏弱、流动性风险更高。
- name: alpha158_vstd30
  expression: (TS_STDDEV(VOLUME, 30) / (VOLUME + 1e-12))
  explanation: 衡量近30日成交量相对当前成交量的波动强度，数值越高意味着流动性更不稳定、资金关注度起伏大及潜在交易成本与信息冲击风险更高。
- name: alpha158_vstd60
  expression: (TS_STDDEV(VOLUME, 60) / (VOLUME + 1e-12))
  explanation: 该因子衡量过去60期成交量波动性相对于当期成交量的比例，数值越大意味着当期成交量相对其历史波动偏低、流动性更不稳定且潜在价格冲击风险更高。
- name: alpha158_wvma5
  expression: (TS_STDDEV((ABS(((CLOSE / DELAY(CLOSE, 1)) - 1)) * VOLUME), 5) / (TS_MEAN((ABS(((CLOSE
    / DELAY(CLOSE, 1)) - 1)) * VOLUME), 5) + 1e-12))
  explanation: 该因子以近5日“绝对收益×成交量”的标准差与均值之比刻画交易活跃度与价格冲击的相对不稳定性（变异系数），值越大表示短期交易压力更剧烈、流动性更脆弱、风险更高。
- name: alpha158_wvma10
  expression: (TS_STDDEV((ABS(((CLOSE / DELAY(CLOSE, 1)) - 1)) * VOLUME), 10) / (TS_MEAN((ABS(((CLOSE
    / DELAY(CLOSE, 1)) - 1)) * VOLUME), 10) + 1e-12))
  explanation: 该因子是10日内“绝对收益×成交量”的变异系数，刻画由价格变动引致的交易活跃度与流动性需求的相对不稳定性，高值意味着成交与波动更具突发性、情绪更不稳。
- name: alpha158_wvma20
  expression: (TS_STDDEV((ABS(((CLOSE / DELAY(CLOSE, 1)) - 1)) * VOLUME), 20) / (TS_MEAN((ABS(((CLOSE
    / DELAY(CLOSE, 1)) - 1)) * VOLUME), 20) + 1e-12))
  explanation: 该因子衡量过去20日“绝对收益×成交量”的变异系数，刻画量价冲击强度的相对不稳定性，数值越高意味着流动性与波动更易骤变。
- name: alpha158_wvma30
  expression: (TS_STDDEV((ABS(((CLOSE / DELAY(CLOSE, 1)) - 1)) * VOLUME), 30) / (TS_MEAN((ABS(((CLOSE
    / DELAY(CLOSE, 1)) - 1)) * VOLUME), 30) + 1e-12))
  explanation: 该因子是过去30日“|收益|×成交量”的变动系数，衡量流动性调整后的价格波动稳定性，值越大表示交易冲击更不均衡、市场情绪与流动性波动更剧烈。
- name: alpha158_wvma60
  expression: (TS_STDDEV((ABS(((CLOSE / DELAY(CLOSE, 1)) - 1)) * VOLUME), 60) / (TS_MEAN((ABS(((CLOSE
    / DELAY(CLOSE, 1)) - 1)) * VOLUME), 60) + 1e-12))
  explanation: 该因子衡量过去60日“绝对收益×成交量”的波动系数，反映价格变动强度与交易活跃度耦合的稳定性，数值越高意味着交易冲击更剧烈、市场不确定性与流动性风险更高。
- name: alpha158_vsump5
  expression: (TS_SUM(MAX((VOLUME - DELAY(VOLUME, 1)), 0), 5) / (TS_SUM(ABS((VOLUME
    - DELAY(VOLUME, 1))), 5) + 1e-12))
  explanation: 衡量过去5个交易日里成交量上升变动在总变动中的占比，以刻画交易活跃度的上行趋势强弱，数值越大通常意味着市场参与度与买兴增强、风险偏好回升。
- name: alpha158_vsump10
  expression: (TS_SUM(MAX((VOLUME - DELAY(VOLUME, 1)), 0), 10) / (TS_SUM(ABS((VOLUME
    - DELAY(VOLUME, 1))), 10) + 1e-12))
  explanation: 该因子衡量过去10日成交量变化的上行占比（成交量增加的累计幅度占总变动的比重），值越高表示市场参与度与流动性持续扩张、交易活跃度增强，值越低则反映收缩。
- name: alpha158_vsump20
  expression: (TS_SUM(MAX((VOLUME - DELAY(VOLUME, 1)), 0), 20) / (TS_SUM(ABS((VOLUME
    - DELAY(VOLUME, 1))), 20) + 1e-12))
  explanation: 刻画过去20日成交量变化中正向增量占比的强弱，数值越高说明成交量更常上升、投资者关注度与流动性呈持续增强。
- name: alpha158_vsump30
  expression: (TS_SUM(MAX((VOLUME - DELAY(VOLUME, 1)), 0), 30) / (TS_SUM(ABS((VOLUME
    - DELAY(VOLUME, 1))), 30) + 1e-12))
  explanation: 该因子衡量过去30日成交量日度变动中“上升”部分占总变动的比例，值越高说明成交量更偏向上行、市场关注度与资金活跃度提升，值越低则反映热度与流动性走弱。
- name: alpha158_vsump60
  expression: (TS_SUM(MAX((VOLUME - DELAY(VOLUME, 1)), 0), 60) / (TS_SUM(ABS((VOLUME
    - DELAY(VOLUME, 1))), 60) + 1e-12))
  explanation: 该因子度量近60日成交量变动中“增加”的占比，反映交易活跃度与流动性扩张的持续性，数值越高通常意味着市场关注与资金参与增强、情绪偏多并可能支持后续动量。
- name: alpha158_vsumn5
  expression: (TS_SUM(MAX((DELAY(VOLUME, 1) - VOLUME), 0), 5) / (TS_SUM(ABS((VOLUME
    - DELAY(VOLUME, 1))), 5) + 1e-12))
  explanation: 该因子衡量近5日成交量变动中由下降部分的占比，数值越高意味着成交活跃度持续走弱、市场交易意愿与流动性趋于收缩。
- name: alpha158_vsumn10
  expression: (TS_SUM(MAX((DELAY(VOLUME, 1) - VOLUME), 0), 10) / (TS_SUM(ABS((VOLUME
    - DELAY(VOLUME, 1))), 10) + 1e-12))
  explanation: 该因子衡量近10日成交量变动中由“缩量”贡献的比例，值越高表明交投活跃度持续走弱、投资者参与意愿下降，可能预示情绪趋谨慎与动能衰减。
- name: alpha158_vsumn20
  expression: (TS_SUM(MAX((DELAY(VOLUME, 1) - VOLUME), 0), 20) / (TS_SUM(ABS((VOLUME
    - DELAY(VOLUME, 1))), 20) + 1e-12))
  explanation: 该因子衡量近20日成交量变动中“缩量”的相对占比，数值越高意味着成交量持续收缩、市场流动性与风险偏好走弱。
- name: alpha158_vsumn30
  expression: (TS_SUM(MAX((DELAY(VOLUME, 1) - VOLUME), 0), 30) / (TS_SUM(ABS((VOLUME
    - DELAY(VOLUME, 1))), 30) + 1e-12))
  explanation: 该因子衡量过去30日成交量日度变化中“下降”部分的占比，比例越高表明成交量持续缩减、流动性与参与度走弱，越低则显示量能扩张。
- name: alpha158_vsumn60
  expression: (TS_SUM(MAX((DELAY(VOLUME, 1) - VOLUME), 0), 60) / (TS_SUM(ABS((VOLUME
    - DELAY(VOLUME, 1))), 60) + 1e-12))
  explanation: 该因子衡量过去60日成交量变动中由下降贡献的比例，数值越高说明成交量更常或更大幅度地收缩、交易兴趣与流动性走弱，越低则反映成交量扩张与风险偏好改善。
- name: alpha158_vsumd5
  expression: ((TS_SUM(MAX((VOLUME - DELAY(VOLUME, 1)), 0), 5) - TS_SUM(MAX((DELAY(VOLUME,
    1) - VOLUME), 0), 5)) / (TS_SUM(ABS((VOLUME - DELAY(VOLUME, 1))), 5) + 1e-12))
  explanation: 该因子通过比较近5日成交量上升与下降的归一化差额来刻画市场参与热度的动量强弱，值高代表量能持续放大、资金关注度提升，值低则量能走弱、关注度下降。
- name: alpha158_vsumd10
  expression: ((TS_SUM(MAX((VOLUME - DELAY(VOLUME, 1)), 0), 10) - TS_SUM(MAX((DELAY(VOLUME,
    1) - VOLUME), 0), 10)) / (TS_SUM(ABS((VOLUME - DELAY(VOLUME, 1))), 10) + 1e-12))
  explanation: 该因子衡量过去10日成交量变化的方向性与强度（类似成交量的RSI），反映市场参与度与资金关注度的趋势动量，值越高表示成交量持续放大、流动性增强。
- name: alpha158_vsumd20
  expression: ((TS_SUM(MAX((VOLUME - DELAY(VOLUME, 1)), 0), 20) - TS_SUM(MAX((DELAY(VOLUME,
    1) - VOLUME), 0), 20)) / (TS_SUM(ABS((VOLUME - DELAY(VOLUME, 1))), 20) + 1e-12))
  explanation: 该因子衡量近20日成交量上升与下降的净占比，反映市场参与度与流动性的持续性变化，值越高表示资金关注与交易活跃度持续增强、需求累积，值越低则相反。
- name: alpha158_vsumd30
  expression: ((TS_SUM(MAX((VOLUME - DELAY(VOLUME, 1)), 0), 30) - TS_SUM(MAX((DELAY(VOLUME,
    1) - VOLUME), 0), 30)) / (TS_SUM(ABS((VOLUME - DELAY(VOLUME, 1))), 30) + 1e-12))
  explanation: 该因子衡量近30日成交量正向与负向变动的归一化净值，高值表示成交量持续放大、市场参与度与流动性增强，低值则表示成交量走弱、关注度下降。
- name: alpha158_vsumd60
  expression: ((TS_SUM(MAX((VOLUME - DELAY(VOLUME, 1)), 0), 60) - TS_SUM(MAX((DELAY(VOLUME,
    1) - VOLUME), 0), 60)) / (TS_SUM(ABS((VOLUME - DELAY(VOLUME, 1))), 60) + 1e-12))
  explanation: 该因子衡量近60日成交量变动的方向性强度（净增量相对总变动），数值越高表示成交量持续上升、市场关注与流动性增强，越低则代表兴趣减弱与流动性走弱。
- name: LLM_Factor1
  expression: TS_RANK(DECAY_LINEAR(((VWAP - CLOSE) / (ABS((HIGH - LOW)) + 1e-12)),
    5), 20)
  explanation: 衡量收盘价相对VWAP的尾盘偏离程度并做短期平滑，反映尾盘主导资金的偏向与潜在反转压力。
- name: LLM_Factor2
  expression: DECAY_LINEAR((((HIGH - CLOSE) - (OPEN - LOW)) / (ABS((HIGH - LOW)) +
    1e-12)), 5)
  explanation: 以上影与下影的相对强弱衡量日内资金回吐与承接的失衡，反映短线反转倾向。
- name: LLM_Factor3
  expression: DECAY_LINEAR((((HIGH - MAX(OPEN, CLOSE)) - ((OPEN + CLOSE - MAX(OPEN,
    CLOSE)) - LOW)) / (ABS((HIGH - LOW)) + 1e-12)), 5)
  explanation: 以上影与下影差占当日振幅的比例衡量买卖压力的不对称性。
- name: LLM_Factor4
  expression: (TS_ARGMAX(ABS(RET), 30) / 30)
  explanation: 衡量距最近一次极端收益冲击的时间，新鲜度越高影响越大。
- name: LLM_Factor5
  expression: CORREL((((HIGH - LOW) / (VWAP + 1e-12))), DELAY((((HIGH - LOW) / (VWAP
    + 1e-12))), 1), 15)
  explanation: 衡量经价格标准化后的振幅自相关，刻画波动聚类特征。
- name: LLM_Factor6
  expression: REPLACE_NAN_INF(CORREL(RET, (VWAP - OPEN), 12), 0)
  explanation: 衡量收益与VWAP相对开盘的位移是否同向，刻画日内主导资金方向。
- name: LLM_Factor7
  expression: REPLACE_NAN_INF(CORREL((HIGH - LOW), ABS((CLOSE - VWAP)), 15), 0)
  explanation: 振幅与收盘偏离均价的相关性，刻画大波动是否伴随收尾方向性偏移。
- name: LLM_Factor8
  expression: REPLACE_NAN_INF(CORREL((CLOSE - VWAP), DELAY((CLOSE - VWAP), 1), 10),
    0)
  explanation: 收盘相对均价偏离的自相关度，衡量均值回归或持续偏离的特征。
- name: LLM_Factor9
  expression: ((ABS((CLOSE - DELAY(CLOSE, 20))) + 1e-12) / (TS_SUM(ABS((CLOSE - DELAY(CLOSE,
    1))), 20) + 1e-12))
  explanation: 以净变动占总波动衡量价格行进效率，数值越高代表趋势更直。
- name: LLM_Factor10
  expression: TS_MEAN(((OPEN - LOW) / (ABS((HIGH - LOW)) + 1e-12)), 20)
  explanation: 统计开盘价在当日区间中的相对位置均值，反映开盘定价的偏向。
- name: LLM_Factor11
  expression: TS_MEAN(SIGN(((HIGH - MAX(OPEN, CLOSE)) - (MIN(OPEN, CLOSE) - LOW))),
    15)
  explanation: 统计上影线与下影线强弱的平均偏向，刻画盘中抛压与承接的不平衡。
- name: LLM_Factor12
  expression: REPLACE_NAN_INF(CORREL(VOLUME, ABS((CLOSE - DELAY(CLOSE, 1))), 12),
    0)
  explanation: 成交量与绝对收益的相关性，捕捉量价共振的强弱。
- name: LLM_Factor13
  expression: (DECAY_LINEAR(((CLOSE - VWAP) / (ABS(VWAP) + 1e-12)), 10) * IF(LT(TS_STDDEV(RET,
    10), TS_STDDEV(RET, 60)), 1, 0))
  explanation: 在低波动阶段强化的收盘价相对VWAP偏离的平滑度量，刻画资金围绕均衡价的偏离持续性。
- name: LLM_Factor14
  expression: REPLACE_NAN_INF(CORREL(((HIGH - LOW) / (ABS(VWAP) + 1e-12)), VOLUME,
    20), 0)
  explanation: 波动区间对成交量的弹性相关性，衡量放量是否伴随有效价格扩张。
- name: LLM_Factor15
  expression: TS_MEAN(IF(GT((HIGH - LOW), TS_MEAN((HIGH - LOW), 10)), ((CLOSE - LOW)
    / (ABS((HIGH - LOW)) + 1e-12)), 0), 20)
  explanation: 在波动放大日统计收盘相对区间的偏位，捕捉大幅波动期的强弱分布。
- name: LLM_Factor16
  expression: IF(LT(TS_STDDEV(RET, 20), TS_MEAN(ABS(RET), 20)), (ABS((CLOSE - DELAY(CLOSE,
    1))) / (TS_STDDEV(RET, 20) + 1e-12)), 0)
  explanation: 仅在低波动压缩期统计单日突破强度，识别压缩后的动能释放。
- name: LLM_Factor17
  expression: DECAY_LINEAR(((((MIN(OPEN, CLOSE) - LOW) - (HIGH - MAX(OPEN, CLOSE)))
    / (ABS((HIGH - LOW)) + 1e-12)) * (TS_RANK(VOLUME, 60) - 0.5)), 5)
  explanation: 成交量权重的上下影线不对称度，用于识别低位承接与高位抛压强弱。
- name: LLM_Factor18
  expression: (TS_ARGMAX((ABS((CLOSE - VWAP)) / (ABS((HIGH - LOW)) + 1e-12)), 20)
    / 20)
  explanation: 最近20期收盘相对VWAP最大错位的时距归一，衡量异常错位的新鲜度。
- name: LLM_Factor19
  expression: TS_LINEAR_REGRESSION_R2(VWAP, 30)
  explanation: 衡量VWAP在中期内的线性单调性，趋势越顺畅R2越高。
- name: LLM_Factor20
  expression: TS_STDDEV(RET, 10) / (TS_STDDEV(RET, 60) + 1e-12)
  explanation: 刻画短期相对长期的波动压缩或扩张，数值越高说明处于噪声放大期。
- name: LLM_Factor21
  expression: TS_MEAN(ABS(CLOSE - TS_MEAN(CLOSE, 10)) / TS_STDDEV(CLOSE, 10), 5)
  explanation: 短期价格偏离均值的标准化绝对偏差滚动均值，衡量价格在波动率调整下的持续偏离程度。
- name: LLM_Factor22
  expression: (TS_MAX(AMOUNT, 15) - TS_MIN(AMOUNT, 15)) / (TS_MEAN(AMOUNT, 15) + 1e-12)
  explanation: 衡量成交额在短期内的极差相对均值的变化，识别资金流动的剧烈波动。
- name: LLM_Factor23
  expression: TS_QUANTILE(AMOUNT, 30, 0.8) / TS_MEAN(AMOUNT, 30)
  explanation: 比较成交金额的历史高位与均值的相对水平，评估资金流入的极端程度。
- name: LLM_Factor24
  expression: TS_MEAN(ABS(CLOSE - TS_MEAN(CLOSE, 10)) / TS_STDDEV(CLOSE, 10), 15)
  explanation: 价格偏离均值的标准化波动均值，衡量价格的均值回归强度。
- name: LLM_Factor25
  expression: (TS_QUANTILE(AMOUNT, 15, 0.6) - TS_QUANTILE(AMOUNT, 15, 0.4)) / TS_MEAN(VOLUME,
    15)
  explanation: 成交金额分布中间区域的集中度经成交量标准化，反映大单活跃度的分布均匀性特征。
- name: LLM_Factor26
  expression: (TS_MEAN(ABS(CLOSE - TS_MEAN(CLOSE, 20)), 5) / TS_STDDEV(CLOSE, 20))
  explanation: 短期均值偏离度与长期波动率的标准化比值，识别波动收敛中的异动起点。
- name: LLM_Factor27
  expression: SIGN(VWAP - CLOSE) * TS_RANK(ABS(HIGH - LOW), 10)
  explanation: 结合均价相对位置与波动率排名，捕捉价格偏离成本时的波动扩张效应。
- name: LLM_Factor28
  expression: CORREL(TS_MEAN(OPEN, 5), TS_MEAN(CLOSE, 5), 10)
  explanation: 开盘价与收盘价短期均值的滚动相关性，捕捉盘面价格一致性的变化。
- name: LLM_Factor29
  expression: DECAY_LINEAR(RANK(TS_LINEAR_REGRESSION_RESI(OPEN, 10, CLOSE)), 6)
  explanation: 分析开盘价相对收盘价趋势的残差排名衰减，捕捉开盘跳空后的价格修正倾向。
- name: LLM_Factor30
  expression: RANK(IF(GT(VOLUME, TS_MEAN(VOLUME, 20)), TS_MEAN(CLOSE, 5) / TS_MEAN(CLOSE,
    20), TS_STDDEV(CLOSE, 10) / CLOSE))
  explanation: 结合成交量筛选的短期动量与波动率调整因子，高成交量时侧重短期价格趋势，低成交量时侧重价格波动以捕捉不同市场状态下的alpha。
- name: LLM_Factor31
  expression: CORREL(TS_MEAN(VOLUME, 5), TS_MEAN((HIGH - LOW) / OPEN, 5), 15)
  explanation: 该因子度量短期平均成交量与波动率的相关性，反映资金流动与价格波动之间的动态关联。
- name: LLM_Factor32
  expression: (TS_QUANTILE(AMOUNT, 30, 0.8) - TS_QUANTILE(AMOUNT, 30, 0.2)) / TS_MEAN(AMOUNT,
    30)
  explanation: 成交额分布宽度与均值的标准化比值，识别大额交易活跃度差异，反映机构资金参与度的极端变化。
- name: LLM_Factor33
  expression: IF(GT(TS_ARGMIN(LOW, 10), TS_ARGMAX(HIGH, 10)), 1, -1) * (CLOSE / TS_MEAN(CLOSE,
    10) - 1)
  explanation: 该因子结合近期高低点出现时序与价格偏离度，捕捉趋势延续或反转的信号。
- name: LLM_Factor34
  expression: DECAY_LINEAR(IF(GT(TS_MAX(CLOSE, 5), DELAY(CLOSE, 5)), (HIGH - LOW)
    / CLOSE, (LOW - HIGH) / CLOSE), 10)
  explanation: 基于近期价格是否创新高/新低，动态调整波动率方向，捕捉突破或反转信号。
- name: LLM_Factor35
  expression: TS_QUANTILE(VOLUME, 20, 0.75) / TS_QUANTILE(VOLUME, 20, 0.25)
  explanation: 成交量分布的分位数比值，反映交易活跃度的稳定性和极端值影响。
- name: LLM_Factor36
  expression: CORREL(RANK(HIGH - LOW), RANK(TS_MEAN(AMOUNT, 10)), 8)
  explanation: 分析振幅排名与成交额排名间的滚动相关性，捕捉价量分布结构的一致性变化。
- name: LLM_Factor37
  expression: TS_LINEAR_REGRESSION_RESI(HIGH - LOW, 15, VWAP) / TS_MEAN(VOLUME, 15)
  explanation: 衡量日内波动相对VWAP的异常残差并以成交量标准化，识别非理性波动中的定价偏差。
- name: LLM_Factor38
  expression: RANK(DECAY_LINEAR((VWAP - TS_MEAN(CLOSE, 10)) / (TS_STDDEV(CLOSE, 10)
    + 1e-12), 5))
  explanation: 该因子衡量VWAP相对短期均线的标准化偏离，并随时间衰减加权，反映机构成本与市场均值的动态偏离及均值回归压力。
- name: LLM_Factor39
  expression: DECAY_LINEAR(TS_QUANTILE(AMOUNT, 15, 0.9) / TS_QUANTILE(AMOUNT, 15,
    0.1), 8)
  explanation: 该因子通过金额分布极端值的比值衰减，衡量资金分布不均匀性的持续性，识别资金集中度稳定的个股。
- name: LLM_Factor40
  expression: (TS_SUM(ABS(CLOSE - TS_MEAN(CLOSE, 10)), 15) / (TS_SUM(ABS(CLOSE - DELAY(CLOSE,
    1)), 15) + 1e-12))
  explanation: 近期累计绝对偏离均值与日内绝对收益的比率，衡量价格均值回归强度相对于噪声波动的显著性。
- name: LLM_Factor41
  expression: (TS_QUANTILE(VOLUME, 15, 0.8) - TS_QUANTILE(VOLUME, 15, 0.2)) / (TS_MEAN(VOLUME,
    15) + 1e-12) * RANK(CLOSE / TS_MEAN(CLOSE, 20) - 1)
  explanation: 该因子将成交量分位距的相对宽度与价格相对位置的秩结合，捕捉成交量分布宽度与价格趋势强度的协同效应，反映流动性广度与价格动量的联动。
- name: LLM_Factor42
  expression: IF(GT(CORREL(RET, VOLUME, 10), 0), TS_MEAN(RET, 10), TS_STDDEV(RET,
    10))
  explanation: 该因子在量价正相关时取收益均值代表动量，否则取收益波动率代表不确定性，动态选择因子敞口以适应市场状态。
- name: LLM_Factor43
  expression: IF(LT(TS_STDDEV(RET, 5), TS_STDDEV(RET, 20)), CORREL(OPEN, CLOSE, 10),
    CORREL(HIGH, LOW, 10))
  explanation: 该因子在短期波动较低时度量开盘收盘相关性，否则度量高低点相关性，适应不同波动环境下的价格结构特征，反映市场状态的自适应切换能力。