- name: alpha158_sumd10
  expression: ((TS_SUM(MAX((CLOSE - DELAY(CLOSE, 1)), 0), 10) - TS_SUM(MAX((DELAY(CLOSE,
    1) - CLOSE), 0), 10)) / (TS_SUM(ABS((CLOSE - DELAY(CLOSE, 1))), 10) + 1e-12))
  explanation: 衡量近10日上涨与下跌幅度之差占总波动的比例，刻画短期买卖力量对比与价格动量强弱，数值越高代表买盘占优、上涨趋势更强。
- name: alpha158_sumd20
  expression: ((TS_SUM(MAX((CLOSE - DELAY(CLOSE, 1)), 0), 20) - TS_SUM(MAX((DELAY(CLOSE,
    1) - CLOSE), 0), 20)) / (TS_SUM(ABS((CLOSE - DELAY(CLOSE, 1))), 20) + 1e-12))
  explanation: 该因子衡量近20日价格涨跌幅的相对强弱（归一到[-1,1]），反映短期动能与买卖力量平衡，值越高表示买盘占优、上行动能更强。
- name: alpha158_sumd30
  expression: ((TS_SUM(MAX((CLOSE - DELAY(CLOSE, 1)), 0), 30) - TS_SUM(MAX((DELAY(CLOSE,
    1) - CLOSE), 0), 30)) / (TS_SUM(ABS((CLOSE - DELAY(CLOSE, 1))), 30) + 1e-12))
  explanation: 该因子以近30日上涨与下跌幅度的净占比（归一化RSI）刻画短期价格动量与买卖力量不对称，值越高说明买压更强、上涨延续的可能性更大。
- name: alpha158_sumd60
  expression: ((TS_SUM(MAX((CLOSE - DELAY(CLOSE, 1)), 0), 60) - TS_SUM(MAX((DELAY(CLOSE,
    1) - CLOSE), 0), 60)) / (TS_SUM(ABS((CLOSE - DELAY(CLOSE, 1))), 60) + 1e-12))
  explanation: 该因子通过比较近60日累计上涨与下跌幅度之差占总波动的比重来刻画净买卖压力与趋势强度，数值越高代表买方占优、上行趋势更强，越低则卖方占优。
- name: alpha158_vma5
  expression: (TS_MEAN(VOLUME, 5) / (VOLUME + 1e-12))
  explanation: 该因子刻画当前成交量相对近5日平均成交量的偏离程度，值大于1表示量缩（当前低于均量）、小于1表示放量，反映短期流动性与市场关注度变化。
- name: alpha158_vma10
  expression: (TS_MEAN(VOLUME, 10) / (VOLUME + 1e-12))
  explanation: 该因子以近10日成交量均值除以当日成交量来衡量相对交易活跃度与流动性，值越低表示当日放量（信息到达/关注度提升、潜在流动性冲击），值越高表示缩量（关注度下降、流动性偏弱）。
- name: alpha158_vma20
  expression: (TS_MEAN(VOLUME, 20) / (VOLUME + 1e-12))
  explanation: 该因子刻画当前成交量相对20日均量的偏离程度，值越大表示当前量低于常态、流动性偏弱，值越小表示放量、市场关注与潜在价格冲击上升。
- name: alpha158_vma30
  expression: (TS_MEAN(VOLUME, 30) / (VOLUME + 1e-12))
  explanation: 该因子以近30日成交量均值与当日成交量之比刻画当前交易活跃度的异常程度，值越低表示放量（信息到达、关注度上升、流动性增强），值越高表示缩量（关注度下降、流动性偏弱）。
- name: alpha158_vma60
  expression: (TS_MEAN(VOLUME, 60) / (VOLUME + 1e-12))
  explanation: 该因子以60日均量除以当日成交量，刻画相对成交活跃度与流动性：值越大表示当前缩量、关注度偏低，值越小表示放量、资金关注度提升或信息冲击更强。
- name: alpha158_vstd5
  expression: (TS_STDDEV(VOLUME, 5) / (VOLUME + 1e-12))
  explanation: 该因子衡量近5日成交量相对当前水平的波动性，数值越大表示交易活跃度与流动性更不稳定、资金进出波动更大。
- name: alpha158_vstd10
  expression: (TS_STDDEV(VOLUME, 10) / (VOLUME + 1e-12))
  explanation: 该因子衡量近10日成交量相对当前成交量的波动幅度，数值越大表示交易活跃度更不稳定、潜在流动性冲击风险更高。
- name: alpha158_vstd20
  expression: (TS_STDDEV(VOLUME, 20) / (VOLUME + 1e-12))
  explanation: 衡量近20日成交量波动相对于当日成交量的强度，反映流动性稳定性与交易参与不确定性，数值越大表示近期量能起伏大而当日量能偏弱、流动性风险更高。
- name: alpha158_vstd30
  expression: (TS_STDDEV(VOLUME, 30) / (VOLUME + 1e-12))
  explanation: 衡量近30日成交量相对当前成交量的波动强度，数值越高意味着流动性更不稳定、资金关注度起伏大及潜在交易成本与信息冲击风险更高。
- name: alpha158_vstd60
  expression: (TS_STDDEV(VOLUME, 60) / (VOLUME + 1e-12))
  explanation: 该因子衡量过去60期成交量波动性相对于当期成交量的比例，数值越大意味着当期成交量相对其历史波动偏低、流动性更不稳定且潜在价格冲击风险更高。
- name: alpha158_wvma5
  expression: (TS_STDDEV((ABS(((CLOSE / DELAY(CLOSE, 1)) - 1)) * VOLUME), 5) / (TS_MEAN((ABS(((CLOSE
    / DELAY(CLOSE, 1)) - 1)) * VOLUME), 5) + 1e-12))
  explanation: 该因子以近5日“绝对收益×成交量”的标准差与均值之比刻画交易活跃度与价格冲击的相对不稳定性（变异系数），值越大表示短期交易压力更剧烈、流动性更脆弱、风险更高。
- name: alpha158_wvma10
  expression: (TS_STDDEV((ABS(((CLOSE / DELAY(CLOSE, 1)) - 1)) * VOLUME), 10) / (TS_MEAN((ABS(((CLOSE
    / DELAY(CLOSE, 1)) - 1)) * VOLUME), 10) + 1e-12))
  explanation: 该因子是10日内“绝对收益×成交量”的变异系数，刻画由价格变动引致的交易活跃度与流动性需求的相对不稳定性，高值意味着成交与波动更具突发性、情绪更不稳。
- name: alpha158_wvma20
  expression: (TS_STDDEV((ABS(((CLOSE / DELAY(CLOSE, 1)) - 1)) * VOLUME), 20) / (TS_MEAN((ABS(((CLOSE
    / DELAY(CLOSE, 1)) - 1)) * VOLUME), 20) + 1e-12))
  explanation: 该因子衡量过去20日“绝对收益×成交量”的变异系数，刻画量价冲击强度的相对不稳定性，数值越高意味着流动性与波动更易骤变。
- name: alpha158_wvma30
  expression: (TS_STDDEV((ABS(((CLOSE / DELAY(CLOSE, 1)) - 1)) * VOLUME), 30) / (TS_MEAN((ABS(((CLOSE
    / DELAY(CLOSE, 1)) - 1)) * VOLUME), 30) + 1e-12))
  explanation: 该因子是过去30日“|收益|×成交量”的变动系数，衡量流动性调整后的价格波动稳定性，值越大表示交易冲击更不均衡、市场情绪与流动性波动更剧烈。
- name: alpha158_wvma60
  expression: (TS_STDDEV((ABS(((CLOSE / DELAY(CLOSE, 1)) - 1)) * VOLUME), 60) / (TS_MEAN((ABS(((CLOSE
    / DELAY(CLOSE, 1)) - 1)) * VOLUME), 60) + 1e-12))
  explanation: 该因子衡量过去60日“绝对收益×成交量”的波动系数，反映价格变动强度与交易活跃度耦合的稳定性，数值越高意味着交易冲击更剧烈、市场不确定性与流动性风险更高。
- name: alpha158_vsump5
  expression: (TS_SUM(MAX((VOLUME - DELAY(VOLUME, 1)), 0), 5) / (TS_SUM(ABS((VOLUME
    - DELAY(VOLUME, 1))), 5) + 1e-12))
  explanation: 衡量过去5个交易日里成交量上升变动在总变动中的占比，以刻画交易活跃度的上行趋势强弱，数值越大通常意味着市场参与度与买兴增强、风险偏好回升。
- name: alpha158_vsump10
  expression: (TS_SUM(MAX((VOLUME - DELAY(VOLUME, 1)), 0), 10) / (TS_SUM(ABS((VOLUME
    - DELAY(VOLUME, 1))), 10) + 1e-12))
  explanation: 该因子衡量过去10日成交量变化的上行占比（成交量增加的累计幅度占总变动的比重），值越高表示市场参与度与流动性持续扩张、交易活跃度增强，值越低则反映收缩。
- name: alpha158_vsump20
  expression: (TS_SUM(MAX((VOLUME - DELAY(VOLUME, 1)), 0), 20) / (TS_SUM(ABS((VOLUME
    - DELAY(VOLUME, 1))), 20) + 1e-12))
  explanation: 刻画过去20日成交量变化中正向增量占比的强弱，数值越高说明成交量更常上升、投资者关注度与流动性呈持续增强。
- name: alpha158_vsump30
  expression: (TS_SUM(MAX((VOLUME - DELAY(VOLUME, 1)), 0), 30) / (TS_SUM(ABS((VOLUME
    - DELAY(VOLUME, 1))), 30) + 1e-12))
  explanation: 该因子衡量过去30日成交量日度变动中“上升”部分占总变动的比例，值越高说明成交量更偏向上行、市场关注度与资金活跃度提升，值越低则反映热度与流动性走弱。
- name: alpha158_vsump60
  expression: (TS_SUM(MAX((VOLUME - DELAY(VOLUME, 1)), 0), 60) / (TS_SUM(ABS((VOLUME
    - DELAY(VOLUME, 1))), 60) + 1e-12))
  explanation: 该因子度量近60日成交量变动中“增加”的占比，反映交易活跃度与流动性扩张的持续性，数值越高通常意味着市场关注与资金参与增强、情绪偏多并可能支持后续动量。
- name: alpha158_vsumn5
  expression: (TS_SUM(MAX((DELAY(VOLUME, 1) - VOLUME), 0), 5) / (TS_SUM(ABS((VOLUME
    - DELAY(VOLUME, 1))), 5) + 1e-12))
  explanation: 该因子衡量近5日成交量变动中由下降部分的占比，数值越高意味着成交活跃度持续走弱、市场交易意愿与流动性趋于收缩。
- name: alpha158_vsumn10
  expression: (TS_SUM(MAX((DELAY(VOLUME, 1) - VOLUME), 0), 10) / (TS_SUM(ABS((VOLUME
    - DELAY(VOLUME, 1))), 10) + 1e-12))
  explanation: 该因子衡量近10日成交量变动中由“缩量”贡献的比例，值越高表明交投活跃度持续走弱、投资者参与意愿下降，可能预示情绪趋谨慎与动能衰减。
- name: alpha158_vsumn20
  expression: (TS_SUM(MAX((DELAY(VOLUME, 1) - VOLUME), 0), 20) / (TS_SUM(ABS((VOLUME
    - DELAY(VOLUME, 1))), 20) + 1e-12))
  explanation: 该因子衡量近20日成交量变动中“缩量”的相对占比，数值越高意味着成交量持续收缩、市场流动性与风险偏好走弱。
- name: alpha158_vsumn30
  expression: (TS_SUM(MAX((DELAY(VOLUME, 1) - VOLUME), 0), 30) / (TS_SUM(ABS((VOLUME
    - DELAY(VOLUME, 1))), 30) + 1e-12))
  explanation: 该因子衡量过去30日成交量日度变化中“下降”部分的占比，比例越高表明成交量持续缩减、流动性与参与度走弱，越低则显示量能扩张。
- name: alpha158_vsumn60
  expression: (TS_SUM(MAX((DELAY(VOLUME, 1) - VOLUME), 0), 60) / (TS_SUM(ABS((VOLUME
    - DELAY(VOLUME, 1))), 60) + 1e-12))
  explanation: 该因子衡量过去60日成交量变动中由下降贡献的比例，数值越高说明成交量更常或更大幅度地收缩、交易兴趣与流动性走弱，越低则反映成交量扩张与风险偏好改善。
- name: alpha158_vsumd5
  expression: ((TS_SUM(MAX((VOLUME - DELAY(VOLUME, 1)), 0), 5) - TS_SUM(MAX((DELAY(VOLUME,
    1) - VOLUME), 0), 5)) / (TS_SUM(ABS((VOLUME - DELAY(VOLUME, 1))), 5) + 1e-12))
  explanation: 该因子通过比较近5日成交量上升与下降的归一化差额来刻画市场参与热度的动量强弱，值高代表量能持续放大、资金关注度提升，值低则量能走弱、关注度下降。
- name: alpha158_vsumd10
  expression: ((TS_SUM(MAX((VOLUME - DELAY(VOLUME, 1)), 0), 10) - TS_SUM(MAX((DELAY(VOLUME,
    1) - VOLUME), 0), 10)) / (TS_SUM(ABS((VOLUME - DELAY(VOLUME, 1))), 10) + 1e-12))
  explanation: 该因子衡量过去10日成交量变化的方向性与强度（类似成交量的RSI），反映市场参与度与资金关注度的趋势动量，值越高表示成交量持续放大、流动性增强。
- name: alpha158_vsumd20
  expression: ((TS_SUM(MAX((VOLUME - DELAY(VOLUME, 1)), 0), 20) - TS_SUM(MAX((DELAY(VOLUME,
    1) - VOLUME), 0), 20)) / (TS_SUM(ABS((VOLUME - DELAY(VOLUME, 1))), 20) + 1e-12))
  explanation: 该因子衡量近20日成交量上升与下降的净占比，反映市场参与度与流动性的持续性变化，值越高表示资金关注与交易活跃度持续增强、需求累积，值越低则相反。
- name: alpha158_vsumd30
  expression: ((TS_SUM(MAX((VOLUME - DELAY(VOLUME, 1)), 0), 30) - TS_SUM(MAX((DELAY(VOLUME,
    1) - VOLUME), 0), 30)) / (TS_SUM(ABS((VOLUME - DELAY(VOLUME, 1))), 30) + 1e-12))
  explanation: 该因子衡量近30日成交量正向与负向变动的归一化净值，高值表示成交量持续放大、市场参与度与流动性增强，低值则表示成交量走弱、关注度下降。
- name: alpha158_vsumd60
  expression: ((TS_SUM(MAX((VOLUME - DELAY(VOLUME, 1)), 0), 60) - TS_SUM(MAX((DELAY(VOLUME,
    1) - VOLUME), 0), 60)) / (TS_SUM(ABS((VOLUME - DELAY(VOLUME, 1))), 60) + 1e-12))
  explanation: 该因子衡量近60日成交量变动的方向性强度（净增量相对总变动），数值越高表示成交量持续上升、市场关注与流动性增强，越低则代表兴趣减弱与流动性走弱。
- name: LLM_Factor302
  expression: TS_RANK(DECAY_LINEAR(((CLOSE - VWAP) / (HIGH - LOW + 1e-12)), 12), 20)
  explanation: 收盘价相对于日内均价与当日波幅的比值进行线性衰减，再取时序排名，反映价格偏离的持续模式。
- name: LLM_Factor455
  expression: (TS_MEAN(IF(LT(ABS(((CLOSE / DELAY(CLOSE, 1)) - 1)), TS_STDDEV(((CLOSE
    / DELAY(CLOSE, 1)) - 1), 10)), 1, 0), 20) * RANK((VWAP - CLOSE)))
  explanation: 结合日内价格收敛幅度与横盘信号，识别非剧烈波动期间的潜在价值偏离与反转机会。
- name: LLM_Factor521
  expression: TS_MEAN(IF(LT(TS_STDDEV((HIGH - LOW) / CLOSE, 10), TS_MEAN((HIGH - LOW)
    / CLOSE, 30)), RANK(VWAP), RANK(CLOSE)), 12)
  explanation: 该因子基于日内相对波动率的稳定性动态选择 VWAP 或收盘价的截面秩并进行平均，旨在权衡波动收敛时的均价代表性与波动放大时的价格绝对位置。
- name: LLM_Factor531
  expression: TS_SUM(IF(LT(HIGH - LOW, TS_MEAN(HIGH - LOW, 20)), AMOUNT, 0), 20) /
    TS_SUM(AMOUNT, 20)
  explanation: 在振幅低于历史均值的日子成交额占比，衡量窄幅波动期间资金投入的集中度所暗示的潜在突破强度。
- name: LLM_Factor754
  expression: TS_MEAN(IF(LT(ABS(RET), TS_STDDEV(RET, 30)), HIGH - LOW, 0), 15) / TS_MEAN(HIGH
    - LOW, 15)
  explanation: 计算波动率未异常放大日内的平均振幅占比，衡量在稳定期间价格运动的真实宽度。
- name: LLM_Factor425
  expression: (TS_MIN(LOW, 5) - TS_MEAN(VWAP, 20)) / TS_STDDEV(VWAP, 30)
  explanation: 捕捉短期价格低点相对于长期成交量加权均价中枢的下偏离程度，标准化后衡量恐慌性错杀带来的超跌反弹机会。
- name: LLM_Factor592
  expression: TS_MEAN(CORREL(TS_ARGMIN(LOW, 10), TS_ARGMIN(VOLUME, 10), 5), 10)
  explanation: 该因子计算最低价出现时点与成交量最低点出现时点的滚动相关性,反映价格低位与流动性收缩的同步性,用以刻画‘恐慌性抛售’或‘无量阴跌’的不同市场状态。
- name: LLM_Factor772
  expression: RANK(DELAY(AMOUNT, 1)) - RANK(DELAY(VOLUME, 1) * CLOSE)
  explanation: 对比昨日成交额排名与估算成交额排名，捕捉实际资金流与预期资金流的截面差异。
- name: LLM_Factor807
  expression: RANK(DECAY_LINEAR(MAX(CLOSE - VWAP, 0), 10) / (TS_STDDEV(CLOSE, 10)
    + 1e-12))
  explanation: 排序价格与均价正偏离经波动率调整后的加权累积，反映多方力量在风险调整下的相对强度。
- name: LLM_Factor811
  expression: (TS_MAX(AMOUNT, 20) - TS_MIN(AMOUNT, 20)) / TS_MEAN(VOLUME, 20)
  explanation: 成交金额极差相对于平均成交量的标准化，衡量资金流强度的极端变化与潜在的市场情绪转折点。
- name: LLM_Factor843
  expression: (TS_MAX(HIGH, 10) - TS_MEAN(CLOSE, 10)) / (TS_MEAN(CLOSE, 10) - TS_MIN(LOW,
    10))
  explanation: 该因子计算过去10日内最高价高于均值的幅度与均值低于最低价幅度的比率，旨在不对称地衡量上涨潜力和下跌风险的压力对比。
- name: LLM_Factor856
  expression: CORREL(RANK(TS_MAX(CLOSE, 5) - CLOSE), RANK(VOLUME / TS_MEAN(VOLUME,
    20)), 15)
  explanation: 衡量股价短期高点阻力强度与相对成交量变化的截面相关性，捕捉放量遇阻或缩量突破的市场微观结构信息。
- name: LLM_Factor872
  expression: IF(LT(CORREL(CLOSE, VOLUME, 10), -0.2), TS_MIN(LOW, 10) / HIGH, TS_MAX(HIGH,
    10) / LOW)
  explanation: 基于负相关市场设定震荡区间的上下边界比率，捕捉量价背离状态下的极限转折点价格行为。
- name: LLM_Factor877
  expression: TS_MEAN(IF(LT(CORREL(RET, VOLUME, 5), 0), ABS(RET) * (HIGH - LOW), 0),
    15) / TS_MEAN(HIGH - LOW, 15)
  explanation: 捕捉价格与成交量负相关阶段的异常波动强度，并相对于基准波动归一，挖掘市场在分化期的定价错位。
- name: LLM_Factor903
  expression: (TS_MEAN(IF(LT((HIGH-LOW), TS_QUANTILE(HIGH-LOW, 20, 0.4)), (CLOSE -
    (HIGH+LOW)/2)/(HIGH-LOW+1e-12), 0), 10) - TS_MEAN(IF(GE((HIGH-LOW), TS_QUANTILE(HIGH-LOW,
    20, 0.6)), (CLOSE - (HIGH+LOW)/2)/(HIGH-LOW+1e-12), 0), 10)) * RANK(VOLUME)
  explanation: 该因子计算窄幅波动日内收盘价相对区间中点的位置均值与宽幅波动日内相应位置的均值之差，并用成交量排序加权，捕捉不同波动状态下价格中心粘性的差异。
- name: LLM_Factor1004
  expression: RANK(TS_SUM(IF(LT(HIGH - LOW, TS_MEAN(HIGH - LOW, 10)), AMOUNT, 0),
    15)) - RANK(TS_SUM(AMOUNT, 15))
  explanation: 识别在窄幅波动期间发生的成交金额占比，反映缩量整理后的潜在突破方向。
- name: LLM_Factor1027
  expression: DECAY_LINEAR(IF(LT(TS_MEAN(VOLUME, 10), VOLUME), (HIGH - LOW) / CLOSE,
    0), 8)
  explanation: 度量仅在放量日出现的大幅日内价格波动，并通过线性衰减赋予最近波动更高权重，反映短期资金推动下的价格动量。
- name: LLM_Factor1043
  expression: RANK(DECAY_LINEAR(IF(LT(VWAP, TS_MEAN(VWAP, 20)), AMOUNT, 0), 15))
  explanation: 对价格低于其20日均价时的成交额进行近期加权累积并做截面排序，反映在价格相对弱势区间内资金主动承接的强度，捕捉逢低布局的信号。
- name: LLM_Factor1075
  expression: TS_MEAN(IF(GT(ABS(RET), TS_STDDEV(RET, 20)), (HIGH - LOW) / CLOSE, 0),
    15)
  explanation: 在收益率异常波动日，捕捉其真实波幅的相对大小，衡量极端波动事件中价格的实际摆动幅度。
- name: LLM_Factor1077
  expression: (TS_MAX(AMOUNT, 30) - TS_MIN(AMOUNT, 30)) / TS_MEAN(AMOUNT, 30)
  explanation: 过去30日内成交金额的极差相对于其均值的比例，衡量资金流动的极端性，值高预示资金流入流出剧烈。
- name: LLM_Factor1126
  expression: TS_LINEAR_REGRESSION_RESI(RANK((CLOSE - TS_MIN(LOW, 10)) / (TS_MAX(HIGH,
    10) - TS_MIN(LOW, 10))), 15) - TS_STDDEV(AMOUNT / (VOLUME + 1e-07), 20)
  explanation: 对价格相对位置排名进行趋势残差调整，并减去均价波动率，识别潜在价格中枢收敛时的估值修复机会。
- name: LLM_Factor1225
  expression: REPLACE_NAN_INF(CORREL(TS_MAX(CLOSE, 10) - TS_MIN(LOW, 10), (VOLUME
    / TS_MEAN(VOLUME, 10)), 20), 0)
  explanation: 度量近期价格区间宽度与成交活跃度变化的相关性，反映价格突破与资金跟随的共同性强弱。
- name: LLM_Factor1230
  expression: (TS_MAX(VWAP, 10) - TS_MEAN(VWAP, 10)) / (TS_STDDEV(AMOUNT, 10) + 1e-7)
  explanation: 衡量日内成交加权价格高点相对于其均值的偏离，并除以成交金额波动，刻画资金集中度的极端性与可适性。
- name: LLM_Factor1253
  expression: TS_MEAN(IF(LT(ABS((CLOSE - DELAY(CLOSE, 1)) / DELAY(CLOSE, 1)), TS_MEAN(ABS(RET),
    30)), 1, 0), 20) * RANK(VWAP - TS_MIN(LOW, 5))
  explanation: 低波动期间的VWAP与近期底部距离，识别安全边际下的价值回归动力。
- name: LLM_Factor1258
  expression: SIGN(CORREL(TS_RANK(OPEN, 20), TS_RANK(VOLUME, 20), 10)) * TS_STDDEV(CLOSE
    / DELAY(CLOSE, 1) - 1, 10)
  explanation: 开盘价与成交量排序相关性符号乘以收益波动率，结合市场结构与波动择时。
- name: LLM_Factor1260
  expression: RANK(TS_SUM(IF(LT(AMOUNT, TS_MEAN(AMOUNT, 20)), HIGH - LOW, 0), 15))
  explanation: 小成交额日振幅的截面排序，反映非流动性冲击下的价格弹性差异。
- name: LLM_Factor1281
  expression: IF(GT(TS_ARGMIN(LOW, 10), TS_ARGMIN(VOLUME, 10)), TS_MEAN(AMOUNT, 10),
    TS_MEAN(CLOSE, 10)) / TS_STDDEV(VWAP, 20)
  explanation: 判断价格低点出现是否晚于成交量低点，若是则采用近期平均成交金额，反之用近期平均价格，并除以价格波动以区分驱动类型。
- name: LLM_Factor1323
  expression: CORREL(TS_ARGMIN(IF(LT(VWAP, CLOSE), LOW, HIGH), 10), TS_ARGMIN(VOLUME,
    10), 8) / 8
  explanation: 该因子计算价格低于/高于均价时的支撑/阻力位出现时间与成交量谷底出现时间的滚动相关性，衡量价量底部共振的时序同步性。
- name: LLM_Factor1330
  expression: SCALE(TS_MEAN(IF(LT(ABS(RET), TS_STDDEV(RET, 25)), HIGH - LOW, 0), 20)
    - TS_MEAN(IF(GT(ABS(RET), TS_STDDEV(RET, 25)), HIGH - LOW, 0), 20))
  explanation: 衡量正常波动日内与异常波动日内的平均振幅差异，反映价格稳定及冲击环境下市场流动性供给与交易深度的区别。
- name: LLM_Factor1407
  expression: (TS_MAX(HIGH - LOW, 15) - (HIGH - LOW)) / (TS_STDDEV(HIGH - LOW, 15)
    + 1e-12)
  explanation: 度量当前日波动幅度在近期波动极值中所处位置，及其在波动区间内的相对偏离度，用于识别波动率均值回归的潜在线索。
- name: LLM_Factor1421
  expression: (TS_ARGMAX(VOLUME, 30) - TS_ARGMIN(VWAP, 30)) / 30
  explanation: 该因子计算过去30个交易日成交量峰值与成交均价(VWAP)低谷出现的时间差，刻画市场流动性高位与价格低位之间的时间错配。
- name: LLM_Factor1423
  expression: TS_SUM(IF(LT(ABS(CLOSE - TS_MEAN(CLOSE, 20)), TS_STDDEV(CLOSE, 20)),
    AMOUNT, 0), 25) / TS_SUM(AMOUNT, 25)
  explanation: 该因子衡量在价格未明显偏离其长期均值的“正常”区间内所发生的累计成交金额占比，反映市场在价值中枢附近的交易活跃度与共识程度。
- name: LLM_Factor1451
  expression: TS_SUM(IF(LT((CLOSE - VWAP) / VWAP, TS_MEAN((CLOSE - VWAP) / VWAP, 10)),
    ABS(RET), 0), 15)
  explanation: 累计在股价低于近期平均VWAP偏离时的绝对值收益，捕捉弱势偏离期间的波动积聚，可能预示底部反转能量。
- name: LLM_Factor1456
  expression: (TS_QUANTILE(AMOUNT, 20, 0.75) - TS_QUANTILE(AMOUNT, 20, 0.25)) / TS_MEAN(VOLUME,
    20)
  explanation: 衡量成交金额在20日窗口内的四分位距相对于平均成交量的比值，刻画资金流分布的离散程度与流动性宽度的相对关系。
- name: LLM_Factor1498
  expression: CORREL(TS_RANK(CLOSE, 8), TS_RANK(HIGH - LOW, 8), 8)
  explanation: 价格排名与日内波幅排名的相关性，识别价格与波动同步性的短期变化。
- name: LLM_Factor1596
  expression: TS_STDDEV(CORREL(OPEN - LOW, HIGH - CLOSE, 10), 20)
  explanation: 开盘下探与收盘上冲相关性的波动率，捕捉日内多空博弈模式的稳定性，高波动预示情绪转变或信息不对称加剧。
- name: LLM_Factor1700
  expression: SIGN(TS_MAX(CLOSE, 10) - TS_MIN(CLOSE, 10)) * TS_RANK(ABS(AMOUNT - DELAY(AMOUNT,
    5)), 20)
  explanation: 结合近期价格方向与成交金额变化的绝对幅度排序，识别资金流在趋势形成初期的加速介入行为。
- name: LLM_Factor1760
  expression: TS_SUM(IF(LT(ABS(RET), TS_STDDEV(RET, 15)), VWAP - LOW, HIGH - VWAP),
    25) / TS_SUM(HIGH - LOW, 25)
  explanation: 在波动正常期间，统计VWAP相对于当日价格区间的非对称位置，反映价值中枢在常态下是更贴近支撑还是阻力区域。
- name: LLM_Factor1788
  expression: (TS_QUANTILE(HIGH - OPEN, 20, 0.8) - TS_QUANTILE(OPEN - LOW, 20, 0.2))
    / (TS_MEAN(HIGH - LOW, 20) + 1e-12)
  explanation: 通过比较过去20日“开盘后上冲幅度”的80%分位点与“开盘下探幅度”的20%分位点之差，并除以平均振幅，量化多头潜在爆发力相对于空头抵抗力的结构性优势。
- name: LLM_Factor1837
  expression: DECAY_LINEAR(IF(GT((CLOSE - OPEN) / (HIGH - LOW + 1e-12), 0.5), RET,
    -RET), 8)
  explanation: 对日内趋势效率（净变动占区间比例）较高的交易日，赋予正向收益率衰减权重；反之赋予负向衰减权重，累计捕捉高效率交易日带来的持续动量或反转效应。
- name: LLM_Factor1984
  expression: DECAY_LINEAR(IF(LT(CORREL(VOLUME, RET, 5), -0.1), (HIGH+CLOSE)/2 - LOW,
    CLOSE - (LOW+OPEN)/2), 8)
  explanation: 根据量价短期负相关性，选择性加权不同价格基准下的潜在盈利空间，进行线性衰减平滑。
- name: LLM_Factor2006
  expression: TS_QUANTILE(IF(LT(CLOSE, VWAP), HIGH - OPEN, OPEN - LOW), 20, 0.7) /
    (TS_MEAN(HIGH - LOW, 20) + 1e-12)
  explanation: 在收盘低于VWAP时取上影线、高于时取下影线的70分位数，相对平均振幅的比例，衡量关键价格位置附近的受阻/支撑强度。
- name: LLM_Factor2031
  expression: (TS_QUANTILE(VOLUME * SIGN(CLOSE - OPEN), 25, 0.7) - TS_MEAN(VOLUME
    * SIGN(CLOSE - OPEN), 25)) / (TS_STDDEV(VOLUME, 25) + 1e-12)
  explanation: 量化带方向成交量的高位分位数与均值的偏离程度，用成交量波动率标准化，识别极端情绪下单边资金流入的异常强度。
- name: LLM_Factor2105
  expression: (TS_QUANTILE(VWAP * VOLUME, 30, 0.8) - TS_QUANTILE(VWAP, 30, 0.2)) /
    TS_MEAN(AMOUNT, 30)
  explanation: 该因子使用成交额加权VWAP的高分位数与VWAP低分位数的差值，用平均成交额标准化，衡量高成交价格区与平均价格区的溢价水平。
- name: LLM_Factor2145
  expression: (TS_MEAN(CORREL(TS_SUM(ABS(RET), 5), VOLUME, 8), 10) - RANK(VOLUME))
    / TS_STDDEV(CLOSE, 20)
  explanation: 比较近期波动率与成交量的相关性均值与全市场成交量排名的差异，并除以价格波动进行标准化，捕捉交易活跃度与波动关系的异常。
- name: LLM_Factor2175
  expression: (RANK(TS_MEAN(VWAP, 5)) - RANK(TS_MEAN(CLOSE, 5))) / (TS_STDDEV(CLOSE,
    10) + 1e-12)
  explanation: 比较短期均价与收盘价的截面相对位置，并用价格波动标准化，反映市场在均价附近累积的单边驱动强度。
- name: LLM_Factor2200
  expression: (TS_MEAN(CORREL(TS_SUM(IF(GT((CLOSE - VWAP) / VWAP, 0.01), AMOUNT, 0),
    3), TS_SUM(IF(LT((VWAP - CLOSE) / VWAP, -0.01), AMOUNT, 0), 3), 10) * 2, 15) -
    RANK(TS_MEAN(VOLUME, 20))) / (TS_STDDEV(VOLUME, 10) + 0.001)
  explanation: 该因子利用高低价收盘价与VWAP偏离时对应的买卖资金流的短期相关性，探测多空力量同步增强现象的强度，并结合成交量的截面与波动性进行标准化。
- name: LLM_Factor2430
  expression: (TS_QUANTILE(HIGH - OPEN, 30, 0.9) - TS_QUANTILE(OPEN - LOW, 30, 0.1))
    / (TS_MEAN(HIGH - LOW, 30) + 1e-12)
  explanation: 度量开盘后价格向上异动极值强于向下异动极值的非对称性，捕捉早盘突破强度与随后的动量延续。
- name: LLM_Factor2522
  expression: SIGN(TS_MAX(OPEN / DELAY(CLOSE, 1) - 1, 20)) * TS_RANK(ABS(VOLUME -
    TS_QUANTILE(VOLUME, 30, 0.5)), 20)
  explanation: 结合过去20日隔夜收益最大值的符号与成交量偏离中位数的绝对幅度排序，识别隔夜缺口方向与异常成交量配合下的短期动量延续概率。
- name: LLM_Factor2784
  expression: (TS_SUM(IF(AND(LT(CORREL(CLOSE, OPEN, 10), -0.1), GT(ABS(OPEN - CLOSE),
    TS_MEAN(HIGH - LOW, 10))), VOLUME, 0), 20) - TS_SUM(IF(AND(GT(CORREL(CLOSE, OPEN,
    10), 0.1), GT(ABS(OPEN - CLOSE), TS_MEAN(HIGH - LOW, 10))), VOLUME, 0), 20)) /
    (TS_MEAN(VOLUME, 20) + 1e-12)
  explanation: 该因子分别累积在开盘收盘负相关且价差超过区间均值（震荡分歧）时的成交量，以及正相关且价差超过区间均值（趋势确认）时的成交量，求差值后标准化，捕捉不同市场状态（分歧vs趋势）下异常价差伴随的成交量差异，反映资金行为的异质性。
- name: LLM_Factor2872
  expression: REPLACE_NAN_INF(TS_QUANTILE(ABS(TS_SUM(RET, 3)) / (TS_STDDEV(RET, 10)
    + 1e-12), 20, 0.8) - TS_QUANTILE(VOLUME / (TS_MEAN(VOLUME, 20) + 1e-12), 20, 0.2),
    0)
  explanation: 衡量短期累积收益波动率调整后的强势分位数与成交量相对弱势分位数的差值，捕捉高波动收益与低流动性状态的背离。
- name: LLM_Factor2879
  expression: (RANK(DECAY_LINEAR(MAX(VWAP - LOW, 0), 12)) - RANK(DECAY_LINEAR(MAX(HIGH
    - VWAP, 0), 12))) / (TS_STDDEV(CLOSE, 15) + 1e-12)
  explanation: 对比VWAP相对下轨优势与上轨劣势的线性衰减排名差异，并标准化，捕捉以VWAP为轴心的多空支撑阻力非对称结构。
- name: LLM_Factor2886
  expression: (RANK(TS_SUM(IF(LT(CLOSE, TS_MEAN(VWAP, 10)), VOLUME, 0), 15)) - RANK(TS_SUM(IF(GT(CLOSE,
    TS_MEAN(VWAP, 10)), VOLUME, 0), 15))) / (TS_STDDEV(VOLUME, 20) + 1e-12)
  explanation: 比较股价低于与高于VWAP期间的累计成交量排名差异，并通过成交量波动标准化，捕捉资金在均价下方的积累相对于上方积累的相对强度。
- name: LLM_Factor2893
  expression: CORREL(RANK(TS_STDDEV(OPEN, 10)), RANK(TS_MEAN(ABS(CLOSE - OPEN) / (HIGH
    - LOW + 1e-12), 10)), 20)
  explanation: 衡量开盘价波动率的排名与日内价格效率（收盘开盘差占区间比例）均值的排名之间的相关性，反映开盘不确定性对后续交易日价格发现效率的预测关系。
- name: LLM_Factor2895
  expression: (RANK(TS_MAX(HIGH - LOW, 5)) * RANK(TS_MEAN(VOLUME, 10))) / (TS_STDDEV(CLOSE,
    20) + 1e-12) - RANK(DELAY(AMOUNT / (VOLUME + 1e-07) - CLOSE, 3))
  explanation: 将价格区间极值与成交量均值的排名乘积用价格波动标准化，再减去VWAP与收盘价价差的滞后排名，衡量波动与成交量的联合强度相对于历史均价偏离的调整。
- name: LLM_Factor2913
  expression: DECAY_LINEAR(IF(LT(CORREL(DELAY(CLOSE, 1), VOLUME, 10), 0), ABS(RET),
    -ABS(RET)), 6)
  explanation: 对价量负相关的时期赋予正衰减的绝对收益动量，反之则赋予负衰减动量，旨在捕捉流动性错配驱动的价格惯性。
- name: LLM_Factor2964
  expression: (RANK(TS_SUM(IF(GT(CLOSE, OPEN), VOLUME * (CLOSE - OPEN), 0), 20)) -
    RANK(TS_SUM(IF(LT(CLOSE, OPEN), VOLUME * (OPEN - CLOSE), 0), 20)))
  explanation: 对比上涨日和下跌日经成交量加成的价格变动总量排名，衡量多空力量在时间上的净效应。
- name: LLM_Factor3081
  expression: (RANK(TS_STDDEV(VWAP, 10)) - RANK(TS_MEAN(HIGH - LOW, 10))) / (TS_STDDEV(CLOSE,
    5) + 1e-12)
  explanation: 对比日内均价波动率与价格波幅的相对排名，识别波动结构错配下的潜在趋势转换点。
- name: LLM_Factor3091
  expression: (RANK(TS_MEAN(OPEN / DELAY(CLOSE, 1) - 1, 10)) * RANK(TS_STDDEV(AMOUNT,
    10))) / (ABS(TS_MEAN(RET, 10)) + 1e-12)
  explanation: 结合开盘跳空幅度排名与成交金额波动排名，除以收益均值绝对值，衡量跳空强度与资金波动在收益背景下的复合效应。
- name: LLM_Factor3100
  expression: RANK(TS_MEAN(ABS(TS_ARGMIN(LOW, 5) - TS_ARGMAX(VOLUME, 5)), 10)) / (TS_STDDEV(CLOSE,
    10) + 1e-12)
  explanation: 排名近期低价出现时点与成交量峰值时点绝对差值的滚动均值，并用价格波动率归一化，衡量价格底部与流动性峰值的时序错位程度
- name: LLM_Factor3104
  expression: TS_RANK(TS_SUM(IF(GT(AMOUNT, TS_QUANTILE(AMOUNT, 30, 0.75)), CLOSE -
    LOW, HIGH - CLOSE), 10), 20)
  explanation: 在成交金额处于高位区间时计算收盘相对低点的涨幅，否则计算高点相对收盘的跌幅，对其10日求和进行时间序列排名，捕捉大额成交对价格区间利用效率的影响
- name: LLM_Factor3107
  expression: (RANK(TS_MEAN(IF(AND(LT(CLOSE, TS_MIN(LOW, 10)), GT(VOLUME, TS_MEAN(VOLUME,
    20))), 1, 0), 15)) - RANK(TS_STDDEV(AMOUNT, 15))) / (ABS(TS_MEAN(RET, 20)) + 1e-12)
  explanation: 比较价格触及近期低位且成交量高于长期均量发生频率的排名与成交金额波动率排名，用平均收益率绝对值归一化，捕捉放量破位事件相对于资金波动幅度的相对强度
- name: LLM_Factor3165
  expression: DECAY_LINEAR(RANK(TS_MAX(IF(LE(CLOSE, TS_QUANTILE(CLOSE, 15, 0.25)),
    (OPEN - LOW) / (HIGH - LOW + 1e-12), 0), 10)) - RANK(TS_MIN(IF(GE(CLOSE, TS_QUANTILE(CLOSE,
    15, 0.75)), (HIGH - OPEN) / (HIGH - LOW + 1e-12), 0), 10)), 7)
  explanation: 对低价区下影线强度最大值与高价区上影线强度最小值的排名差进行线性衰减，捕捉极端价位下影线支撑与上影线压力在截面上的相对动态变化动量。
- name: LLM_Factor3166
  expression: RANK(TS_MEAN(IF(GT(ABS(CLOSE - VWAP) / (HIGH - LOW + 1e-12), TS_QUANTILE(ABS(CLOSE
    - VWAP) / (HIGH - LOW + 1e-12), 20, 0.75)), RET, 0), 15))
  explanation: 该因子捕捉当价格偏离日内均价幅度异常大时收益的长期排序，反映价格在极端偏离均值时潜在的反转驱动力。
- name: LLM_Factor3224
  expression: (RANK(TS_SUM(IF(LT((HIGH+LOW)/2, VWAP), VOLUME, 0), 20)) - RANK(TS_SUM(IF(GT((HIGH+LOW)/2,
    VWAP), VOLUME, 0), 20))) / (TS_STDDEV((HIGH+LOW)/2, 15) + 1e-12)
  explanation: 日内均价低于VWAP的成交量累计与高于VWAP的成交量累计的秩差，并由日内价格波动标准化，捕捉围绕VWAP成交结构失衡与价格波动的交互。
- name: LLM_Factor3245
  expression: (RANK(TS_MEAN(ABS(AMOUNT / (VOLUME + 1e-07) - DELAY(AMOUNT / (VOLUME
    + 1e-07), 1)), 20)) - RANK(TS_MIN(HIGH - LOW, 5))) / (TS_STDDEV(CLOSE, 10) + 1e-12)
  explanation: 比较平均VWAP日间波动的排名与最小日内波幅的排名之差并进行波动性标准化，寻找价格波动微弱但交易中枢却变化频繁的异常股。
- name: LLM_Factor3297
  expression: (RANK(TS_SUM(MAX(VWAP - CLOSE, 0), 10)) - RANK(TS_SUM(MAX(CLOSE - VWAP,
    0), 10))) / (TS_MEAN(HIGH - LOW, 10) + 1e-12)
  explanation: 比较收盘价低于VWAP的累计幅度与高于VWAP的累计幅度之差，用平均日内波幅调整，捕捉价格相对于市场平均成本的偏离累积效应。
- name: LLM_Factor3312
  expression: TS_MEAN(IF(LE(ABS(RET), TS_QUANTILE(ABS(RET), 20, 0.25)), VWAP - CLOSE,
    0), 15) / (TS_MAX(HIGH, 10) - TS_MIN(LOW, 10) + 1e-12)
  explanation: 在收益绝对值较小的平静期内，衡量VWAP与收盘价之差的均值，并除以价格区间进行归一化，捕捉微观定价偏差。
- name: LLM_Factor3364
  expression: DECAY_LINEAR(IF(LT(VOLUME, TS_MEAN(VOLUME, 30)), (OPEN + CLOSE) / 2
    - VWAP, 0), 8) / (TS_MAX(AMOUNT, 20) - TS_MIN(AMOUNT, 20) + 1e-07)
  explanation: 在成交量低于平均水平时，捕捉盘中均价与加权均价价差的趋势性成分，并标准化于金额极差，衡量缩量状态下市场效率与价格分歧度。
- name: LLM_Factor3498
  expression: DECAY_LINEAR(RANK(TS_MEAN(IF(AND(GE(OPEN, DELAY(CLOSE, 1)), GT(VOLUME,
    TS_MEAN(VOLUME, 20))), HIGH - LOW, 0), 15)) - RANK(TS_MEAN(IF(AND(LE(OPEN, DELAY(CLOSE,
    1)), LT(VOLUME, TS_QUANTILE(VOLUME, 20, 0.3))), HIGH - LOW, 0), 15)), 10)
  explanation: 以线性衰减加权高开高量与低开低量的波动性差异，并做横截面排名差，筛选市场预期变化与流动性格局变化的股票。
- name: LLM_Factor3593
  expression: (RANK(TS_MEAN(IF(LE(HIGH - LOW, TS_QUANTILE(HIGH - LOW, 20, 0.3)), VWAP
    - CLOSE, 0), 12)) - RANK(TS_MAX(VOLUME, 30))) / (TS_STDDEV(RET, 20) + 1e-12)
  explanation: 在低波动日捕捉VWAP与收盘价偏差的均值排名，减去成交量峰值的排名，并经收益波动率调整，识别在平静期存在定价偏差且未伴随异常放量的股票。
- name: LLM_Factor3641
  expression: RANK(CORREL(TS_ARGMAX(HIGH, 5), TS_ARGMIN(AMOUNT / (VOLUME + 1e-07),
    5), 10)) / (ABS(TS_MEAN(RET, 10)) + 1e-12)
  explanation: 排名高点与均价低点出现时点的相关性，并除以收益率均值以抑制市场整体方向影响，捕捉价格高点与低估均价同时出现的稀缺性。
- name: LLM_Factor3678
  expression: (RANK(TS_MEAN(IF(LT(ABS(OPEN - DELAY(CLOSE, 1)), TS_QUANTILE(ABS(OPEN
    - DELAY(CLOSE, 1)), 20, 0.5)), HIGH - LOW, 0), 15)) - RANK(TS_STDDEV(AMOUNT, 15)))
    / (TS_MAX(HIGH, 10) - TS_MIN(LOW, 10) + 1e-12)
  explanation: 在开盘缺口较平的平静日内，衡量价格区间的相对宽度并与成交额的波动性对比，偏好区间稳定但非流动性驱动的股票。
- name: LLM_Factor3701
  expression: TS_MEAN(CORREL(TS_ARGMAX(AMOUNT, 10), TS_ARGMIN(HIGH - LOW, 10), 5),
    15)
  explanation: 成交金额峰值出现的位置与日内波动率极小值出现的位置之间的相关性滚动均值，捕捉资金流入与市场平静期的时间联动。
- name: LLM_Factor3733
  expression: (RANK(TS_MEAN(ABS((CLOSE - TS_MEAN(CLOSE, 10)) / (TS_STDDEV(CLOSE, 10)
    + 1e-12)), 10)) - RANK(TS_QUANTILE(AMOUNT, 30, 0.8))) / (TS_STDDEV(AMOUNT, 20)
    + 1e-12)
  explanation: 该因子结合股价偏离均值的标准化程度与成交额高分位数进行截面排序，识别价格中枢性与流动性分布的综合背离，负向值可能预示中短期风险或趋势反转潜力。
- name: LLM_Factor3759
  expression: RANK(TS_STDDEV(TS_MEAN(AMOUNT, 5), 20)) / (ABS(TS_MEAN(RET, 20)) + 1e-12)
  explanation: 以近期收益均值的绝对值为分母，标准化成交金额短期均值的长期波动性，筛选出资金流波动大而价格趋势弱的股票。
- name: LLM_Factor3764
  expression: (TS_MAX(CORREL(OPEN, LOW, 8), 10) - TS_MIN(CORREL(CLOSE, HIGH, 8), 10))
    / (TS_STDDEV(RET, 15) + 1e-12)
  explanation: 衡量开盘价与最低价、收盘价与最高价相关性的极差，并用收益率波动率标准化，反映日内价格与边界联动模式的稳定性差异。
- name: LLM_Factor3784
  expression: (RANK(TS_QUANTILE(AMOUNT / VOLUME, 30, 0.75) - TS_QUANTILE(AMOUNT /
    VOLUME, 30, 0.25)) - RANK(TS_QUANTILE(VOLUME, 30, 0.75) - TS_QUANTILE(VOLUME,
    30, 0.25))) / (RANK(TS_STDDEV(CLOSE, 30)) + 1e-12)
  explanation: 对成交均价（成交额/成交量）分布的宽度（高阶分位差）与成交量分布的宽度之差进行差秩比较，并除以价格波动率，衡量市场交易质量的离散度是否主要由高价订单还是普适性交易量贡献。
- name: LLM_Factor3795
  expression: DECAY_LINEAR(IF(GT(ABS(VWAP - CLOSE), TS_STDDEV(ABS(VWAP - CLOSE), 10)),
    SIGN(OPEN - DELAY(CLOSE, 1)) * RET, 0), 12)
  explanation: 对VWAP与收盘价偏离超出历史波动时，赋予开盘相对于前收盘方向符号加权的收益率进行线性衰减，捕捉定价大幅偏离后的方向性修正动量。
- name: LLM_Factor3833
  expression: (RANK(TS_MIN(IF(GT(AMOUNT, VOLUME * TS_MEAN(CLOSE, 5)), CLOSE, OPEN),
    10)) - RANK(TS_MAX(VOLUME, 10))) / (ABS(TS_MEAN(RET, 10)) + 1e-12)
  explanation: 比较在高额成交日选取收盘价（否则用开盘价）的近期低点排序与成交量高点排序，用收益均值绝对值归一化。
- name: LLM_Factor3860
  expression: (RANK(TS_MEAN(VWAP - TS_MIN(VWAP, 5), 10)) - RANK(TS_MEAN(TS_MAX(HIGH,
    5) - CLOSE, 10))) / (TS_STDDEV(AMOUNT, 20) + 1e-12)
  explanation: 对比均价相对于近期低点的恢复强度排名与价格上行阻力排名，并经成交额波动调整，评估买方在均价支撑位的相对效力。
- name: LLM_Factor3890
  expression: (RANK(TS_QUANTILE(AMOUNT / (VOLUME + 1e-07) - CLOSE, 20, 0.9)) - RANK(TS_QUANTILE(CLOSE
    - AMOUNT / (VOLUME + 1e-07), 20, 0.1))) / (TS_STDDEV(RET, 15) + 1e-12)
  explanation: 对比成交均价高于收盘价的极端分位数排名与低于收盘价的极端分位数排名，用收益波动标准化，衡量买卖均价相对收盘价的极端非对称性。
- name: LLM_Factor3925
  expression: (RANK(TS_MEAN(CORREL(TS_RANK(OPEN, 6), TS_RANK(HIGH - LOW, 6), 5), 10))
    * RANK(TS_STDDEV(AMOUNT, 15))) / (ABS(TS_MEAN(RET, 10)) + 1e-12)
  explanation: 开盘价与日内波动的短期排名相关性均值排名，乘以成交金额波动率排名，捕捉开盘驱动波动的特质性与资金面不稳定的复合效应。
- name: LLM_Factor3957
  expression: RANK(CORREL(ABS(CLOSE - TS_MEAN(CLOSE, 5)), TS_STDDEV(VOLUME, 10), 20))
    / (ABS(TS_MEAN(RET, 10)) + 1e-12)
  explanation: 度量收盘价偏离均值的稳定性与短期成交量波动的协同性，低值为同步无序，高值预示价格偏离相对放量但波动不匹配，潜在拐点。
- name: LLM_Factor3999
  expression: (RANK(TS_MEAN(ABS(CLOSE - OPEN), 10)) - RANK(TS_SUM(VOLUME, 5))) / (TS_STDDEV(CLOSE,
    10) + 1e-12)
  explanation: 比较日内绝对价格变动均值与短期成交总量的秩差，再除以价格波动，衡量价格变化幅度与成交活跃度的不匹配程度。
- name: LLM_Factor4022
  expression: (RANK(TS_MAX(VWAP, 10) - TS_MIN(VWAP, 10)) - RANK(TS_MEAN(HIGH - LOW,
    10))) / (TS_STDDEV(AMOUNT, 10) + 1e-12)
  explanation: 比较均价在十日窗口内的波动幅度与平均日内波幅的截面排名，并用成交额波动调整，度量中期均价分布宽度相对于日内价格区间的超额变化带来的不确定性溢价。
- name: LLM_Factor4034
  expression: (RANK(TS_STDDEV(IF(AND(LE(CLOSE, VWAP), GT(VOLUME, TS_MEAN(VOLUME, 20))),
    OPEN, CLOSE), 15)) - RANK(TS_MEAN(VWAP - OPEN, 10))) / (ABS(TS_MEAN(RET, 20))
    + 1e-12)
  explanation: 比较放量收于均价之下时开盘价波动幅度与均价开盘价差均值的截面排名，用收益绝对值归一化，捕捉弱势放量下开盘行为异动与成本偏离的相对强度。
- name: LLM_Factor4108
  expression: (RANK(TS_MEAN(IF(LT(ABS(CLOSE - OPEN), TS_MEAN(HIGH - LOW, 5)), AMOUNT,
    0), 12)) - RANK(TS_MAX(HIGH - LOW, 10))) / (ABS(TS_MEAN(RET, 20)) + 1e-12)
  explanation: 比较窄幅波动日（开盘收盘接近）的成交金额与近期最大日内波幅的截面相对排名，用长期收益绝对值调整，捕捉低波动下的隐蔽资金流入强度。
- name: LLM_Factor4115
  expression: (RANK(TS_MAX(IF(GT(AMOUNT, VOLUME * TS_MEAN(CLOSE, 10)), CLOSE - OPEN,
    0), 8)) - RANK(TS_MIN(VOLUME, 10))) / (TS_STDDEV(RET, 15) + 1e-12)
  explanation: 比较高单位成交金额日的最大收益与近期最低成交量的相对排名，并用收益波动调整，识别资金效率极高但交易冷清时的价格推动潜力。
- name: LLM_Factor4203
  expression: (RANK(TS_STDDEV(IF(LT(VOLUME, TS_QUANTILE(VOLUME, 30, 0.3)), HIGH -
    LOW, 0), 20)) - RANK(TS_MEAN(CLOSE / DELAY(CLOSE, 1) - 1, 20))) / (ABS(TS_MEAN(RET,
    20)) + 1e-12)
  explanation: 衡量在成交量极低时段内股价波动性的异常变化与整体收益趋势的偏离，捕捉流动性枯竭时波动率结构突变对后续收益的预测信号。
- name: LLM_Factor4211
  expression: (RANK(TS_MEAN(IF(LT(TS_MAX(HIGH, 5) - TS_MIN(LOW, 5), TS_QUANTILE(HIGH
    - LOW, 20, 0.25)), RET, 0), 10)) - RANK(TS_STDDEV(VWAP, 15))) / (ABS(TS_MEAN(RET,
    10)) + 1e-12)
  explanation: 衡量价格在极窄波动区间内的收益均值与VWAP波动率的差异，识别波动收敛后资金成本稳定下的收益持续性。
- name: LLM_Factor4240
  expression: (RANK(TS_STDDEV(TS_MEAN(AMOUNT / (VOLUME + 1e-07), 10), 20)) - RANK(TS_MEAN(HIGH
    - LOW, 15))) / (ABS(TS_MEAN(RET, 20)) + 1e-12)
  explanation: 比较平均成交价（成交额/成交量）的长期波动性与近期平均价格波幅的截面相对排名，并用长期收益绝对值调整，识别流动性成本稳定性与价格波动之间的结构性差异。
- name: LLM_Factor4252
  expression: (RANK(TS_MAX(CLOSE, 8)) - RANK(TS_SUM(IF(LT(VWAP, CLOSE), VOLUME, 0),
    8))) / (ABS(TS_MEAN(RET, 20)) + 1e-12)
  explanation: 比较近期最高价与低于VWAP的成交量累计的截面相对排名，捕捉在价格高位下隐秘的卖方压力。
- name: LLM_Factor4287
  expression: (RANK(TS_STDDEV(IF(LT(ABS(RET), TS_STDDEV(RET, 30)), AMOUNT, 0), 15))
    - RANK(TS_MEAN(HIGH - LOW, 15))) / (ABS(TS_MEAN(RET, 20)) + 1e-12)
  explanation: 对比低波动日成交金额的稳定性与近期平均波幅的相对排名，揭示在平静市场中资金流动的隐蔽性强度。
- name: LLM_Factor4295
  expression: (RANK(TS_MEAN((HIGH - TS_MAX(HIGH, 5)) / (TS_MAX(HIGH, 5) - TS_MIN(LOW,
    5) + 0.0001), 15)) - RANK(TS_STDDEV(ABS(OPEN - DELAY(VWAP, 1)), 10))) / (ABS(TS_MEAN(RET,
    20)) + 1e-12)
  explanation: 该因子比较近期价格从阶段高点回撤幅度的平均截面排名与开盘价相对于前一日VWAP的偏离波动率排名，捕捉股价回撤乏力与开盘异常变动的背离信号。
- name: LLM_Factor4378
  expression: (RANK(TS_SUM(IF(AND(GT(AMOUNT / (VOLUME + 1e-07), TS_MEAN(AMOUNT / (VOLUME
    + 1e-07), 10)), LT(CLOSE, VWAP)), VOLUME, 0), 12)) - RANK(TS_MEAN(HIGH - LOW,
    12))) / (TS_STDDEV(CLOSE, 15) + 1e-12)
  explanation: 成交均价高于其均值但收盘价低于VWAP时的成交量累积排名减去近期价格平均波幅排名，反映高价低收（可能资金出逃或套牢盘）且交易活跃的程度，捕捉可能的假突破资金流出信号。
- name: LLM_Factor4392
  expression: (RANK(TS_MEAN(IF(LE(TS_STDDEV(AMOUNT, 10), TS_MEAN(AMOUNT, 10) * 0.1),
    VWAP - CLOSE, 0), 15)) - RANK(TS_MAX(CLOSE - OPEN, 10))) / (TS_MEAN(HIGH - LOW,
    10) + 1e-12)
  explanation: 计算在成交额波动较为稳定时期，VWAP相对于收盘价长期偏离的排名，并减去较强的日间绝对收益（跳空）排名，用以识别市场微观结构定价效率与价格行为的差异。
- name: LLM_Factor4394
  expression: (RANK(TS_MAX(IF(LT(CLOSE, VWAP), AMOUNT, 0), 10)) - RANK(TS_MEAN(IF(GT(HIGH
    - LOW, TS_MEAN(HIGH - LOW, 20)), OPEN, 0), 15))) / (ABS(TS_MEAN(RET, 25)) + 1e-12)
  explanation: 对比价格低于均价时的大额成交强度与价格波动放大时的开盘价表现，衡量卖压与异常波动之间的差异。
- name: LLM_Factor4422
  expression: (RANK(TS_SUM(IF(AND(LT(VWAP, TS_MEAN(VWAP, 20)), GT(CLOSE, OPEN)), VOLUME,
    0), 15)) * RANK(TS_MEAN(HIGH / LOW, 10))) / (ABS(TS_MEAN(RET, 15)) + 1e-12)
  explanation: 结合在加权均价低于长期均值且收盘上涨时的累积成交量排名，以及平均日内价格波动幅度排名，用收益均值标准化，捕捉价值洼地（低VWAP）中上涨放量信号与价格扩散幅度的双向增强效应。
- name: LLM_Factor4433
  expression: (RANK(TS_MAX(IF(GT(VOLUME, TS_MEAN(VOLUME, 30)), HIGH - LOW, 0), 10))
    - RANK(TS_MIN(IF(LT(VOLUME, TS_MEAN(VOLUME, 30)), HIGH - LOW, 0), 10))) / (ABS(TS_MEAN(RET,
    20)) + 1e-12)
  explanation: 对比高成交量下最大真实波幅与低成交量下最小真实波幅的相对强弱，标准化后反映放量对股价有效波动范围的扩张效应。
- name: LLM_Factor4446
  expression: (RANK(DELAY(CORREL(TS_ARGMAX(OPEN, 10), TS_ARGMIN(VWAP, 10), 5), 3))
    * RANK(TS_SUM(IF(GT(HIGH - LOW, TS_MEAN(HIGH - LOW, 15)), RET, 0), 10))) / (ABS(TS_MEAN(RET,
    20)) + 1e-12)
  explanation: 基于开盘高点与VWAP低点时序相关性的历史滞后效应与宽幅波动正收益的横截面强度进行合成，捕捉因市场微观结构间歇性扭曲所产生的多重动量共振效应。
- name: LLM_Factor4447
  expression: TS_MEAN(IF(GT(TS_RANK(AMOUNT, 5), TS_RANK(CLOSE, 5)), TS_STDDEV(VWAP,
    10), 0), 10) / (TS_STDDEV(CLOSE, 10) + 1e-12)
  explanation: 计算成交额序列排序相对于价格排序更突出时的VWAP波动浓度均值，反映资金流入活跃度领先于价格表现期间的定价不稳定性，用以识别潜在的价值重估启动点。
- name: LLM_Factor4451
  expression: TS_SUM(IF(EQ(SIGN(CLOSE - DELAY(VWAP, 1)), SIGN(OPEN - DELAY(CLOSE,
    1))), AMOUNT, -AMOUNT), 20) / (TS_SUM(AMOUNT, 20) + 1e-12)
  explanation: 累加VWAP动量方向与开盘情绪方向一致时的成交额贡献，对不一致时进行惩罚，反映方向性资金流在多周期信号协同上的持续强度与市场意见统一度。
- name: LLM_Factor4456
  expression: (RANK(TS_MAX(TS_STDDEV(OPEN, 8), 10)) * RANK(TS_MEAN(IF(AND(LT(AMOUNT,
    TS_MEAN(AMOUNT, 10)), GT(CLOSE, OPEN)), HIGH - LOW, 0), 10))) / (ABS(TS_MEAN(RET,
    12)) + 1e-12)
  explanation: 度量开盘价波动峰值与低成交上涨日波幅的交互效应，捕捉市场在缩量上涨期面临的结构性分歧与突破倾向。
- name: LLM_Factor4505
  expression: (RANK(TS_STDDEV(IF(OR(LT(CLOSE, TS_MIN(OPEN, 5)), GT(CLOSE, TS_MAX(OPEN,
    5))), HIGH - LOW, 0), 15)) - RANK(TS_MEAN(ABS(VWAP - CLOSE) / (HIGH - LOW + 1e-12),
    10))) / (TS_STDDEV(CLOSE, 12) + 1e-12)
  explanation: 开盘价突破区间后的波幅波动率排名与价格在当日区间内相对位置效率的差异，衡量突破的真实动量强度。
- name: LLM_Factor4541
  expression: (RANK(TS_SUM(IF(AND(EQ(SIGN(OPEN - DELAY(CLOSE, 1)), SIGN(CLOSE - OPEN)),
    GT(AMOUNT, TS_QUANTILE(AMOUNT, 20, 0.6))), 1, 0), 10)) - RANK(TS_MEAN(ABS(VWAP
    - CLOSE), 15))) / (TS_STDDEV(CLOSE, 10) + 1e-12)
  explanation: 比较日内情绪一致（开盘方向与日内方向同向）且大额的天数累积排名与均价偏离度平均值的排名，以价格波动标准化，捕捉一致性强且价格偏离度低的资金行为持续效应。
- name: LLM_Factor4544
  expression: (RANK(TS_SUM(IF(AND(LT(TS_RANK(LOW, 10), 0.3), GT(VOLUME, TS_MEAN(VOLUME,
    10))), CLOSE - OPEN, 0), 15)) - RANK(TS_MEAN(ABS(VWAP - OPEN), 20))) / (TS_STDDEV(RET,
    15) + 1e-12)
  explanation: 衡量低价区伴随放量的日K线实体强度，并对比其与开盘价位偏离均价的程度，识别底部放量启动的确认信号。
- name: LLM_Factor4563
  expression: (RANK(TS_MAX(VOLUME * SIGN(CLOSE - VWAP), 10)) - RANK(TS_MIN(AMOUNT
    / (VOLUME + 1e-12), 10))) / (ABS(TS_MEAN(RET, 15)) + 1e-12)
  explanation: 比较成交量与价格相对均价符号乘积的最大值排名与均价的最小值排名，经平均收益绝对值调整，捕捉放量方向一致性与交易成本极端值的相对强弱。
- name: LLM_Factor4569
  expression: (RANK(TS_MAX(IF(GT(AMOUNT, VOLUME * TS_MEAN(CLOSE, 3)), AMOUNT, 0),
    10)) - RANK(TS_MEAN(IF(LE(RET, 0), VWAP - LOW, 0), 10))) / (ABS(TS_MEAN(RET, 20))
    + 1e-12)
  explanation: 比较高单位成交金额的最大值排名与下跌日中均价接近低点的平均程度排名，经平均收益调整，衡量资金效率与下跌支撑的相对表现。
- name: LLM_Factor4583
  expression: (RANK(TS_STDDEV(IF(GT(RET, 0), AMOUNT, 0), 20)) - RANK(TS_STDDEV(IF(LE(RET,
    0), VOLUME, 0), 20))) / (TS_MAX(CLOSE, 15) - TS_MIN(CLOSE, 15) + 1e-12)
  explanation: 对比上涨日中成交额的波动性与下跌日中成交量的波动性的截面相对排名，并进行价格区间归一化，捕捉不同收益方向下资金冲击的稳定性差异。
- name: LLM_Factor4587
  expression: (RANK(TS_STDDEV(IF(AND(GE(VOLUME, TS_MEAN(VOLUME, 10)), LE(ABS(CLOSE
    - OPEN), TS_MEAN(HIGH - LOW, 5) * 0.5)), VWAP, AMOUNT / (VOLUME + 1e-07)), 15))
    - RANK(TS_QUANTILE(TS_MAX(HIGH, 5) - TS_MIN(LOW, 5), 20, 0.7))) / (TS_MEAN(ABS(RET),
    10) + 1e-12)
