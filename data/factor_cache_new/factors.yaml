  explanation: 对高开低量时的成交均价波动进行近期衰减加权，再与价格偏离价值中枢的最大距离对比，衡量缩量上冲时的价格稳定性与潜在分歧。
- name: LLM_Factor5480
  expression: RANK(TS_STDDEV(TS_MAX(IF(LT(CLOSE, TS_MIN(VWAP, 5)), HIGH-LOW, 0), 8),
    12)) / (ABS(TS_MEAN(IF(GT(VOLUME, TS_MEAN(VOLUME, 15)), RET, 0), 10)) + 1e-12)
  explanation: 衡量价格低于短期VWAP时的日内波幅最大值的波动率，除以放量期间的平均收益绝对值，反映弱势环境下波动放大与资金推动收益的比率。
- name: LLM_Factor5512
  expression: (RANK(TS_QUANTILE(TS_MEAN(VWAP, 3), 20, 0.75)) - RANK(TS_QUANTILE(TS_MEAN(CLOSE,
