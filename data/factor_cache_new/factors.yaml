  explanation: 对比低成交量下最大波幅与高成交量下均价强度的相对排名，捕捉在流动性不足时价格波动扩大与活跃时价格效率提升的背离信号。
- name: LLM_Factor5242
  expression: (RANK(TS_SUM(IF(AND(GE(CLOSE, OPEN), LT(HIGH-CLOSE, CLOSE-LOW)), VOLUME,
    0), 20)) - RANK(TS_MEAN(IF(AND(LE(CLOSE, OPEN), GT(HIGH-CLOSE, CLOSE-LOW)), AMOUNT,
    0), 20))) / (ABS(TS_MEAN(RET, 10)) + 1e-12)
  explanation: 度量收阳且收盘位于日内高区的买入量累积，并对比收阴且收盘偏低的卖出金额，捕捉买方力量集中与卖方压力分散的净优势。
- name: LLM_Factor5248
  expression: (RANK(TS_SUM(IF(AND(LT(CLOSE, TS_MEAN(CLOSE, 5)), GT(AMOUNT/VOLUME,
