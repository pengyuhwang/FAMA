- name: LLM_Factor10132
  expression: RANK(TS_MEAN(CORREL(TS_ARGMIN(HIGH, 5), TS_ARGMAX(LOW, 5), 10), 8))
    * RANK(TS_STDDEV(IF(GT(TS_RANK(VOLUME, 10), 0.8), VWAP - OPEN, OPEN - VWAP), 10))
    / (ABS(TS_MEAN(RET, 20)) + 1e-12)
  explanation: 衡量高低价时间位置不对称性与特定成交量水平下VWAP偏离方向的波动性，捕捉市场非对称成本压力与成交活跃度变化耦合的选股机会。
- name: LLM_Factor10217
  expression: (RANK(TS_MAX(IF(AND(GE(OPEN, DELAY(CLOSE, 1)), LT(CLOSE, VWAP)), HIGH
    - LOW, 0), 10)) - RANK(TS_MEAN(IF(AND(LE(OPEN, DELAY(CLOSE, 1)), GT(CLOSE, VWAP)),
    VOLUME, 0), 10))) / (ABS(TS_MEAN(RET, 12)) + 1e-12)
  explanation: 捕捉高开低走（收盘低于均价）情况下的日内波动范围，与低开高走（收盘高于均价）情况下的平均成交量，通过排名差反映市场对隔夜消息的矫正行为效率。
- name: LLM_Factor10284
  expression: (RANK(TS_SUM(IF(GE(RET, TS_QUANTILE(RET, 20, 0.6)), VWAP - TS_MIN(LOW,
    3), 0), 12)) - RANK(TS_MEAN(IF(LE(AMOUNT, TS_MEAN(AMOUNT, 10)), CLOSE - VWAP,
    0), 15))) / (ABS(TS_MEAN(RET, 10)) + 1e-12)
  explanation: 对比强势日成交均价对近期低点的提升幅度与低成交额日收盘价相对于均价的溢价均值，识别有效突破与低效溢价的相对强度。
- name: LLM_Factor10286
  expression: ((RANK(TS_MEAN(IF(LT(CLOSE, VWAP), (HIGH - LOW) / (CLOSE + 1e-12), 0),
    10)) - RANK(TS_STDDEV(IF(GT(CLOSE, VWAP), VOLUME, 0), 15))) / (ABS(TS_MEAN(RET,
    20)) + 1e-12)) * -1
  explanation: 计算弱势区日相对波幅的均值排名与强势区成交量波动性排名的负向差值，反映抛压下波幅扩大与上涨时量能不稳定的风险对比。
- name: LLM_Factor10325
  expression: (RANK(TS_MEAN(IF(LE(ABS(CLOSE - VWAP) / (HIGH - LOW + 1e-12), TS_QUANTILE(ABS(CLOSE
    - VWAP) / (HIGH - LOW + 1e-12), 20, 0.3)), AMOUNT, 0), 12)) - RANK(TS_STDDEV(LOG(VOLUME
    / (DELAY(VOLUME, 1) + 1e-12) + 1), 15))) / (ABS(TS_MEAN(RET, 20)) + 1e-12)
  explanation: 衡量在价格接近日内均价（相对波动区间位置）时的成交金额强度，减去成交量变化率的波动性，识别在定价平衡区域资金流入稳定的股票。
- name: LLM_Factor10418
  expression: RANK(TS_STDDEV(IF(GT(AMOUNT, TS_MEAN(AMOUNT, 10) * 1.2), CLOSE - OPEN,
    0), 15)) - RANK(TS_MEAN(IF(LT(VOLUME, TS_QUANTILE(VOLUME, 20, 0.4)), HIGH - LOW,
    0), 15))
  explanation: 比较高成交额下价格净变动的波动率与低成交量下价格区间宽度的均值的截面排名，识别大额交易引发的价格变动不稳定性和清淡市场中自然波动的相对关系。
