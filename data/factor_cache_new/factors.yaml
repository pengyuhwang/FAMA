    20)) + 1e-12)
  explanation: 在价格高于均价且波动收窄时，寻找成交量峰值，减去隔夜收益，捕捉缩量突破中的资金确认信号。
- name: LLM_Factor5112
  expression: IF(GT(CORREL(TS_ARGMIN(VOLUME, 10), TS_ARGMAX(HIGH, 10), 15), 0.3),
    TS_MEAN(CLOSE - LOW, 5), TS_MEAN(HIGH - CLOSE, 5))
  explanation: 根据低量点与高点出现时间的正相关性，选择性地衡量下方支撑强度或上方阻力强度，适应不同市场结构。
- name: LLM_Factor5123
  expression: (RANK(TS_SUM(IF(AND(GE(VWAP, TS_MEAN(VWAP, 10)), LT(CLOSE, TS_MIN(LOW,
