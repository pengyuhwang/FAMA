    - TS_MIN(LOW, 10), 0), 10))) / (TS_STDDEV(CLOSE, 10) + 1e-12)
  explanation: 衡量成交均价截面排名低位时价格扩张性与成交量排名高位时下探支撑深度的差异，揭示价格高波与流动性涌入带来的底部确认信号强度。
- name: LLM_Factor5452
  expression: (RANK(TS_STDDEV(IF(AND(GE(CORREL(RET, VOLUME, 5), 0.2), LT(CLOSE, TS_MAX(OPEN,
    10))), AMOUNT, 0), 20)) - RANK(TS_QUANTILE(TS_MAX(VWAP, 10) - TS_MIN(VWAP, 10),
    30, 0.25))) / (ABS(TS_MEAN(RET, 15)) + 1e-12)
  explanation: 度量收益率与成交量正相关但价格未突破前期开盘高点的资金流离散程度，结合VWAP波幅低分位数，捕捉动能受阻下的资金结构性分化。
- name: LLM_Factor5467
  expression: (RANK(TS_MEAN(IF(AND(LE(OPEN, DELAY(VWAP, 1)), GT(HIGH - LOW, TS_MEAN(HIGH
    - LOW, 5))), TS_RANK(AMOUNT, 8), 0), 12)) - RANK(TS_MAX(IF(GT(CLOSE, VWAP), VOLUME,
    0), 10))) / (DELAY(TS_STDDEV(RET, 8), 2) + 1e-12)
  explanation: 整合开盘弱势但日波动扩大的资金流排名与收盘强势期成交量动量，提取阶段转换时的反向资金信号。
- name: LLM_Factor5475
  expression: (RANK(DECAY_LINEAR(TS_STDDEV(IF(AND(GT(OPEN, DELAY(CLOSE, 1)), LT(VOLUME,
