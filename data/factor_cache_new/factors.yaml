  explanation: 对比收盘连续高于开盘时成交均价的衰减波动性与收盘连续低于开盘时价格波幅的均值排名，衡量趋势延续中定价效率的稳定性与弱势中波动扩张的对比。
- name: LLM_Factor5451
  expression: (RANK(TS_MEAN(IF(LT(TS_RANK(AMOUNT/(VOLUME+1e-07), 10), 0.2), TS_MAX(HIGH,
