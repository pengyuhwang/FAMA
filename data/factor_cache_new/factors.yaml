  explanation: 下跌日成交均价的波动性排名与上涨日平均波幅排名的差，衡量下跌时的价格执行成本波动与上涨时波动空间的相对关系。
- name: LLM_Factor5240
  expression: (RANK(TS_MAX(IF(LT(VOLUME, TS_MEAN(VOLUME, 20)), HIGH-LOW, 0), 10))
    - RANK(TS_MEAN(IF(GT(VOLUME, TS_MEAN(VOLUME, 20)), AMOUNT/VOLUME, 0), 10))) /
