  explanation: 结合低价区上涨放量与下跌缩量的净累积量，并对比开盘跳空程度，捕捉底部区域的资金流向强度。
- name: LLM_Factor5111
  expression: (RANK(TS_MAX(IF(AND(GT(CLOSE, VWAP), LE(HIGH - LOW, TS_MEAN(HIGH - LOW,
