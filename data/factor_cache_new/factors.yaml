    - CLOSE), 0), 10))) / (TS_STDDEV(CLOSE, 20) + 1e-12)
  explanation: 对比成交重心高于其均值但收盘价创新低时短期均量累积排名与开盘强于收盘日绝对收益的均值排名，反映趋势性破位伴随量能放大的有效性信号。
- name: LLM_Factor5125
  expression: (TS_STDDEV(IF(LT(TS_MEAN(CLOSE, 3), VWAP), VOLUME, 0), 15) - TS_STDDEV(IF(GT(TS_MEAN(CLOSE,
